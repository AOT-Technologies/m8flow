<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d">
  <title id="t">Sign-in and tenant selection</title>
  <desc id="d">Three participants: the designer in the browser, the m8flow-backend, and Keycloak. 1. The designer sends the browser to GET /v1.0/login. 2. The backend redirects to the Keycloak sign-in page for the shared realm. 3. Keycloak shows one page that asks for the username and password. 4. Keycloak redirects to GET /v1.0/login_return with a code. 5. The backend exchanges the code for tokens. 6. The backend sets the access_token and id_token cookies. 7. The designer finalizes the tenant: one organization is chosen automatically, several mean the user picks one. 8. The backend sets the m8flow_selected_tenant cookie and re-mints the token for that tenant. Platform admins use Platform Admin Sign In to reach the master realm instead. Messages fade in one after another; the sign-in page stays in place.</desc>
  <style>
    text { font-family: Inter, 'SF Pro Text', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #111827; }
    .t { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
    .b { font-size: 11.5px; fill: #6b7280; }
    .k { font-size: 10px; font-weight: 600; fill: #9ca3af; letter-spacing: 0.08em; }
    .m { font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 11px; fill: #6b7280; }
    .mi { font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 11px; fill: #111827; }
    .ln { fill: none; stroke: #d1d5db; stroke-width: 1; }
    .er { fill: none; stroke: #e01d5a; stroke-width: 1; stroke-opacity: .45; }
    .route { offset-rotate: 0deg; opacity: 0; }
    .hl { opacity: 0; animation: hl var(--d, 6s) ease-in-out infinite; animation-delay: var(--w, 0s); }
    .in { opacity: 0; animation: fadein var(--d, 8s) ease-out infinite; animation-delay: var(--w, 0s); }
    @keyframes hl { 0%, 22%, 100% { opacity: 0; } 4%, 16% { opacity: 1; } }
    @keyframes fadein { 0% { opacity: 0; transform: translateY(4px); } 8%, 82% { opacity: 1; transform: none; }
                        92%, 100% { opacity: 0; } }
    .bar { transform-box: fill-box; transform-origin: left; animation: grow 8s ease-in-out infinite; }
    @keyframes grow { 0% { transform: scaleX(0); } 70%, 90% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
    @media (prefers-reduced-motion: reduce) {
      .hl, .route { animation: none !important; opacity: 0; }
      .in, .bar { animation: none; opacity: 1; }
    }
  </style>
  <rect width="960" height="520" rx="12" fill="#ffffff"/>
  <rect x=".5" y=".5" width="959" height="519" rx="12" fill="none" stroke="#e5e7eb"/>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="#d1d5db"/></marker></defs>
  <path class="ln" d="M150 108 L150 466"/>
  <path class="ln" d="M480 108 L480 466"/>
  <g class="in" style="--d: 10s; --w: 0.0s">
  <path class="ln" d="M150 140 L477 140" marker-end="url(#a)"/>
  <text x="315.0" y="132" class="m" text-anchor="middle">GET /v1.0/login</text>
  </g>
  <g class="in" style="--d: 10s; --w: 0.8s">
  <path class="ln" d="M480 184 L807 184" marker-end="url(#a)"/>
  <text x="645.0" y="176" class="b" text-anchor="middle">redirect to the shared realm</text>
  </g>
  <path class="ln" d="M810 108 L810 206"/>
  <path class="ln" d="M810 250 L810 466"/>
  <rect x="695" y="206" width="230" height="44" rx="7" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="709" y="225.0" class="t" text-anchor="start">Sign-in page</text>
  <text x="709" y="241.0" class="b" text-anchor="start">username and password on one page</text>
  <g class="in" style="--d: 10s; --w: 2.4s">
  <path class="ln" d="M810 272 L483 272" marker-end="url(#a)"/>
  <text x="645.0" y="264" class="m" text-anchor="middle">GET /v1.0/login_return?code</text>
  </g>
  <g class="in" style="--d: 10s; --w: 3.2s">
  <path class="ln" d="M480 316 L807 316" marker-end="url(#a)"/>
  <text x="645.0" y="308" class="b" text-anchor="middle">exchange the code for tokens</text>
  </g>
  <g class="in" style="--d: 10s; --w: 4.0s">
  <path class="ln" d="M480 360 L153 360" marker-end="url(#a)"/>
  <text x="315.0" y="352" class="b" text-anchor="middle">access_token · id_token cookies</text>
  </g>
  <g class="in" style="--d: 10s; --w: 4.8s">
  <path class="ln" d="M150 404 L477 404" marker-end="url(#a)"/>
  <text x="315.0" y="396" class="m" text-anchor="middle">GET /v1.0/login?tenant=&lt;alias&gt;</text>
  </g>
  <g class="in" style="--d: 10s; --w: 5.6s">
  <path class="ln" d="M480 448 L153 448" marker-end="url(#a)"/>
  <text x="315.0" y="440" class="m" text-anchor="middle">m8flow_selected_tenant cookie</text>
  </g>
  <rect x="60.0" y="58" width="180" height="50" rx="7" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="150.0" y="87.5" class="t" text-anchor="middle">Designer</text>
  <rect x="390.0" y="58" width="180" height="50" rx="7" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="480.0" y="87.5" class="mi" text-anchor="middle">m8flow-backend</text>
  <rect x="720.0" y="58" width="180" height="50" rx="7" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="810.0" y="87.5" class="t" text-anchor="middle">Keycloak</text>
  <text x="32" y="40" class="k" text-anchor="start">SHARED REALM SIGN-IN</text>
  <text x="32" y="494" class="b" text-anchor="start">Platform admins click Platform Admin Sign In on the Keycloak page to use the master realm.</text>
</svg>
