<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="960" height="250" role="img" aria-labelledby="t d">
  <title id="t">Request path through the backend</title>
  <desc id="d">A request from the designer is authenticated, bound to a tenant, and authorized, then a host module handles it and calls the engine. Authentication verifies the token and finds the local user. Tenant binding reads the m8flow_selected_tenant cookie and sets the PostgreSQL tenant for row-level security. Authorization checks the permission policy for the URI and method. A success response commits the database session. The red path shows a refused request: a 4xx or 5xx response rolls the session back. The blue dot shows a request that succeeds.</desc>
  <style>
    text { font-family: Inter, 'SF Pro Text', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #111827; }
    .t { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
    .b { font-size: 11.5px; fill: #6b7280; }
    .k { font-size: 10px; font-weight: 600; fill: #9ca3af; letter-spacing: 0.08em; }
    .m { font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 11px; fill: #6b7280; }
    .mi { font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 11px; fill: #111827; }
    .ln { fill: none; stroke: #d1d5db; stroke-width: 1; }
    .er { fill: none; stroke: #e01d5a; stroke-width: 1; stroke-opacity: .45; }
    .route { offset-rotate: 0deg; opacity: 0; }
    .hl { opacity: 0; animation: hl var(--d, 6s) ease-in-out infinite; animation-delay: var(--w, 0s); }
    .in { opacity: 0; animation: fadein var(--d, 8s) ease-out infinite; animation-delay: var(--w, 0s); }
    @keyframes hl { 0%, 22%, 100% { opacity: 0; } 4%, 16% { opacity: 1; } }
    @keyframes fadein { 0% { opacity: 0; transform: translateY(4px); } 8%, 82% { opacity: 1; transform: none; }
                        92%, 100% { opacity: 0; } }
    .bar { transform-box: fill-box; transform-origin: left; animation: grow 8s ease-in-out infinite; }
    @keyframes grow { 0% { transform: scaleX(0); } 70%, 90% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
    @media (prefers-reduced-motion: reduce) {
      .hl, .route { animation: none !important; opacity: 0; }
      .in, .bar { animation: none; opacity: 1; }
    }
  </style>
  <rect width="960" height="250" rx="12" fill="#ffffff"/>
  <rect x=".5" y=".5" width="959" height="249" rx="12" fill="none" stroke="#e5e7eb"/>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="#d1d5db"/></marker></defs>
  <text x="32" y="44" class="k" text-anchor="start">REQUEST</text>
  <text x="836" y="44" class="k" text-anchor="start">OUTCOME</text>
  <path class="ln" d="M168 125 L672 125"/>
  <path class="ln" d="M808 125 L822 125 L822 87"/>
  <path class="er" d="M822 125 L822 163"/>
  <path class="er" d="M580.0 150 L580.0 216 L886.0 216"/>
  <style>@keyframes r6 { 0% { offset-distance: 0%; opacity: 0; } 1% { opacity: 1; } 48.05% { opacity: 1; } 49.05% { offset-distance: 100%; opacity: 0; } 100% { offset-distance: 100%; opacity: 0; } }</style>
  <circle class="route" r="3" fill="#1a9fc8" style="offset-path: path('M100.0 125 L822 125 L822 87 L886.0 87'); animation: r6 7s linear 0.0s infinite"/>
  <g class="hl" style="--d: 7s; --w: 0.32s"><rect x="192" y="100" width="136" height="50" rx="7" fill="#e8f6fb" stroke="#1a9fc8" stroke-opacity=".5"/></g>
  <g class="hl" style="--d: 7s; --w: 0.98s"><rect x="352" y="100" width="136" height="50" rx="7" fill="#e8f6fb" stroke="#1a9fc8" stroke-opacity=".5"/></g>
  <g class="hl" style="--d: 7s; --w: 1.65s"><rect x="512" y="100" width="136" height="50" rx="7" fill="#e8f6fb" stroke="#1a9fc8" stroke-opacity=".5"/></g>
  <g class="hl" style="--d: 7s; --w: 2.32s"><rect x="672" y="100" width="136" height="50" rx="7" fill="#e8f6fb" stroke="#1a9fc8" stroke-opacity=".5"/></g>
  <g class="hl" style="--d: 7s; --w: 3.08s"><rect x="836" y="62" width="100" height="50" rx="7" fill="#e8f6fb" stroke="#1a9fc8" stroke-opacity=".5"/></g>
  <style>@keyframes r13 { 0% { offset-distance: 0%; opacity: 0; } 1% { opacity: 1; } 24.30% { opacity: 1; } 25.30% { offset-distance: 100%; opacity: 0; } 100% { offset-distance: 100%; opacity: 0; } }</style>
  <circle class="route" r="3" fill="#e01d5a" style="offset-path: path('M580.0 125 L580.0 216 L886.0 216 L886.0 188'); animation: r13 7s linear 3.73s infinite"/>
  <rect x="32" y="100" width="136" height="50" rx="7" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="46" y="122.0" class="t" text-anchor="start">Designer</text>
  <text x="46" y="138.0" class="m" text-anchor="start">/v1.0 proxy</text>
  <rect x="192" y="100" width="136" height="50" rx="7" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="206" y="122.0" class="t" text-anchor="start">Authenticate</text>
  <text x="206" y="138.0" class="b" text-anchor="start">token · local user</text>
  <rect x="352" y="100" width="136" height="50" rx="7" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="366" y="122.0" class="t" text-anchor="start">Bind tenant</text>
  <text x="366" y="138.0" class="b" text-anchor="start">cookie → RLS tenant</text>
  <rect x="512" y="100" width="136" height="50" rx="7" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="526" y="122.0" class="t" text-anchor="start">Authorize</text>
  <text x="526" y="138.0" class="b" text-anchor="start">URI + method</text>
  <rect x="672" y="100" width="136" height="50" rx="7" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="686" y="122.0" class="t" text-anchor="start">Host module</text>
  <text x="686" y="138.0" class="b" text-anchor="start">calls the engine</text>
  <rect x="836" y="62" width="100" height="50" rx="7" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="850" y="84.0" class="t" text-anchor="start">Commit</text>
  <text x="850" y="100.0" class="b" text-anchor="start">2xx</text>
  <rect x="836" y="138" width="100" height="50" rx="7" fill="#ffffff" stroke="#e01d5a"/>
  <text x="850" y="160.0" class="t" text-anchor="start">Roll back</text>
  <text x="850" y="176.0" class="b" text-anchor="start">4xx or 5xx</text>
  <path class="ln" d="M168 125 L192 125" marker-end="url(#a)"/>
  <path class="ln" d="M328 125 L352 125" marker-end="url(#a)"/>
  <path class="ln" d="M488 125 L512 125" marker-end="url(#a)"/>
  <path class="ln" d="M648 125 L672 125" marker-end="url(#a)"/>
  <path class="ln" d="M822 87 L836 87" marker-end="url(#a)"/>
  <path class="er" d="M822 163 L836 163" marker-end="url(#a)"/>
  <path class="er" d="M886.0 216 L886.0 188" marker-end="url(#a)"/>
  <text x="590.0" y="208" class="b" text-anchor="start">refused: 403</text>
</svg>
