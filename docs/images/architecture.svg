<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 496" width="1080" height="496" role="img" aria-labelledby="t d">
  <title id="t">m8flow components</title>
  <desc id="d">Callers on the left reach the m8flow-backend in the middle. A browser goes through m8flow-designer, which forwards /v1.0 calls. An optional AI client goes through the m8flow-mcp server. An external system calls the backend directly with a tenant API key. Inside the backend, routes call the host modules, which call the m8flow-bpmn-core engine in the same process. On the right, the backend uses PostgreSQL with row-level security per tenant, Keycloak for the shared and master realms, and Redis as the Celery broker. MinIO holds the seed process models and templates. Along the bottom, the backend hands work to the Celery worker for timers and background jobs, to m8flow-node-wire-proxy for service-task calls to external APIs, to the NATS consumer for event triggers, and sends telemetry to the observability stack. A yellow dot marks an optional service. The blue dot shows a browser request travelling to PostgreSQL.</desc>
  <style>
    text { font-family: Inter, 'SF Pro Text', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #111827; }
    .t { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
    .b { font-size: 11.5px; fill: #6b7280; }
    .k { font-size: 10px; font-weight: 600; fill: #9ca3af; letter-spacing: 0.08em; }
    .m { font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 11px; fill: #6b7280; }
    .mi { font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 11px; fill: #111827; }
    .ln { fill: none; stroke: #d1d5db; stroke-width: 1; }
    .er { fill: none; stroke: #e01d5a; stroke-width: 1; stroke-opacity: .45; }
    .route { offset-rotate: 0deg; opacity: 0; }
    .hl { opacity: 0; animation: hl var(--d, 6s) ease-in-out infinite; animation-delay: var(--w, 0s); }
    .in { opacity: 0; animation: fadein var(--d, 8s) ease-out infinite; animation-delay: var(--w, 0s); }
    @keyframes hl { 0%, 22%, 100% { opacity: 0; } 4%, 16% { opacity: 1; } }
    @keyframes fadein { 0% { opacity: 0; transform: translateY(4px); } 8%, 82% { opacity: 1; transform: none; }
                        92%, 100% { opacity: 0; } }
    .bar { transform-box: fill-box; transform-origin: left; animation: grow 8s ease-in-out infinite; }
    @keyframes grow { 0% { transform: scaleX(0); } 70%, 90% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
    @media (prefers-reduced-motion: reduce) {
      .hl, .route { animation: none !important; opacity: 0; }
      .in, .bar { animation: none; opacity: 1; }
    }
  </style>
