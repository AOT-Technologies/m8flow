<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="960" height="250" role="img" aria-labelledby="t d">
  <title id="t">Service task at run time</title>
  <desc id="d">When the engine reaches a service task, the host prepares the request in order. It fills empty parameters from the connector profile named by m8flow_profile, then replaces each M8FLOW_SECRET:&lt;key&gt; sentinel with the tenant&#x27;s stored secret. It sends the request to the connector proxy with the shared API key, and the proxy calls the external API. The red path shows a missing secret: the task fails rather than send the literal sentinel, and secret values are removed from the error. The blue dot shows a request that succeeds.</desc>
  <style>
    text { font-family: Inter, 'SF Pro Text', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #111827; }
    .t { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
    .b { font-size: 11.5px; fill: #6b7280; }
    .k { font-size: 10px; font-weight: 600; fill: #9ca3af; letter-spacing: 0.08em; }
    .m { font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 11px; fill: #6b7280; }
    .mi { font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 11px; fill: #111827; }
    .ln { fill: none; stroke: #d1d5db; stroke-width: 1; }
    .er { fill: none; stroke: #e01d5a; stroke-width: 1; stroke-opacity: .45; }
    .route { offset-rotate: 0deg; opacity: 0; }
    .hl { opacity: 0; animation: hl var(--d, 6s) ease-in-out infinite; animation-delay: var(--w, 0s); }
    .in { opacity: 0; animation: fadein var(--d, 8s) ease-out infinite; animation-delay: var(--w, 0s); }
    @keyframes hl { 0%, 22%, 100% { opacity: 0; } 4%, 16% { opacity: 1; } }
    @keyframes fadein { 0% { opacity: 0; transform: translateY(4px); } 8%, 82% { opacity: 1; transform: none; }
                        92%, 100% { opacity: 0; } }
    .bar { transform-box: fill-box; transform-origin: left; animation: grow 8s ease-in-out infinite; }
    @keyframes grow { 0% { transform: scaleX(0); } 70%, 90% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
    @media (prefers-reduced-motion: reduce) {
      .hl, .route { animation: none !important; opacity: 0; }
      .in, .bar { animation: none; opacity: 1; }
    }
  </style>
  <rect width="960" height="250" rx="12" fill="#ffffff"/>
  <rect x=".5" y=".5" width="959" height="249" rx="12" fill="none" stroke="#e5e7eb"/>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="#d1d5db"/></marker></defs>
  <text x="42" y="44" class="k" text-anchor="start">ENGINE</text>
  <text x="222" y="44" class="k" text-anchor="start">HOST FILLS IN</text>
  <text x="582" y="44" class="k" text-anchor="start">OUTSIDE THE HOST</text>
  <path class="ln" d="M198 121 L762 121"/>
  <style>@keyframes r4 { 0% { offset-distance: 0%; opacity: 0; } 1% { opacity: 1; } 41.86% { opacity: 1; } 42.86% { offset-distance: 100%; opacity: 0; } 100% { offset-distance: 100%; opacity: 0; } }</style>
  <circle class="route" r="3" fill="#1a9fc8" style="offset-path: path('M120.0 121 L840.0 121'); animation: r4 7s linear 0.0s infinite"/>
  <g class="hl" style="--d: 7s; --w: 0.4s"><rect x="222" y="96" width="156" height="50" rx="7" fill="#e8f6fb" stroke="#1a9fc8" stroke-opacity=".5"/></g>
  <g class="hl" style="--d: 7s; --w: 1.15s"><rect x="402" y="96" width="156" height="50" rx="7" fill="#e8f6fb" stroke="#1a9fc8" stroke-opacity=".5"/></g>
  <g class="hl" style="--d: 7s; --w: 1.9s"><rect x="582" y="96" width="156" height="50" rx="7" fill="#e8f6fb" stroke="#1a9fc8" stroke-opacity=".5"/></g>
  <g class="hl" style="--d: 7s; --w: 2.65s"><rect x="762" y="96" width="156" height="50" rx="7" fill="#e8f6fb" stroke="#1a9fc8" stroke-opacity=".5"/></g>
  <style>@keyframes r10 { 0% { offset-distance: 0%; opacity: 0; } 1% { opacity: 1; } 4.00% { opacity: 1; } 5.00% { offset-distance: 100%; opacity: 0; } 100% { offset-distance: 100%; opacity: 0; } }</style>
  <circle class="route" r="3" fill="#e01d5a" style="offset-path: path('M480.0 121 L480.0 205'); animation: r10 7s linear 3.3s infinite"/>
  <rect x="42" y="96" width="156" height="50" rx="7" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="56" y="118.0" class="t" text-anchor="start">Service task</text>
  <text x="56" y="134.0" class="b" text-anchor="start">engine reaches it</text>
  <rect x="222" y="96" width="156" height="50" rx="7" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="236" y="118.0" class="t" text-anchor="start">Connector profile</text>
  <text x="236" y="134.0" class="m" text-anchor="start">m8flow_profile</text>
  <rect x="402" y="96" width="156" height="50" rx="7" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="416" y="118.0" class="t" text-anchor="start">Secrets</text>
  <text x="416" y="134.0" class="m" text-anchor="start">M8FLOW_SECRET:&lt;key&gt;</text>
  <rect x="582" y="96" width="156" height="50" rx="7" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="596" y="118.0" class="t" text-anchor="start">Connector proxy</text>
  <text x="596" y="134.0" class="b" text-anchor="start">node-wire · API key</text>
  <rect x="762" y="96" width="156" height="50" rx="7" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="776" y="118.0" class="t" text-anchor="start">External API</text>
  <text x="776" y="134.0" class="b" text-anchor="start">HTTP · SMTP · Slack</text>
  <rect x="380" y="180" width="200" height="50" rx="7" fill="#ffffff" stroke="#e01d5a"/>
  <text x="394" y="202.0" class="t" text-anchor="start">Task fails</text>
  <text x="394" y="218.0" class="b" text-anchor="start">secret values masked</text>
  <path class="ln" d="M198 121 L222 121" marker-end="url(#a)"/>
  <path class="ln" d="M378 121 L402 121" marker-end="url(#a)"/>
  <path class="ln" d="M558 121 L582 121" marker-end="url(#a)"/>
  <path class="ln" d="M738 121 L762 121" marker-end="url(#a)"/>
  <path class="er" d="M480.0 146 L480.0 180" marker-end="url(#a)"/>
  <text x="490.0" y="166" class="b" text-anchor="start">missing secret</text>
</svg>
