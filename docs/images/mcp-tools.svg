<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-labelledby="t d">
  <title id="t">MCP Tools request path</title>
  <desc id="d">The MCP Tools page in the designer calls the m8flow-backend with your token. The backend checks your admin grant, then forwards the same token to the m8flow-mcp server, which lists and runs tools. Tools call back into the backend REST API to do their work. Keycloak issues your token at sign-in. An optional AI client, such as Claude Code or Cursor, connects to the MCP server directly with its own token, shown by the yellow dot. The blue dot shows a tool call travelling from the page to the MCP server.</desc>
  <style>
    text { font-family: Inter, 'SF Pro Text', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #111827; }
    .t { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
    .b { font-size: 11.5px; fill: #6b7280; }
    .k { font-size: 10px; font-weight: 600; fill: #9ca3af; letter-spacing: 0.08em; }
    .m { font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 11px; fill: #6b7280; }
    .mi { font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 11px; fill: #111827; }
    .ln { fill: none; stroke: #d1d5db; stroke-width: 1; }
    .er { fill: none; stroke: #e01d5a; stroke-width: 1; stroke-opacity: .45; }
    .route { offset-rotate: 0deg; opacity: 0; }
    .hl { opacity: 0; animation: hl var(--d, 6s) ease-in-out infinite; animation-delay: var(--w, 0s); }
    .in { opacity: 0; animation: fadein var(--d, 8s) ease-out infinite; animation-delay: var(--w, 0s); }
    @keyframes hl { 0%, 22%, 100% { opacity: 0; } 4%, 16% { opacity: 1; } }
    @keyframes fadein { 0% { opacity: 0; transform: translateY(4px); } 8%, 82% { opacity: 1; transform: none; }
                        92%, 100% { opacity: 0; } }
    .bar { transform-box: fill-box; transform-origin: left; animation: grow 8s ease-in-out infinite; }
    @keyframes grow { 0% { transform: scaleX(0); } 70%, 90% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
    @media (prefers-reduced-motion: reduce) {
      .hl, .route { animation: none !important; opacity: 0; }
      .in, .bar { animation: none; opacity: 1; }
    }
  </style>
  <rect width="960" height="300" rx="12" fill="#ffffff"/>
  <rect x=".5" y=".5" width="959" height="299" rx="12" fill="none" stroke="#e5e7eb"/>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="#d1d5db"/></marker></defs>
  <text x="40" y="50" class="k" text-anchor="start">BROWSER</text>
  <text x="360" y="50" class="k" text-anchor="start">HOST</text>
  <text x="680" y="50" class="k" text-anchor="start">MCP SERVER</text>
  <path class="ln" d="M280 105 L680 105"/>
  <path class="ln" d="M760.0 130 L760.0 172 L480.0 172"/>
  <style>@keyframes r5 { 0% { offset-distance: 0%; opacity: 0; } 1% { opacity: 1; } 43.44% { opacity: 1; } 44.44% { offset-distance: 100%; opacity: 0; } 100% { offset-distance: 100%; opacity: 0; } }</style>
  <circle class="route" r="3" fill="#1a9fc8" style="offset-path: path('M160.0 105 L800.0 105'); animation: r5 6s linear 0.0s infinite"/>
  <g class="hl" style="--d: 6s; --w: 0.98s"><rect x="360" y="80" width="240" height="50" rx="7" fill="#e8f6fb" stroke="#1a9fc8" stroke-opacity=".5"/></g>
  <g class="hl" style="--d: 6s; --w: 2.32s"><rect x="680" y="80" width="240" height="50" rx="7" fill="#e8f6fb" stroke="#1a9fc8" stroke-opacity=".5"/></g>
  <rect x="40" y="80" width="240" height="50" rx="7" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="54" y="102.0" class="t" text-anchor="start">MCP Tools page</text>
  <text x="54" y="118.0" class="b" text-anchor="start">m8flow-designer · /mcp-tools</text>
  <rect x="360" y="80" width="240" height="50" rx="7" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="374" y="102.0" class="mi" text-anchor="start">m8flow-backend</text>
  <text x="374" y="118.0" class="b" text-anchor="start">checks your admin grant</text>
  <rect x="680" y="80" width="240" height="50" rx="7" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="694" y="102.0" class="mi" text-anchor="start">m8flow-mcp</text>
  <text x="694" y="118.0" class="b" text-anchor="start">lists and runs tools · :8000</text>
  <rect x="40" y="210" width="240" height="50" rx="7" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="54" y="232.0" class="t" text-anchor="start">Keycloak</text>
  <text x="54" y="248.0" class="b" text-anchor="start">issues your token</text>
  <rect x="680" y="210" width="240" height="50" rx="7" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="694" y="232.0" class="t" text-anchor="start">AI client</text>
  <text x="694" y="248.0" class="b" text-anchor="start">Claude Code, Cursor</text>
  <circle cx="906" cy="226" r="3" fill="#c9971c"/>
  <path class="ln" d="M280 105 L360 105" marker-end="url(#a)"/>
  <path class="ln" d="M600 105 L680 105" marker-end="url(#a)"/>
  <path class="ln" d="M480.0 172 L480.0 130" marker-end="url(#a)"/>
  <path class="ln" d="M160.0 210 L160.0 130" marker-end="url(#a)"/>
  <path class="ln" d="M840.0 210 L840.0 130" marker-end="url(#a)"/>
  <text x="290" y="95" class="b" text-anchor="start">your token</text>
  <text x="610" y="95" class="b" text-anchor="start">same token</text>
  <text x="492.0" y="190" class="b" text-anchor="start">tools call the REST API</text>
  <text x="172.0" y="170" class="b" text-anchor="start">sign-in</text>
  <text x="852.0" y="170" class="b" text-anchor="start">own token</text>
</svg>
