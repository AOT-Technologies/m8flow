<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 290" width="960" height="290" role="img" aria-labelledby="t d">
  <title id="t">Process model status</title>
  <desc id="d">A process model has three statuses. A new model starts in draft, which can&#x27;t start instances. Publish moves it to published, the only status that can start process instances. From published, Pause moves it to paused and Unpublish moves it back to draft. From paused, Resume returns it to published and Unpublish moves it to draft. The green dot marks the startable status. The blue dot shows a model being published and then starting an instance.</desc>
  <style>
    text { font-family: Inter, 'SF Pro Text', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #111827; }
    .t { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
    .b { font-size: 11.5px; fill: #6b7280; }
    .k { font-size: 10px; font-weight: 600; fill: #9ca3af; letter-spacing: 0.08em; }
    .m { font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 11px; fill: #6b7280; }
    .mi { font-family: 'JetBrains Mono', 'SF Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 11px; fill: #111827; }
    .ln { fill: none; stroke: #d1d5db; stroke-width: 1; }
    .er { fill: none; stroke: #e01d5a; stroke-width: 1; stroke-opacity: .45; }
    .route { offset-rotate: 0deg; opacity: 0; }
    .hl { opacity: 0; animation: hl var(--d, 6s) ease-in-out infinite; animation-delay: var(--w, 0s); }
    .in { opacity: 0; animation: fadein var(--d, 8s) ease-out infinite; animation-delay: var(--w, 0s); }
    @keyframes hl { 0%, 22%, 100% { opacity: 0; } 4%, 16% { opacity: 1; } }
    @keyframes fadein { 0% { opacity: 0; transform: translateY(4px); } 8%, 82% { opacity: 1; transform: none; }
                        92%, 100% { opacity: 0; } }
    .bar { transform-box: fill-box; transform-origin: left; animation: grow 8s ease-in-out infinite; }
    @keyframes grow { 0% { transform: scaleX(0); } 70%, 90% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
    @media (prefers-reduced-motion: reduce) {
      .hl, .route { animation: none !important; opacity: 0; }
      .in, .bar { animation: none; opacity: 1; }
    }
  </style>
  <rect width="960" height="290" rx="12" fill="#ffffff"/>
  <rect x=".5" y=".5" width="959" height="289" rx="12" fill="none" stroke="#e5e7eb"/>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 z" fill="#d1d5db"/></marker></defs>
  <path class="ln" d="M800.0 170 C800.0 250 160.0 250 160.0 170"/>
  <style>@keyframes r1 { 0% { offset-distance: 0%; opacity: 0; } 1% { opacity: 1; } 27.89% { opacity: 1; } 28.89% { offset-distance: 100%; opacity: 0; } 100% { offset-distance: 100%; opacity: 0; } }</style>
  <circle class="route" r="3" fill="#1a9fc8" style="offset-path: path('M160.0 137 L480.0 137 L480.0 120 L480.0 66 L480.0 41'); animation: r1 6s linear 0.0s infinite"/>
  <g class="hl" style="--d: 6s; --w: 0.98s"><rect x="380" y="120" width="200" height="50" rx="7" fill="#e8f6fb" stroke="#1a9fc8" stroke-opacity=".5"/></g>
  <g class="hl" style="--d: 6s; --w: 1.38s"><rect x="380" y="16" width="200" height="50" rx="7" fill="#e8f6fb" stroke="#1a9fc8" stroke-opacity=".5"/></g>
  <rect x="60" y="120" width="200" height="50" rx="7" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="74" y="142.0" class="mi" text-anchor="start">draft</text>
  <text x="74" y="158.0" class="b" text-anchor="start">can&#x27;t start</text>
  <rect x="380" y="120" width="200" height="50" rx="7" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="394" y="142.0" class="mi" text-anchor="start">published</text>
  <text x="394" y="158.0" class="b" text-anchor="start">starts instances</text>
  <circle cx="566" cy="136" r="3" fill="#12867a"/>
  <rect x="700" y="120" width="200" height="50" rx="7" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="714" y="142.0" class="mi" text-anchor="start">paused</text>
  <text x="714" y="158.0" class="b" text-anchor="start">can&#x27;t start · keeps history</text>
  <rect x="380" y="16" width="200" height="50" rx="7" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="480.0" y="45.5" class="t" text-anchor="middle">Process instance</text>
  <path class="ln" d="M260 137 L380 137" marker-end="url(#a)"/>
  <path class="ln" d="M380 153 L260 153" marker-end="url(#a)"/>
  <path class="ln" d="M580 137 L700 137" marker-end="url(#a)"/>
  <path class="ln" d="M700 153 L580 153" marker-end="url(#a)"/>
  <path class="ln" d="M480.0 120 L480.0 66" marker-end="url(#a)"/>
  <path class="ln" d="M161.0 176 L160.0 171" marker-end="url(#a)"/>
  <text x="320.0" y="129" class="b" text-anchor="middle">Publish</text>
  <text x="320.0" y="171" class="b" text-anchor="middle">Unpublish</text>
  <text x="640.0" y="129" class="b" text-anchor="middle">Pause</text>
  <text x="640.0" y="171" class="b" text-anchor="middle">Resume</text>
  <text x="490.0" y="98" class="b" text-anchor="start">Start process</text>
  <text x="480.0" y="240" class="b" text-anchor="middle">Unpublish</text>
</svg>
