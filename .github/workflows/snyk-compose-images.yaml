name: Snyk Container Image Scans

# Runtime images referenced by Compose are the required third-party baseline;
# scan them on pushes in andrepestana-aot/m8flow, on relevant PRs, and when a
# GitHub Release is published. Manual dispatch also scans selected M8Flow images.
# Dockerfile-only images are supplementary; final M8Flow application images
# are scanned during release builds and can be re-scanned on demand below.
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
      - refactor/next-gen
    paths:
      - "docker/*compose*.yml"
      - "docker/*compose*.yaml"
      - "**/Dockerfile"
      - "**/*.Dockerfile"
      - "**/dev.Dockerfile"
      - "docs/docker-base-image.md"
      - ".github/workflows/snyk-compose-images.yaml"
      - ".github/workflows/snyk-container-scan.yaml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing M8Flow image tag to scan from ECR (for example 2.0.0-rc)"
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  # Manual runs scan the already-published M8Flow application images at the
  # selected tag. They do not build or publish images.
  scan-m8flow-images:
    name: Scan ${{ matrix.component }}
    if: github.repository == 'andrepestana-aot/m8flow' && github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: m8flow-backend
            image: m8flow-backend
            dockerfile: docker/m8flow.backend.Dockerfile
          - component: m8flow-designer
            image: m8flow-designer
            dockerfile: docker/m8flow.designer.Dockerfile
          - component: m8flow-keycloak
            image: m8flow-keycloak
            dockerfile: docker/m8flow.keycloak.Dockerfile
          - component: m8flow-connector-proxy
            image: m8flow-connector-proxy
            dockerfile: m8flow-connector-proxy/Dockerfile
          - component: m8flow-node-wire-proxy
            image: m8flow-node-wire-proxy
            dockerfile: m8flow-node-wire-proxy/Dockerfile
          - component: m8flow-mcp
            image: m8flow-mcp
            dockerfile: m8flow-mcp/Dockerfile
    uses: ./.github/workflows/snyk-container-scan.yaml
    with:
      component: ${{ matrix.component }}
      image_uri: 653405621825.dkr.ecr.us-east-2.amazonaws.com/${{ matrix.image }}:${{ github.event.inputs.release_tag }}
      dockerfile: ${{ matrix.dockerfile }}
      image_source: ecr
      aws_region: us-east-2
      aws_role_to_assume: arn:aws:iam::653405621825:role/GitHubActions-ECS-m8flow
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  scan:
    name: Scan ${{ matrix.component }}
    if: github.repository == 'andrepestana-aot/m8flow'
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: postgres-15.19-trixie
            image: postgres:15.19-trixie
          - component: redis-7.4.11-alpine3.21
            image: redis:7.4.11-alpine3.21
          - component: silo-2026-10-18
            image: docker.io/pgsty/silo:RELEASE.2026-10-18T00-00-00Z
          - component: silo-mc-2026-10-18
            image: docker.io/pgsty/mc:RELEASE.2026-10-18T00-00-00Z
          - component: nginx-1.30.6-alpine3.24
            image: nginx:1.30.6-alpine3.24
          - component: rclone-1.75.2
            image: rclone/rclone:1.75.2
          - component: alpine-3.24.3
            image: alpine:3.24.3
          - component: nats-2.15.1-alpine3.22
            image: nats:2.15.1-alpine3.22
          - component: grafana-loki-3.7.8
            image: grafana/loki:3.7.8
          - component: grafana-tempo-2.10.8
            image: grafana/tempo:2.10.8
          - component: prometheus-v3.15.0
            image: prom/prometheus:v3.15.0
          - component: grafana-alloy-v1.7.5
            image: grafana/alloy:v1.7.5
          - component: cadvisor-v0.60.6
            image: ghcr.io/google/cadvisor:v0.60.6
          - component: grafana-11.6.15-ubuntu
            image: grafana/grafana:11.6.15-ubuntu
          - component: postgres-exporter-v0.20.1
            image: prometheuscommunity/postgres-exporter:v0.20.1
          - component: supplementary-ubuntu-24.04-base
            image: ubuntu:24.04
          - component: supplementary-python-3.12.15-slim-trixie
            image: python:3.12.15-slim-trixie
          - component: supplementary-python-3.12-slim-trixie
            image: python:3.12-slim-trixie
          - component: supplementary-node-24.22.1-trixie-slim
            image: node:24.22.1-trixie-slim
          - component: supplementary-eclipse-temurin-17-jdk
            image: eclipse-temurin:17-jdk
          - component: supplementary-keycloak-26.8.1-base
            image: quay.io/keycloak/keycloak:26.8.1
          - component: supplementary-m8flow-python-base-ubuntu24.04-py3.12
            image: docker.io/m8flow/m8flow-python-base:ubuntu24.04-py3.12
            dockerfile: docker/m8flow.python-base.Dockerfile
            build_image: true
    uses: ./.github/workflows/snyk-container-scan.yaml
    with:
      component: ${{ matrix.component }}
      image_uri: ${{ matrix.image }}
      dockerfile: ${{ matrix.dockerfile || '' }}
      image_source: public
      build_image: ${{ matrix.build_image || false }}
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
