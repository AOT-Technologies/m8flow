name: Vault Compose Smoke Test

on:
  pull_request:
    branches:
      - main
    paths:
      - "docker/m8flow-docker-compose*.yml"
      - "docker/vault/**"
      - "m8flow-backend/bin/backfill_configuration_variable_metadata.py"
      - "m8flow-backend/migrations/**"
      - "m8flow-backend/src/m8flow_backend/secrets/**"
      - "m8flow-backend/src/m8flow_backend/routes/named_values.py"
      - "m8flow-backend/tests/unit/m8flow_backend/test_configuration_variable_backfill_command.py"
      - "m8flow-backend/tests/unit/m8flow_backend/test_configuration_variable_migration.py"
      - "m8flow-backend/tests/unit/m8flow_backend/test_migration_bootstrap.py"
      - "m8flow-backend/tests/unit/m8flow_backend/test_vault_demo_*.py"
      - "docs/vault-local-development.md"
      - ".github/workflows/vault-compose-smoke.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vault-compose-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  vault-compose-smoke:
    name: Vault Compose bootstrap and seed
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: m8flow-vault-smoke-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare disposable local configuration
        run: |
          cp sample.env .env
          echo "M8FLOW_CONNECTOR_PROXY_API_KEY=vault-compose-smoke-key" >> .env
          cp docker/vault/demo/secrets.yml.sample docker/vault/demo/secrets.yml

      - name: Validate Compose configuration with an older supported plugin
        shell: bash
        run: |
          set -euo pipefail
          version=v2.29.2
          asset=docker-compose-linux-x86_64
          release_url="https://github.com/docker/compose/releases/download/${version}"
          curl -fsSL "${release_url}/${asset}" -o "$RUNNER_TEMP/$asset"
          # Pin the published binary digest; the release checksums.txt does not
          # include a sha256sum-compatible entry for this asset name.
          echo "d037bd4937bf18fba67cff4366e084ee125a3e15c25657ee1aeceff8db3672b4  $RUNNER_TEMP/$asset" | sha256sum --check --status
          chmod +x "$RUNNER_TEMP/$asset"
          "$RUNNER_TEMP/$asset" --version
          "$RUNNER_TEMP/$asset" \
            --project-name vault-compose-compat \
            --env-file .env \
            --profile init --profile vault --profile vault-demo \
            -f docker/m8flow-docker-compose.yml \
            -f docker/m8flow-docker-compose.vault.yml \
            -f docker/m8flow-docker-compose.vault-demo.yml \
            config --quiet

      - name: Start Vault demo and backend
        run: |
          docker compose \
            --project-name "$COMPOSE_PROJECT_NAME" \
            --env-file .env \
            --profile init --profile vault --profile vault-demo \
            -f docker/m8flow-docker-compose.yml \
            -f docker/m8flow-docker-compose.vault.yml \
            -f docker/m8flow-docker-compose.vault-demo.yml \
            up -d --build m8flow-backend vault-seed

      - name: Verify Vault starts healthy without entrypoint errors
        shell: bash
        run: |
          set -euo pipefail
          compose() {
            docker compose \
              --project-name "$COMPOSE_PROJECT_NAME" \
              --env-file .env \
              --profile init --profile vault --profile vault-demo \
              -f docker/m8flow-docker-compose.yml \
              -f docker/m8flow-docker-compose.vault.yml \
              -f docker/m8flow-docker-compose.vault-demo.yml \
              "$@"
          }
          for attempt in $(seq 1 24); do
            container_id="$(compose ps -q vault)"
            if [[ -n "$container_id" ]]; then
              state="$(docker inspect --format '{{.State.Status}}' "$container_id")"
              health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container_id")"
              if [[ "$health" == "healthy" ]]; then
                echo "Vault is healthy."
                exit 0
              fi
              if [[ "$state" == "exited" || "$state" == "dead" ]]; then
                compose logs --no-color vault || true
                echo "Vault exited before becoming healthy (state: $state)."
                exit 1
              fi
            fi
            sleep 5
          done
          compose logs --no-color vault || true
          echo "Vault did not become healthy within 120 seconds."
          exit 1

      - name: Wait for bootstrap, backend health, and seed completion
        shell: bash
        run: |
          set -euo pipefail
          compose() {
            docker compose \
              --project-name "$COMPOSE_PROJECT_NAME" \
              --env-file .env \
              --profile init --profile vault --profile vault-demo \
              -f docker/m8flow-docker-compose.yml \
              -f docker/m8flow-docker-compose.vault.yml \
              -f docker/m8flow-docker-compose.vault-demo.yml \
              "$@"
          }
          service_state() {
            local container_id
            container_id="$(compose ps -aq "$1")"
            if [[ -z "$container_id" ]]; then
              echo "missing -"
              return
            fi
            docker inspect --format '{{.State.Status}} {{.State.ExitCode}}' "$container_id"
          }
          backend_health() {
            local container_id
            container_id="$(compose ps -q m8flow-backend)"
            if [[ -z "$container_id" ]]; then
              echo "missing"
              return
            fi
            docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container_id"
          }
          fail_with_logs() {
            compose logs --no-color vault vault-demo m8flow-backend vault-seed || true
            exit 1
          }

          for attempt in $(seq 1 180); do
            read -r demo_status demo_exit <<< "$(service_state vault-demo)"
            read -r seed_status seed_exit <<< "$(service_state vault-seed)"
            health="$(backend_health)"

            if [[ "$demo_status" == "exited" && "$demo_exit" != "0" ]]; then
              echo "vault-demo exited with code $demo_exit"
              fail_with_logs
            fi
            if [[ "$seed_status" == "exited" && "$seed_exit" != "0" ]]; then
              echo "vault-seed exited with code $seed_exit"
              fail_with_logs
            fi
            if [[ "$health" == "healthy" && "$demo_status" == "exited" && "$demo_exit" == "0" && "$seed_status" == "exited" && "$seed_exit" == "0" ]]; then
              echo "Vault bootstrap, backend health, and demo seeding succeeded."
              exit 0
            fi
            sleep 5
          done

          echo "Vault Compose smoke did not complete within 15 minutes."
          fail_with_logs

      - name: Verify seeded tenant values and Vault storage split
        run: |
          docker compose \
            --project-name "$COMPOSE_PROJECT_NAME" \
            --env-file .env \
            --profile init --profile vault --profile vault-demo \
            -f docker/m8flow-docker-compose.yml \
            -f docker/m8flow-docker-compose.vault.yml \
            -f docker/m8flow-docker-compose.vault-demo.yml \
            exec -T m8flow-backend python - <<'PY'
          import os
          import psycopg

          database_uri = os.environ["M8FLOW_BACKEND_DATABASE_URI"].replace(
              "postgresql+psycopg://", "postgresql://", 1
          )
          expected = {
              "SMTP_HOST": (False, "sandbox.smtp.mailtrap.io"),
              "SMTP_PORT": (False, 587),
              "SMTP_USER": (True, None),
              "SMTP_PASSWORD": (True, None),
              "API_TOKEN": (True, None),
              "SLACK_WEBHOOK_URL": (True, None),
          }
          with psycopg.connect(database_uri) as connection:
              tenant_id = connection.execute(
                  "SELECT id::text FROM m8flow_tenant WHERE slug = %s",
                  ("m8flow",),
              ).fetchone()[0]
              connection.execute(
                  "SELECT set_config('app.current_tenant', %s, true)",
                  (tenant_id,),
              )
              rows = connection.execute(
                  "SELECT n.name, n.is_sensitive, n.value, n.is_configured, "
                  "n.provider_key, n.id::text "
                  "FROM m8flow_named_value AS n "
                  "WHERE n.m8f_tenant_id = %s",
                  (tenant_id,),
              ).fetchall()
          actual = {name: (sensitive, value, configured, provider_key, row_id)
                    for name, sensitive, value, configured, provider_key, row_id in rows}
          assert expected.keys() <= actual.keys(), f"Missing seeded variables: {expected.keys() - actual.keys()}"
          for name, (sensitive, value) in expected.items():
              actual_sensitive, actual_value, configured, provider_key, row_id = actual[name]
              assert actual_sensitive is sensitive, f"Wrong sensitivity for {name}"
              assert actual_value == value, f"Wrong database value for {name}"
              assert configured is True, f"{name} is not marked configured"
              if sensitive:
                  assert provider_key == row_id, f"{name} does not use its UUID provider key"
          print("Verified seeded values: plain values are in the DB; sensitive values use UUID Vault keys.")
          PY

      - name: Verify bootstrap is repeatable and runtime credentials remain readable
        shell: bash
        run: |
          set -euo pipefail
          compose() {
            docker compose \
              --project-name "$COMPOSE_PROJECT_NAME" \
              --env-file .env \
              --profile init --profile vault --profile vault-demo \
              -f docker/m8flow-docker-compose.yml \
              -f docker/m8flow-docker-compose.vault.yml \
              -f docker/m8flow-docker-compose.vault-demo.yml \
              "$@"
          }
          compose run --rm --no-deps --entrypoint python vault-demo -c \
            "from pathlib import Path; Path('/vault/legacy-demo/init.json').write_text('{}')"
          compose run --rm --no-deps vault-demo
          compose run --rm --no-deps --entrypoint python vault-demo -c \
            "from pathlib import Path; assert not Path('/vault/legacy-demo/init.json').exists()"
          compose exec -T --user 1000 m8flow-backend sh -c \
            'test -r /vault/runtime/m8flow-role-id && test -r /vault/runtime/m8flow-secret-id'

      - name: Verify vault-seed fails clearly when backend never becomes healthy
        shell: bash
        run: |
          set -euo pipefail
          compose() {
            docker compose \
              --project-name "$COMPOSE_PROJECT_NAME" \
              --env-file .env \
              --profile init --profile vault --profile vault-demo \
              -f docker/m8flow-docker-compose.yml \
              -f docker/m8flow-docker-compose.vault.yml \
              -f docker/m8flow-docker-compose.vault-demo.yml \
              "$@"
          }
          compose stop m8flow-backend
          set +e
          compose run --rm --no-deps \
            -e M8FLOW_VAULT_DEMO_BACKEND_HEALTH_TIMEOUT_SECONDS=2 \
            -e M8FLOW_VAULT_DEMO_BACKEND_HEALTH_POLL_SECONDS=0.1 \
            vault-seed > vault-seed-negative.log 2>&1
          seed_status=$?
          set -e
          if [[ "$seed_status" -eq 0 ]]; then
            cat vault-seed-negative.log
            echo "vault-seed unexpectedly succeeded while backend was stopped."
            exit 1
          fi
          grep -F "Timed out waiting for backend health" vault-seed-negative.log
          grep -F "Check the m8flow-backend healthcheck and container logs." vault-seed-negative.log

      - name: Save Compose logs on failure
        if: failure()
        run: |
          docker compose \
            --project-name "$COMPOSE_PROJECT_NAME" \
            --env-file .env \
            --profile init --profile vault --profile vault-demo \
            -f docker/m8flow-docker-compose.yml \
            -f docker/m8flow-docker-compose.vault.yml \
            -f docker/m8flow-docker-compose.vault-demo.yml \
            logs --no-color > vault-compose-smoke-logs.txt || true
          if [[ -f vault-seed-negative.log ]]; then
            cat vault-seed-negative.log >> vault-compose-smoke-logs.txt
          fi

      - name: Upload Compose logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vault-compose-smoke-logs-${{ github.run_id }}
          path: |
            vault-compose-smoke-logs.txt
            vault-seed-negative.log
          retention-days: 7

      - name: Stop isolated Compose project
        if: always()
        run: |
          docker compose \
            --project-name "$COMPOSE_PROJECT_NAME" \
            --env-file .env \
            --profile init --profile vault --profile vault-demo \
            -f docker/m8flow-docker-compose.yml \
            -f docker/m8flow-docker-compose.vault.yml \
            -f docker/m8flow-docker-compose.vault-demo.yml \
            down --volumes --remove-orphans || true
