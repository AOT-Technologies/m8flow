# Runs the backend and designer unit tests across the supported Python and
# Node.js versions and operating systems. The per-component DevX CI builds and
# scans the images on Linux; this workflow checks that development and tests
# work everywhere contributors run them.
#
# Rows marked experimental report but don't fail the run: they track versions
# and platforms that are not supported yet.
name: Test matrix

on:
  push:
    branches: [main, "refactor/next-gen"]
  pull_request:
    branches: [main, "refactor/next-gen"]
    paths:
      - "m8flow-backend/**"
      - "m8flow-telemetry/**"
      - "m8flow-designer/**"
      - "m8flow-bpmn/**"
      - ".github/workflows/test-matrix.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12"]
        experimental: [false]
        include:
          - os: ubuntu-latest
            python: "3.13"
            experimental: true
    defaults:
      run:
        working-directory: m8flow-backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: m8flow-backend/uv.lock

      - name: Install backend dependencies
        run: uv sync --frozen --group dev

      - name: Load Alembic revisions
        run: uv run --frozen alembic -c migrations/alembic.ini heads

      - name: Unit tests
        run: uv run --frozen pytest -q -n auto

      - name: PostgreSQL compensation journal isolation
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          postgres_container=$(docker run --detach \
            --env POSTGRES_PASSWORD=postgres --publish 127.0.0.1::5432 postgres:15.19)
          trap 'docker rm -f "$postgres_container" >/dev/null' EXIT
          if ! timeout 60 bash -c '
            until docker exec "$1" pg_isready -h 127.0.0.1 -U postgres; do sleep 1; done
          ' _ "$postgres_container"; then
            docker logs "$postgres_container"
            exit 1
          fi
          postgres_address=$(docker port "$postgres_container" 5432/tcp)
          M8FLOW_TEST_POSTGRES_URI="postgresql+psycopg://postgres:postgres@$postgres_address/postgres" \
            uv run --frozen pytest -q tests/integration/test_tenant_isolation.py -k compensation_journal

  designer:
    name: Designer (Node.js ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ["20.19", "22", "24"]
        experimental: [false]
        include:
          - os: macos-latest
            node: "24"
            experimental: false
          - os: windows-latest
            node: "24"
            experimental: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        shell: bash
        run: |
          (cd m8flow-bpmn && npm ci --ignore-scripts --no-audit --no-fund)
          (cd m8flow-designer && npm ci --ignore-scripts --no-audit --no-fund)

      - name: Lint, test, and build
        shell: bash
        working-directory: m8flow-designer
        run: |
          npm run lint
          npm test
          npm run build
