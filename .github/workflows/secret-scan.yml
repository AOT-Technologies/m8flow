# Gitleaks secret scan. Pull requests scan only their own commits; pushes,
# the weekly schedule, and manual runs scan the full history, so a rule added
# to Gitleaks later is still checked against old commits.
#
# Reviewed values (local-development defaults and test fixtures) are
# allowlisted by exact value in .gitleaks.toml; one-off findings are listed by
# fingerprint in .gitleaksignore. Anything else fails the run.
name: Secret scan

on:
  push:
    branches: [main, "refactor/next-gen"]
  pull_request:
    branches: [main, "refactor/next-gen"]
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: "8.27.2"
  GITLEAKS_SHA256: "141c3b2dede46d8b3a53b47116da756bd223decc0374797559a6b50ecba5590c"

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history for every event. A pull request that merges its base branch
      # has merge commits, and a shallow clone cuts their other parent short:
      # the cut-off commits look like root commits that add the whole tree, so
      # every reviewed finding is reported again under their SHAs.
      - name: Checkout repository (full history)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz

      - name: Run Gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          log_opts=()
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            # The commits the pull request adds to its base, merge commits
            # included, each diffed against its real parents.
            log_opts=(--log-opts "${BASE_SHA}..${HEAD_SHA}")
            echo "Scanning pull request commits ${BASE_SHA}..${HEAD_SHA}"
          else
            echo "Scanning full history"
          fi
          set +e
          ./gitleaks git . --redact --exit-code 1 \
            "${log_opts[@]}" \
            --report-format sarif --report-path gitleaks.sarif
          status=$?
          set -e
          {
            echo "### Gitleaks"
            if [[ "${status}" -eq 0 ]]; then
              echo "No new secrets found."
            else
              echo "Secrets found. Remove and rotate them, or, if a finding is a false positive, allowlist its exact value in \`.gitleaks.toml\` with a reason."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${status}"

      - name: Upload Gitleaks SARIF
        if: >-
          always() &&
          hashFiles('gitleaks.sarif') != '' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@8272c299f21ca24af15dfe9ac0971ba969e5e0d5 # v3.36.2
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
