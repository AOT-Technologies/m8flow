# Gitleaks secret scan. Pull requests scan only their own commits; pushes,
# the weekly schedule, and manual runs scan the full history, so a rule added
# to Gitleaks later is still checked against old commits.
#
# Triaged findings (local-development defaults and test fixtures) are listed by
# fingerprint in .gitleaksignore; known placeholder values are allowlisted in
# .gitleaks.toml. Anything else fails the run.
name: Secret scan

on:
  push:
    branches: [main, "refactor/next-gen"]
  pull_request:
    branches: [main, "refactor/next-gen"]
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: "8.27.2"
  GITLEAKS_SHA256: "141c3b2dede46d8b3a53b47116da756bd223decc0374797559a6b50ecba5590c"

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The scan resolves HEAD~<commits>, so the clone must reach one commit
      # past the branch.
      - name: Compute pull request fetch depth
        id: depth
        if: github.event_name == 'pull_request'
        env:
          PR_COMMITS: ${{ github.event.pull_request.commits }}
        run: echo "value=$((PR_COMMITS + 1))" >> "$GITHUB_OUTPUT"

      - name: Checkout pull request commits
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: ${{ steps.depth.outputs.value }}

      - name: Checkout repository (full history)
        if: github.event_name != 'pull_request'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz

      - name: Run Gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          log_opts=()
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            if git rev-parse --verify --quiet "HEAD~${PR_COMMITS}" >/dev/null; then
              log_opts=(--log-opts "HEAD~${PR_COMMITS}..HEAD")
              echo "Scanning ${PR_COMMITS} pull request commit(s)"
            else
              echo "Pull request range is not in the shallow clone; scanning full history"
              git fetch --no-tags --unshallow
            fi
          else
            echo "Scanning full history"
          fi
          set +e
          ./gitleaks git . --redact --exit-code 1 \
            "${log_opts[@]}" \
            --report-format sarif --report-path gitleaks.sarif
          status=$?
          set -e
          {
            echo "### Gitleaks"
            if [[ "${status}" -eq 0 ]]; then
              echo "No new secrets found."
            else
              echo "Secrets found. Remove and rotate them, or, if a finding is a false positive, add its fingerprint to \`.gitleaksignore\` with a reason."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${status}"

      - name: Upload Gitleaks SARIF
        if: >-
          always() &&
          hashFiles('gitleaks.sarif') != '' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@8272c299f21ca24af15dfe9ac0971ba969e5e0d5 # v3.36.2
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
