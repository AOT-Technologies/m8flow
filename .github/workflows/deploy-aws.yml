name: Deploy to AWS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - DEV
          - QA
      image_tag:
        description: "Docker image tag to deploy (e.g. 1.2.3-rc)"
        required: true
        type: string
      component:
        description: 'Component to deploy (choose "all" to deploy everything)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - backend
          - frontend
          - keycloak
          - connector-proxy
          - mcp

permissions:
  contents: read
  id-token: write  # Required for OIDC role assumption

concurrency:
  group: deploy-aws-${{ inputs.environment }}
  cancel-in-progress: false

env:
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  ECR_REGION: ${{ vars.AWS_REGION }}
  IMAGE_BASE: ${{ vars.ECR_REGISTRY }}/m8flow

jobs:
  validate:
    name: Validate Inputs
    runs-on: ubuntu-latest
    steps:
      - name: Validate environment
        run: |
          ENV="${{ inputs.environment }}"
          if [[ "$ENV" != "DEV" && "$ENV" != "QA" ]]; then
            echo "::error::Invalid environment: '$ENV'. Must be 'DEV' or 'QA'."
            exit 1
          fi

      - name: Validate image tag format
        run: |
          TAG="${{ inputs.image_tag }}"
          if [[ -z "$TAG" ]]; then
            echo "::error::Image tag cannot be empty."
            exit 1
          fi
          if [[ ! "$TAG" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "::error::Invalid image tag: '$TAG'. Only alphanumeric characters, '.', '_', and '-' are allowed."
            exit 1
          fi

      - name: Log deployment parameters
        run: |
          echo "### Deployment Parameters" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter   | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | \`${{ inputs.environment }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag   | \`${{ inputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY

  verify-images:
    name: Verify ECR Images Exist
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.ECR_REGION }}

      - name: Check images exist in ECR
        run: |
          TAG="${{ inputs.image_tag }}"

          # Explicit mapping: component → ECR repository name.
          case "${{ inputs.component }}" in
            all)
              REPOS="m8flow-backend m8flow-frontend m8flow-keycloak m8flow-connector-proxy m8flow-mcp" ;;
            backend)         REPOS="m8flow-backend" ;;
            frontend)        REPOS="m8flow-frontend" ;;
            keycloak)        REPOS="m8flow-keycloak" ;;
            connector-proxy) REPOS="m8flow-connector-proxy" ;;
            mcp)             REPOS="m8flow-mcp" ;;
            *)
              echo "::error::Unknown component: '${{ inputs.component }}'"
              exit 1 ;;
          esac

          MISSING=""
          for REPO in $REPOS; do
            ERR_FILE=$(mktemp)
            if ! RESULT=$(aws ecr describe-images \
              --repository-name "$REPO" \
              --region "${{ env.ECR_REGION }}" \
              --image-ids imageTag="${TAG}" \
              --output json 2>"$ERR_FILE"); then
              ERR_MSG=$(cat "$ERR_FILE")
              rm -f "$ERR_FILE"
              if [[ "$ERR_MSG" =~ "ImageNotFoundException" ]]; then
                MISSING="${MISSING} ${REPO}:${TAG}"
                continue
              else
                echo "::error::ECR API error for repo '${REPO}': ${ERR_MSG}"
                exit 1
              fi
            fi
            rm -f "$ERR_FILE"

            COUNT=$(echo "$RESULT" | jq '.imageDetails | length' 2>/dev/null || echo "0")
            if [[ "$COUNT" -lt 1 ]]; then
              MISSING="${MISSING} ${REPO}:${TAG}"
            fi
          done

          if [[ -n "$MISSING" ]]; then
            echo "::error::ECR image(s) not found for tag '${TAG}':${MISSING}"
            echo "Run 'Deploy to Docker' with this tag first, or provide a valid existing tag."
            exit 1
          fi
          echo "All ECR images verified for tag '${TAG}'."

  deploy:
    name: Deploy to ${{ inputs.environment }}
    needs: [validate, verify-images]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
      BACKEND_TASK_DEF_FAMILY: ${{ secrets.BACKEND_TASK_DEF_FAMILY }}
      BACKEND_CONTAINER_NAME: ${{ secrets.BACKEND_CONTAINER_NAME }}
      BACKEND_SERVICE_NAME: ${{ secrets.BACKEND_SERVICE_NAME }}
      FRONTEND_TASK_DEF_FAMILY: ${{ secrets.FRONTEND_TASK_DEF_FAMILY }}
      FRONTEND_CONTAINER_NAME: ${{ secrets.FRONTEND_CONTAINER_NAME }}
      FRONTEND_SERVICE_NAME: ${{ secrets.FRONTEND_SERVICE_NAME }}
      KEYCLOAK_TASK_DEF_FAMILY: ${{ secrets.KEYCLOAK_TASK_DEF_FAMILY }}
      KEYCLOAK_CONTAINER_NAME: ${{ secrets.KEYCLOAK_CONTAINER_NAME }}
      KEYCLOAK_SERVICE_NAME: ${{ secrets.KEYCLOAK_SERVICE_NAME }}
      CONNECTOR_PROXY_TASK_DEF_FAMILY: ${{ secrets.CONNECTOR_PROXY_TASK_DEF_FAMILY }}
      CONNECTOR_PROXY_CONTAINER_NAME: ${{ secrets.CONNECTOR_PROXY_CONTAINER_NAME }}
      CONNECTOR_PROXY_SERVICE_NAME: ${{ secrets.CONNECTOR_PROXY_SERVICE_NAME }}
      MCP_TASK_DEF_FAMILY: ${{ secrets.MCP_TASK_DEF_FAMILY }}
      MCP_CONTAINER_NAME: ${{ secrets.MCP_CONTAINER_NAME }}
      MCP_SERVICE_NAME: ${{ secrets.MCP_SERVICE_NAME }}
    steps:
      - name: Validate required environment variables
        shell: bash
        run: |
          # Always required
          required=(
            AWS_REGION
            ECS_CLUSTER
          )

          # Component-specific secrets
          case "${{ inputs.component }}" in
            all)
              required+=(
                BACKEND_TASK_DEF_FAMILY BACKEND_CONTAINER_NAME BACKEND_SERVICE_NAME
                FRONTEND_TASK_DEF_FAMILY FRONTEND_CONTAINER_NAME FRONTEND_SERVICE_NAME
                KEYCLOAK_TASK_DEF_FAMILY KEYCLOAK_CONTAINER_NAME KEYCLOAK_SERVICE_NAME
                CONNECTOR_PROXY_TASK_DEF_FAMILY CONNECTOR_PROXY_CONTAINER_NAME CONNECTOR_PROXY_SERVICE_NAME
                MCP_TASK_DEF_FAMILY MCP_CONTAINER_NAME MCP_SERVICE_NAME
              )
              ;;
            backend)
              required+=(BACKEND_TASK_DEF_FAMILY BACKEND_CONTAINER_NAME BACKEND_SERVICE_NAME) ;;
            frontend)
              required+=(FRONTEND_TASK_DEF_FAMILY FRONTEND_CONTAINER_NAME FRONTEND_SERVICE_NAME) ;;
            keycloak)
              required+=(KEYCLOAK_TASK_DEF_FAMILY KEYCLOAK_CONTAINER_NAME KEYCLOAK_SERVICE_NAME) ;;
            connector-proxy)
              required+=(CONNECTOR_PROXY_TASK_DEF_FAMILY CONNECTOR_PROXY_CONTAINER_NAME CONNECTOR_PROXY_SERVICE_NAME) ;;
            mcp)
              required+=(MCP_TASK_DEF_FAMILY MCP_CONTAINER_NAME MCP_SERVICE_NAME) ;;
            *)
              echo "::error::Unknown component: '${{ inputs.component }}'. Valid values: all, backend, frontend, keycloak, connector-proxy, mcp"
              exit 1 ;;
          esac

          missing=()
          for key in "${required[@]}"; do
            if [[ -z "${!key:-}" ]]; then
              missing+=("$key")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required environment variable(s): ${missing[*]}"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Backend
      - name: Render backend task definition
        id: render-backend
        if: ${{ inputs.component == 'all' || inputs.component == 'backend' }}
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: ${{ env.BACKEND_TASK_DEF_FAMILY }}
          container-name: ${{ env.BACKEND_CONTAINER_NAME }}
          image: ${{ env.IMAGE_BASE }}-backend:${{ inputs.image_tag }}

      - name: Deploy backend to ECS
        if: ${{ inputs.component == 'all' || inputs.component == 'backend' }}
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-backend.outputs.task-definition }}
          service: ${{ env.BACKEND_SERVICE_NAME }}
          cluster: ${{ env.ECS_CLUSTER }}
          force-new-deployment: true

      # Frontend
      - name: Render frontend task definition
        id: render-frontend
        if: ${{ inputs.component == 'all' || inputs.component == 'frontend' }}
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: ${{ env.FRONTEND_TASK_DEF_FAMILY }}
          container-name: ${{ env.FRONTEND_CONTAINER_NAME }}
          image: ${{ env.IMAGE_BASE }}-frontend:${{ inputs.image_tag }}

      - name: Deploy frontend to ECS
        if: ${{ inputs.component == 'all' || inputs.component == 'frontend' }}
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-frontend.outputs.task-definition }}
          service: ${{ env.FRONTEND_SERVICE_NAME }}
          cluster: ${{ env.ECS_CLUSTER }}
          force-new-deployment: true

      # Keycloak
      - name: Render keycloak task definition
        id: render-keycloak
        if: ${{ inputs.component == 'all' || inputs.component == 'keycloak' }}
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: ${{ env.KEYCLOAK_TASK_DEF_FAMILY }}
          container-name: ${{ env.KEYCLOAK_CONTAINER_NAME }}
          image: ${{ env.IMAGE_BASE }}-keycloak:${{ inputs.image_tag }}

      - name: Deploy keycloak to ECS
        if: ${{ inputs.component == 'all' || inputs.component == 'keycloak' }}
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-keycloak.outputs.task-definition }}
          service: ${{ env.KEYCLOAK_SERVICE_NAME }}
          cluster: ${{ env.ECS_CLUSTER }}
          force-new-deployment: true

      # Connector Proxy
      - name: Render connector-proxy task definition
        id: render-connector-proxy
        if: ${{ inputs.component == 'all' || inputs.component == 'connector-proxy' }}
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: ${{ env.CONNECTOR_PROXY_TASK_DEF_FAMILY }}
          container-name: ${{ env.CONNECTOR_PROXY_CONTAINER_NAME }}
          image: ${{ env.IMAGE_BASE }}-connector-proxy:${{ inputs.image_tag }}

      - name: Deploy connector-proxy to ECS
        if: ${{ inputs.component == 'all' || inputs.component == 'connector-proxy' }}
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-connector-proxy.outputs.task-definition }}
          service: ${{ env.CONNECTOR_PROXY_SERVICE_NAME }}
          cluster: ${{ env.ECS_CLUSTER }}
          force-new-deployment: true

      # MCP Server
      - name: Render mcp task definition
        id: render-mcp
        if: ${{ inputs.component == 'all' || inputs.component == 'mcp' }}
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: ${{ env.MCP_TASK_DEF_FAMILY }}
          container-name: ${{ env.MCP_CONTAINER_NAME }}
          image: ${{ env.IMAGE_BASE }}-mcp:${{ inputs.image_tag }}

      - name: Deploy mcp to ECS
        if: ${{ inputs.component == 'all' || inputs.component == 'mcp' }}
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-mcp.outputs.task-definition }}
          service: ${{ env.MCP_SERVICE_NAME }}
          cluster: ${{ env.ECS_CLUSTER }}
          force-new-deployment: true

  summary:
    name: Deployment Summary
    needs: [validate, deploy]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Write deployment summary
        run: |
          TAG="${{ inputs.image_tag }}"
          ENV="${{ inputs.environment }}"
          DEPLOY_STATUS="${{ needs.deploy.result }}"

          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field       | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | \`${ENV}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Component   | \`${{ inputs.component }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag   | \`${TAG}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Status      | **${DEPLOY_STATUS}** |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "$DEPLOY_STATUS" == "success" ]]; then
            echo ":white_check_mark: All components deployed successfully to **${ENV}** with tag \`${TAG}\`." >> $GITHUB_STEP_SUMMARY
          else
            echo ":x: One or more components failed to deploy to **${ENV}**. Check individual job logs above for details." >> $GITHUB_STEP_SUMMARY
          fi
