name: m8flow-backend CI/CD
# =============================================================================
# Triggers:
#   PR to main / next-gen        → CI only (lint, test, SAST, Trivy, image build)
#   Push to main / next-gen      → CI only (the image is built, not published)
#   release.yaml                 → publishes X.Y.Z-rc images to ECR (us-east-2)
#   workflow_dispatch            → CD only (deploy a released image to dev)
# =============================================================================

on:
  push:
    branches:
      - main
      - refactor/next-gen
    paths:
      - "m8flow-backend/**"
      - "docker/m8flow.backend.Dockerfile"
      - "m8flow-telemetry/**"
      - "uvicorn-log.yaml"
      - "docker/scripts/m8flow_backend_entrypoint.sh"
      - ".github/workflows/backend-cicd.yaml"

  pull_request:
    branches:
      - main
      - refactor/next-gen
    paths:
      - "m8flow-backend/**"
      - "docker/m8flow.backend.Dockerfile"
      - "m8flow-telemetry/**"
      - "uvicorn-log.yaml"
      - "docker/scripts/m8flow_backend_entrypoint.sh"
      - ".github/workflows/backend-cicd.yaml"

  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to deploy to"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
      image_uri:
        description: "Pre-built image URI to deploy (e.g. 653405621825.dkr.ecr.us-east-2.amazonaws.com/m8flow-backend:a1b2c3d)"
        required: true
        type: string
      dry_run:
        description: "Validate the deploy against the cluster without changing anything"
        required: false
        default: false
        type: boolean

# Least privilege, but constrained by what GitHub validates. `contents: write`
# is required even though nothing here writes contents: ci-orchestrator has a
# nested `auto-merge` job declaring it, and GitHub validates every job in the
# call graph at startup -- including ones that never run (auto_merge is false
# here). Dropping it fails the run before any job starts. `actions` is genuinely
# only ever read, so it stays at read.
permissions:
  contents: write
  actions: read
  security-events: write
  packages: write
  pull-requests: write
  id-token: write
  deployments: write

concurrency:
  group: backend-cicd-${{ github.event.inputs.environment || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Backend CI Pipeline
    if: github.event_name != 'workflow_dispatch'
    uses: AOT-Technologies/devx-reusable-workflows/.github/workflows/ci-orchestrator.yaml@dcdc55443b4be632aa8385243da7bebf19bfbb84 # v1.3.0
    with:
      config_path: m8flow-backend/devx-ci.yaml
      auto_merge: false
      # Never publishes, as on main: a PR or a merge runs the full CI and
      # discards the image. release.yaml is the only workflow that pushes
      # images (X.Y.Z-rc, to ECR); deploys are the manual dispatch below.
      push: false
    secrets:
      sonar_token: ${{ secrets.SONAR_TOKEN }}
      GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}

  cd-dev:
    name: Deploy Backend → DEV
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev'
    uses: AOT-Technologies/devx-reusable-workflows/.github/workflows/cd-orchestrator.yaml@dcdc55443b4be632aa8385243da7bebf19bfbb84 # v1.3.0
    with:
      environment: dev
      image_uri: ${{ github.event.inputs.image_uri }}
      config_path: m8flow-backend/devx-config.yaml
      dry_run: ${{ github.event.inputs.dry_run == 'true' }}
    secrets: inherit
