name: m8flow-backend CI/CD

# =============================================================================
# Triggers:
#   Push to 'develop' when m8flow-backend code changes → CI + CD to dev (automated)
#   PR to 'develop' when m8flow-backend code changes  → CI only (no deploy)
#   workflow_dispatch                                  → CI + CD to dev | demo | qa
#
# Tag format (by docker-build smart versioning):
#   develop branch  → dev-<short-sha>     (e.g. dev-a1b2c3d)
#   manual dispatch with image_uri        → uses the supplied tag directly
#   Release tags (e.g. 1.0.6-rc)         → supplied via image_uri on dispatch
# =============================================================================

on:
  push:
    branches:
      - develop
    paths:
      - "m8flow-backend/**"
      - "docker/m8flow.backend.Dockerfile"
      - ".github/workflows/backend-cicd.yaml"

  pull_request:
    branches:
      - develop
    paths:
      - "m8flow-backend/**"
      - "docker/m8flow.backend.Dockerfile"
      - ".github/workflows/backend-cicd.yaml"

  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "demo"
        type: choice
        options:
          - demo
          - qa
      image_uri:
        description: "Image URI to deploy (e.g. m8flow/m8flow-backend:1.0.6-rc). Leave empty to trigger a fresh build."
        required: false
        type: string

permissions:
  contents: read
  security-events: write
  actions: write
  id-token: write
  packages: write
  pull-requests: write
  deployments: write

concurrency:
  group: backend-cicd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Backend CI Pipeline
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.image_uri == ''
    uses: AOT-Technologies/devx-reusable-workflows/.github/workflows/ci-orchestrator.yaml@v1
    with:
      config_path: m8flow-backend/devx-ci.yaml
      auto_merge: false
      push: >-
        ${{
          (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
          github.event_name == 'workflow_dispatch'
        }}
    secrets:
      registry_username: ${{ secrets.DOCKERHUB_USERNAME }}
      registry_password: ${{ secrets.DOCKERHUB_TOKEN }}
      sonar_token: ${{ secrets.SONAR_TOKEN }}

  cd-dev:
    name: Deploy Backend → DEV
    needs: ci
    if: |
      always() &&
      (needs.ci.result == 'success' || needs.ci.result == 'skipped') &&
      github.event_name == 'push' && github.ref == 'refs/heads/develop'
    uses: AOT-Technologies/devx-reusable-workflows/.github/workflows/cd-orchestrator.yaml@v1
    with:
      environment: dev
      image_uri: ${{ github.event.inputs.image_uri || needs.ci.outputs.image_uri }}
      config_path: m8flow-backend/devx-config.yaml
    secrets: inherit

  cd-demo:
    name: Deploy Backend → DEMO
    needs: ci
    if: |
      always() &&
      (needs.ci.result == 'success' || needs.ci.result == 'skipped') &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'demo'
    uses: AOT-Technologies/devx-reusable-workflows/.github/workflows/cd-orchestrator.yaml@v1
    with:
      environment: demo
      image_uri: ${{ github.event.inputs.image_uri || needs.ci.outputs.image_uri }}
      config_path: m8flow-backend/devx-config.yaml
    secrets: inherit

  cd-qa:
    name: Deploy Backend → QA
    needs: ci
    if: |
      always() &&
      (needs.ci.result == 'success' || needs.ci.result == 'skipped') &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.environment == 'qa'
    uses: AOT-Technologies/devx-reusable-workflows/.github/workflows/cd-orchestrator.yaml@v1
    with:
      environment: qa
      image_uri: ${{ github.event.inputs.image_uri || needs.ci.outputs.image_uri }}
      config_path: m8flow-backend/devx-config.yaml
    secrets: inherit
