# Open-source compliance gates: file licensing (REUSE), dependency licenses,
# dependency vulnerabilities, and high-severity SAST findings. The same checks
# run locally with bin/compliance/run-compliance-checks.sh.
name: Compliance

on:
  push:
    branches: [main, "refactor/next-gen"]
  pull_request:
    branches: [main, "refactor/next-gen"]
  schedule:
    # Daily, so a newly published advisory against an unchanged lockfile is caught.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REUSE_VERSION: "5.0.2"
  BANDIT_VERSION: "1.8.6"
  PIP_AUDIT_VERSION: "2.7.3"

jobs:
  reuse:
    name: REUSE lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Every file declares a copyright and license
        run: uvx "reuse==${REUSE_VERSION}" lint

      - name: Flag files that block an open-source release
        run: |
          if grep -qE 'LicenseRef-(FontAwesome-Pro|NeedsReview)' REUSE.toml; then
            echo "::warning title=Release blocker::REUSE.toml declares files that are not redistributable or whose license is unconfirmed. See LICENSES/LicenseRef-*.txt."
          fi

  bandit:
    name: Bandit (high severity)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      # Medium and low findings are reported by the Semgrep and SonarQube scans
      # in each component's CI; this gate blocks only high-severity ones.
      - name: Bandit
        run: |
          uvx "bandit==${BANDIT_VERSION}" -q -r \
            m8flow-backend/src m8flow-mcp/src m8flow-nats-consumer \
            m8flow-node-wire-proxy/src m8flow-connector-proxy m8flow-telemetry/src \
            -x '*/tests/*' --severity-level high

  python-vulnerabilities:
    name: pip-audit (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [m8flow-backend, m8flow-mcp, m8flow-nats-consumer, m8flow-node-wire-proxy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      # Local path dependencies (the vendored engine wheel and sibling packages)
      # are not on PyPI, so they are left out of the audit input.
      - name: Export runtime requirements
        working-directory: ${{ matrix.project }}
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project \
            --no-emit-package m8flow-bpmn-core --no-emit-package m8flow-telemetry \
            | grep -vE '^(-e |\.|/)' > "${RUNNER_TEMP}/requirements.txt"

      # The export pins every package, so pip-audit checks those exact versions
      # without resolving them again in a throwaway virtualenv.
      - name: pip-audit
        run: |
          uvx "pip-audit==${PIP_AUDIT_VERSION}" -r "${RUNNER_TEMP}/requirements.txt" \
            --no-deps --disable-pip --progress-spinner off

  npm-vulnerabilities:
    name: npm audit (m8flow-designer)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: npm audit (production dependencies, high and critical)
        working-directory: m8flow-designer
        run: npm audit --omit=dev --audit-level=high

  dependency-licenses:
    name: Dependency licenses
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install npm dependencies
        run: |
          (cd m8flow-bpmn && npm ci --ignore-scripts --no-audit --no-fund)
          (cd m8flow-designer && npm ci --ignore-scripts --no-audit --no-fund)

      - name: No strong-copyleft runtime dependencies
        run: python3 bin/compliance/dependency_licenses.py --check --write

      - name: Upload the generated inventory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependencies-md
          path: DEPENDENCIES.md
          retention-days: 14
