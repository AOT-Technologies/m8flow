name: Deploy to Docker

on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: "RC tag name (e.g. 1.2.3-rc)"
        required: true
        type: string
      component:
        description: 'Component to build & push (choose "all" to build everything)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - backend
          - frontend
          - keycloak
          - connector-proxy
          - mcp
  workflow_run:
    workflows: ["Create Release Tag"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write  # Required for AWS OIDC to authenticate to ECR

concurrency:
  group: deploy-dev
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  IMAGE_REPOSITORY: m8flow
  PROJECT: m8flow
  COMPONENTS: '["backend", "frontend", "keycloak", "connector-proxy", "mcp"]'

jobs:
  prepare:
    name: Prepare (resolve ref & tag)
    if: |
      (vars.AUTO_BUILD == 'true' || github.event_name == 'workflow_dispatch') &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.meta.outputs.ref }}
      tag: ${{ steps.meta.outputs.tag }}
      components: ${{ steps.components.outputs.list }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.rc_tag || github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0 # Required to find tags at HEAD

      - name: Extract metadata
        id: meta
        run: |
          if [[ -n "${{ github.event.inputs.rc_tag }}" ]]; then
            TAG="${{ github.event.inputs.rc_tag }}"
          elif [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            git fetch origin --tags
            TAG=$(git tag --points-at HEAD | sort -V | tail -1)
            [[ -z "$TAG" ]] && { echo "::error::No tag found at HEAD"; exit 1; }
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "ref=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Compute component list
        id: components
        env:
          COMPONENT: ${{ inputs.component }}
        # COMPONENTS is a workflow-level env var, so the shell can read it
        # directly. It must NOT be interpolated as ${{ env.COMPONENTS }}: a
        # GitHub expression is spliced into the script as raw text before bash
        # parses the line, so the JSON's own quotes were consumed as shell
        # syntax and the step emitted [backend, frontend, ...] -- which fromJson
        # rejected with "Unexpected symbol: 'backend'".
        run: |
          set -euo pipefail
          if [[ -z "$COMPONENT" || "$COMPONENT" == "all" ]]; then
            LIST="$COMPONENTS"
          else
            # jq emits correctly escaped JSON for any component name.
            LIST=$(jq -cn --arg c "$COMPONENT" '[$c]')
          fi

          # Fail loudly here rather than as an opaque matrix error two jobs later.
          echo "$LIST" | jq -e 'type == "array" and length > 0' >/dev/null \
            || { echo "::error::Component list is not a non-empty JSON array: $LIST"; exit 1; }

          echo "Component list: $LIST"
          echo "list=$LIST" >> "$GITHUB_OUTPUT"

  backup-existing-tags:
    name: Backup Tags
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      # One component failing must not cancel the others. Without this, a single
      # broken image takes down every sibling build mid-run, which hides whether
      # the rest actually work.
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.prepare.outputs.components) }}
    steps:
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Manage Backup Tags
        env:
          REPO: "${{ env.ECR_REGISTRY }}/${{ env.PROJECT }}-${{ matrix.component }}"
          TAG: "${{ needs.prepare.outputs.tag }}"
        run: |
          # 1. Check if the current tag exists in ECR.
          ERR_FILE=$(mktemp)
          if ! IMAGE_META=$(aws ecr describe-images \
            --repository-name "${{ env.PROJECT }}-${{ matrix.component }}" \
            --region "${{ env.AWS_REGION }}" \
            --image-ids imageTag="${TAG}" \
            --output json 2>"$ERR_FILE"); then
            ERR_MSG=$(cat "$ERR_FILE")
            rm -f "$ERR_FILE"
            if [[ "$ERR_MSG" =~ "ImageNotFoundException" ]]; then
              echo "Tag ${TAG} not found in ECR. Nothing to backup."
              exit 0
            else
              echo "::error::ECR error while checking tag '${TAG}': ${ERR_MSG}"
              exit 1
            fi
          fi
          rm -f "$ERR_FILE"

          COUNT=$(echo "$IMAGE_META" | jq '.imageDetails | length' 2>/dev/null || echo "0")
          if [[ "$COUNT" -lt 1 ]]; then
            echo "Tag ${TAG} not found in ECR. Nothing to backup."
            exit 0
          fi

          # 2. Server-side retag in ECR (no layer download).
          echo "Backing up ${TAG} to ${TAG}-backup..."
          MANIFEST=$(aws ecr batch-get-image \
            --repository-name "${{ env.PROJECT }}-${{ matrix.component }}" \
            --region "${{ env.AWS_REGION }}" \
            --image-ids imageTag="${TAG}" \
            --query 'images[0].imageManifest' \
            --output text)

          if [[ -z "$MANIFEST" || "$MANIFEST" == "None" ]]; then
            echo "::error::Failed to retrieve manifest for ${TAG}."
            exit 1
          fi

          aws ecr put-image \
            --repository-name "${{ env.PROJECT }}-${{ matrix.component }}" \
            --region "${{ env.AWS_REGION }}" \
            --image-tag "${TAG}-backup" \
            --image-manifest "$MANIFEST"

  build:
    name: Build & Push
    needs: [prepare, backup-existing-tags]
    runs-on: ubuntu-latest
    strategy:
      # One component failing must not cancel the others. Without this, a single
      # broken image takes down every sibling build mid-run, which hides whether
      # the rest actually work.
      fail-fast: false
      matrix:
        component: ${{ fromJson(needs.prepare.outputs.components) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.component == 'mcp' && 'm8flow-mcp' || '.' }}
          file: ${{ matrix.component == 'connector-proxy' && 'm8flow-connector-proxy/Dockerfile' || matrix.component == 'mcp' && 'm8flow-mcp/Dockerfile' || format('docker/m8flow.{0}.Dockerfile', matrix.component) }}
          # Pin the shared base explicitly (only consumed by the backend Dockerfile;
          # ignored as an unused arg by other components).
          build-args: |
            PYTHON_BASE=${{ env.ECR_REGISTRY }}/m8flow-python-base:ubuntu24.04-py3.12
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.PROJECT }}-${{ matrix.component }}:${{ needs.prepare.outputs.tag }}
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.PROJECT }}-${{ matrix.component }}:buildcache
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.PROJECT }}-${{ matrix.component }}:buildcache,mode=max
          provenance: true
          sbom: true

      - name: Save Digest
        run: echo "${{ steps.build.outputs.digest }}" > digest.txt

      - name: Upload Digest Artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.component }}
          path: digest.txt
          retention-days: 1

  combine:
    name: Finalize Artifacts
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all digests
        uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: digest-*
          merge-multiple: false

      - name: Create Summary
        run: |
          echo "### Deployment Summary - ${{ needs.prepare.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Digest |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          for f in digests/digest-*/digest.txt; do
            COMPONENT=$(basename $(dirname $f) | sed 's/digest-//')
            DIGEST=$(cat $f)
            echo "| $COMPONENT | \`$DIGEST\` |" >> $GITHUB_STEP_SUMMARY
          done