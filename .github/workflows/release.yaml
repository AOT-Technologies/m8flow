name: Release

# =============================================================================
# Build once, release everywhere.
#
# An image is built once per commit: a merge to main publishes it as
# sha-<commit> (each component's *-cicd.yaml). Deploys to dev, qa and demo use
# that image, and a release only adds tags to it. Nothing that was tested is
# ever rebuilt: rebuilding the same commit gives different bytes (base images
# move, builds are not reproducible), so every tag is a copy by digest.
#
#   channel rc: tag X.Y.Z-rc on a main commit, and retag each component's
#     sha-<commit> image as X.Y.Z-rc. A component's image is the one built at
#     the last main commit that changed its files (its *-cicd.yaml push
#     paths). Only if that image is missing, and the candidate is the tip of
#     main, is it built here, once, as sha-<tip>.
#   channel ga: retag the tested X.Y.Z-rc images (rc_tag) as X.Y.Z, then tag
#     the candidate's commit X.Y.Z in git and create the draft GitHub Release
#     (github-release.yml). The release number need not match the candidate's:
#     2.0.0 can promote 2.0.8-rc. A ga run waits for approval on the `release`
#     environment before it writes anything.
#
# Releases run from main only: the Docker Hub OIDC connection trusts main
# only, so a run from any other ref cannot log in to push.
#
# It publishes only; it deploys nothing. Deploying is the manual
# workflow_dispatch of each component's *-cicd.yaml, with any published tag.
#
# Versions: next-gen releases are 2.x (main was 1.0.x). Leave tag_name empty to
# auto-increment the patch from the highest X.Y.Z-rc tag merged into main, or
# set it. The release version and the CHANGELOG entry land on main *before* the
# candidate is cut, because the git release tag marks the candidate's commit.
#
# The git tag and the images are chained on needs in one run rather than a
# `push: tags:` workflow: GitHub does not start a workflow run from an event
# created with the default GITHUB_TOKEN.
#
# See docs/how-to/release-and-roll-back.md.
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "rc: tag a main commit X.Y.Z-rc and retag its images. ga: retag the tested candidate (rc_tag) as X.Y.Z, tag it in git, and draft the GitHub Release."
        required: false
        default: rc
        type: choice
        options:
          - rc
          - ga
      tag_name:
        description: "rc: tag to create (X.Y.Z-rc; 2.x for next-gen), or empty to auto-increment the patch. ga: required, the release, X.Y.Z."
        required: false
        type: string
      rc_tag:
        description: "ga only, required: the tested X.Y.Z-rc candidate to release, for example 2.0.8-rc."
        required: false
        type: string
      commit_sha:
        description: "rc only: the main commit to tag. Leave empty for the tip of main."
        required: false
        type: string
      components:
        description: 'Which components to release ("all" for a full set)'
        required: false
        default: all
        type: choice
        options:
          - all
          - backend
          - designer
          - keycloak
          - node-wire-proxy
          - mcp
      dry_run:
        description: "Plan only: resolve the commit, the tag and every image, and change nothing"
        required: false
        default: false
        type: boolean

# Declared once at workflow level. A job-level permissions block on a job that
# calls a reusable workflow makes the run fail to start, so the superset lives
# here: contents: write for tags and the GitHub Release, id-token: write for
# the Docker Hub OIDC login and Sigstore, attestations: write for the release
# assets, and the rest for the CI orchestrator.
permissions:
  contents: write
  security-events: write
  actions: read
  id-token: write
  attestations: write
  packages: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  branch:
    name: Check Release Branch
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Release channel
        env:
          CHANNEL: ${{ inputs.channel }}
          TAG_NAME: ${{ inputs.tag_name }}
          RC_TAG: ${{ inputs.rc_tag }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          if [[ "$CHANNEL" == "ga" ]]; then
            if [[ ! "$TAG_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::A GA release needs tag_name set to the release, X.Y.Z (got '${TAG_NAME}')."
              exit 1
            fi
            # Explicit, never derived: the release and the candidate numbers
            # can differ (2.0.0 promotes 2.0.8-rc), and deriving 2.0.0-rc would
            # silently ship an older candidate that also exists.
            if [[ ! "$RC_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc$ ]]; then
              echo "::error::A GA release needs rc_tag set to the tested X.Y.Z-rc candidate (got '${RC_TAG}')."
              exit 1
            fi
            if [[ -n "$COMMIT_SHA" ]]; then
              echo "::error::commit_sha is for channel rc only. A GA release is always the candidate's commit."
              exit 1
            fi
          fi
          if [[ "$CHANNEL" == "rc" && -n "$TAG_NAME" && ! "$TAG_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc$ ]]; then
            echo "::error::An rc release tag is X.Y.Z-rc (got '${TAG_NAME}'). Use channel ga for a final release."
            exit 1
          fi
          if [[ "$CHANNEL" == "rc" && -n "$RC_TAG" ]]; then
            echo "::error::rc_tag is for channel ga only (got '${RC_TAG}')."
            exit 1
          fi

      - name: Release branch
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/heads/main) echo "Releasing main" ;;
            *) echo "::error::Run Release from main, not $REF."; exit 1 ;;
          esac

      # Next-gen versions start at 2.0.0. Without a 2.x tag yet, auto-increment
      # would continue main's 1.0.x line and publish next-gen images as 1.0.x.
      - name: Version line
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          if [[ -n "$TAG_NAME" ]]; then
            if [[ "$TAG_NAME" =~ ^([0-9]+)\. ]] && (( BASH_REMATCH[1] >= 2 )); then exit 0; fi
            echo "::error::tag_name $TAG_NAME: next-gen releases are 2.x or later."
            exit 1
          fi
          n=$(gh api "repos/$REPO/git/matching-refs/tags/" --paginate \
                --jq '.[].ref | ltrimstr("refs/tags/") | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+-rc$")) | select((split(".")[0] | tonumber) >= 2)' | wc -l)
          if (( n == 0 )); then
            echo "::error::No 2.x release tag yet: set tag_name (2.0.0-rc for the first release)."
            exit 1
          fi

  # Decides, before anything is written, which commit is released and which
  # existing image each component ships. A missing image stops the run here
  # (or, for an rc at the tip of main, is scheduled to be built once).
  plan:
    name: Plan Release
    needs: branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      actions: read
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
      tag_exists: ${{ steps.commit.outputs.tag_exists }}
      sources: ${{ steps.registry.outputs.sources }}
      build_backend: ${{ steps.registry.outputs.build_backend }}
      build_designer: ${{ steps.registry.outputs.build_designer }}
      build_keycloak: ${{ steps.registry.outputs.build_keycloak }}
      build_node_wire_proxy: ${{ steps.registry.outputs.build_node_wire_proxy }}
      build_mcp: ${{ steps.registry.outputs.build_mcp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve commit
        id: commit
        env:
          CHANNEL: ${{ inputs.channel }}
          TAG_NAME: ${{ inputs.tag_name }}
          RC_TAG: ${{ inputs.rc_tag }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$CHANNEL" == "ga" ]]; then
            # The release is the candidate's own commit: the images were built
            # from it, so the git tag has to mark exactly that source.
            commit=$(git rev-parse --verify --quiet "refs/tags/${RC_TAG}^{commit}") || {
              echo "::error::The candidate tag $RC_TAG does not exist. Release a candidate first, or check rc_tag."
              exit 1
            }
            tag_exists=false
            if existing=$(git rev-parse --verify --quiet "refs/tags/${TAG_NAME}^{commit}"); then
              if [[ "$existing" != "$commit" ]]; then
                echo "::error::$TAG_NAME already exists at $existing, not at $RC_TAG ($commit). Published tags are never moved."
                exit 1
              fi
              tag_exists=true
              echo "$TAG_NAME already marks $RC_TAG; a re-run keeps it."
            fi
          else
            commit=$(git rev-parse --verify --quiet "${COMMIT_SHA:-$RUN_SHA}^{commit}") || {
              echo "::error::commit_sha '${COMMIT_SHA}' is not a commit in this repository."
              exit 1
            }
            tag_exists=false
          fi
          if ! git merge-base --is-ancestor "$commit" "$RUN_SHA"; then
            echo "::error::$commit is not on main. Releases come from main's history only."
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "tag_exists=$tag_exists" >> "$GITHUB_OUTPUT"
          echo "Releasing commit $commit"

      # The image names come from the same devx-ci.yaml files the builds
      # publish from, and the paths from each component's *-cicd.yaml push
      # trigger: the paths that decide whether a merge builds that component
      # are the ones that decide which build a release ships.
      - name: Read component config
        env:
          COMPONENTS: ${{ inputs.components }}
        run: |
          set -euo pipefail
          declare -A CONFIG=(
            [backend]="m8flow-backend/devx-ci.yaml .github/workflows/backend-cicd.yaml"
            [designer]="m8flow-designer/devx-ci.yaml .github/workflows/designer-cicd.yaml"
            [keycloak]="keycloak-extensions/devx-ci.yaml .github/workflows/keycloak-cicd.yaml"
            [node-wire-proxy]="m8flow-node-wire-proxy/devx-ci.yaml .github/workflows/node-wire-proxy-cicd.yaml"
            [mcp]="m8flow-mcp/devx-ci.yaml .github/workflows/mcp-server-cicd.yaml"
          )
          if [[ "$COMPONENTS" == "all" ]]; then
            selected=(backend designer keycloak node-wire-proxy mcp)
          else
            selected=("$COMPONENTS")
          fi
          : > "$RUNNER_TEMP/components.tsv"
          for c in "${selected[@]}"; do
            [[ -n "${CONFIG[$c]:-}" ]] || { echo "::error::Unknown component '$c'."; exit 1; }
            read -r cfg workflow <<< "${CONFIG[$c]}"
            name=$(yq -r '.docker.image_name' "$cfg")
            [[ -n "$name" && "$name" != "null" ]] || { echo "::error::$cfg has no docker.image_name."; exit 1; }
            paths=$(yq -r '.on.push.paths[]' "$workflow" | tr '\n' ' ')
            [[ -n "${paths// /}" ]] || { echo "::error::$workflow has no push paths."; exit 1; }
            printf '%s\t%s\t%s\t%s\n' "$c" "$name" "$paths" "${workflow##*/}" >> "$RUNNER_TEMP/components.tsv"
          done
          cat "$RUNNER_TEMP/components.tsv"

      # rc: the image of the last first-parent commit at or before the
      # candidate that changed the component's files. --first-parent because
      # main is merged into with merge commits, and the merge commit is the
      # one whose push built and tagged the image.
      # ga: the candidate's own tag.
      - name: Resolve sources
        env:
          CHANNEL: ${{ inputs.channel }}
          COMMIT: ${{ steps.commit.outputs.commit }}
          RC_TAG: ${{ inputs.rc_tag }}
          COMPONENTS_FILE: ${{ runner.temp }}/components.tsv
          SOURCES_FILE: ${{ runner.temp }}/sources.tsv
        run: |
          set -euo pipefail
          : > "$SOURCES_FILE"
          while IFS=$'\t' read -r component image paths workflow; do
            [[ -n "$component" ]] || continue
            if [[ "$CHANNEL" == "ga" ]]; then
              source="$RC_TAG"
            else
              pathspecs=()
              for p in $paths; do pathspecs+=(":(glob)$p"); done
              built=$(git log -1 --first-parent --format=%H "$COMMIT" -- "${pathspecs[@]}")
              if [[ -z "$built" ]]; then
                echo "::error::No commit at or before $COMMIT changes $component's files ($paths)."
                exit 1
              fi
              source="sha-$built"
            fi
            printf '%s\t%s\t%s\t%s\n' "$component" "$image" "$source" "$workflow" >> "$SOURCES_FILE"
            echo "$component: ${image}:${source}"
          done < "$COMPONENTS_FILE"

      - name: Log in to Docker Hub (OIDC)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: "7af449ca-2b4c-4926-a5d1-82ea3a47eda3"
        with:
          username: m8flow

      # Every image must already exist. The one exception is an rc cut at the
      # tip of main whose component image is missing (the merge build failed,
      # or was superseded while queued): that component is built here, once,
      # from the tip, as sha-<tip>. Anywhere else a missing image stops the
      # release, because this run can only build the commit it runs on.
      #
      # A missing image whose merge CI is still queued or running is not
      # missing, only late: building it here would build that commit twice and
      # race the CI push for the same tag. The release stops and asks to be
      # re-run once that CI finishes. If GitHub can't say, it stops too.
      - name: Check the registry
        id: registry
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CHANNEL: ${{ inputs.channel }}
          COMMIT: ${{ steps.commit.outputs.commit }}
          RUN_SHA: ${{ github.sha }}
          SOURCES_FILE: ${{ runner.temp }}/sources.tsv
        run: |
          set -uo pipefail
          missing=0
          lines=()
          {
            echo "| Component | Image | |"
            echo "|-----------|-------|-|"
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS=$'\t' read -r component image source workflow; do
            [[ -n "$component" ]] || continue
            key="build_${component//-/_}"
            if docker buildx imagetools inspect --raw "docker.io/${image}:${source}" < /dev/null >/dev/null 2>&1; then
              echo "$key=false" >> "$GITHUB_OUTPUT"
              lines+=("${image} ${source}")
              echo "| ${component} | \`${image}:${source}\` | reused |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            if [[ "$CHANNEL" == "rc" ]]; then
              built="${source#sha-}"
              if ! pending=$(gh run list --repo "$REPO" --workflow "$workflow" --commit "$built" \
                    --json status --jq '[.[] | select(.status != "completed")] | length' < /dev/null); then
                echo "::error::Could not ask GitHub whether ${workflow} is still running for ${built}; not building ${component}. Re-run the release."
                missing=1
                continue
              fi
              if [[ "$pending" != "0" ]]; then
                echo "::error::${image}:${source} is not published yet: ${workflow} is still running for ${built}. Re-run the release when it finishes."
                missing=1
                continue
              fi
            fi
            if [[ "$CHANNEL" == "rc" && "$COMMIT" == "$RUN_SHA" ]]; then
              echo "::warning::${image}:${source} does not exist; building ${component} once from ${RUN_SHA}."
              echo "$key=true" >> "$GITHUB_OUTPUT"
              lines+=("${image} sha-${RUN_SHA}")
              echo "| ${component} | \`${image}:sha-${RUN_SHA}\` | built by this run |" >> "$GITHUB_STEP_SUMMARY"
            else
              if [[ "$CHANNEL" == "ga" ]]; then
                echo "::error::${image}:${source} does not exist. A GA release promotes a published candidate."
              else
                echo "::error::${image}:${source} does not exist. Re-run ${component}'s CI for that commit, or cut the candidate at the tip of main so this run can build it."
              fi
              missing=1
            fi
          done < "$SOURCES_FILE"
          {
            echo "sources<<SOURCES_EOF"
            if (( ${#lines[@]} )); then printf '%s\n' "${lines[@]}"; fi
            echo "SOURCES_EOF"
          } >> "$GITHUB_OUTPUT"
          exit $missing

  # rc only. Created on the planned commit, after every image is known to
  # exist or to be buildable.
  tag:
    name: Cut Release Tag
    needs: plan
    if: inputs.channel != 'ga'
    uses: AOT-Technologies/devx-reusable-workflows/.github/workflows/release-tag.yaml@8c34de8ae4f1df16c8bfa0ba484a33982d29a4ed # v1.4.0
    with:
      base_branch: ${{ github.ref_name }}
      tag_name: ${{ inputs.tag_name }}
      commit_sha: ${{ needs.plan.outputs.commit }}
      version_suffix: "-rc"
      dry_run: ${{ inputs.dry_run }}

  # The tag every image gets: the cut X.Y.Z-rc, or the X.Y.Z release.
  version:
    name: Resolve Release Version
    needs: [plan, tag]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.tag.result == 'success' || inputs.channel == 'ga') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      tag: ${{ needs.tag.outputs.tag || inputs.tag_name }}
      commit: ${{ needs.plan.outputs.commit }}
    steps:
      # Every later job writes this tag onto images and into git, so an empty
      # or misshapen one (a changed or skipped tag step) stops the run here,
      # before anything is tagged.
      - name: Check the tag
        env:
          CHANNEL: ${{ inputs.channel }}
          TAG: ${{ needs.tag.outputs.tag || inputs.tag_name }}
          COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          if [[ "$CHANNEL" == "ga" ]]; then shape='^[0-9]+\.[0-9]+\.[0-9]+$'; else shape='^[0-9]+\.[0-9]+\.[0-9]+-rc$'; fi
          if [[ ! "$TAG" =~ $shape ]]; then
            echo "::error::The release tag resolved to '${TAG}', which is not a channel ${CHANNEL} tag. Nothing was tagged."
            exit 1
          fi
          if [[ ! "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The release commit resolved to '${COMMIT}'. Nothing was tagged."
            exit 1
          fi
          echo "Releasing $TAG at $COMMIT"

  # Fallback builds (rc only): a component whose sha-<commit> image is missing
  # is built once from the tip of main, as sha-<tip>. Normally all skipped.
  # Each if: gates on results explicitly: without a status function GitHub adds
  # an implicit success(), which fails on the skipped tag job of a GA run.
  backend:
    name: Build m8flow-backend
    needs: [plan, version]
    if: ${{ !cancelled() && needs.version.result == 'success' && inputs.dry_run != true && needs.plan.outputs.build_backend == 'true' }}
    uses: AOT-Technologies/devx-reusable-workflows/.github/workflows/ci-orchestrator.yaml@8c34de8ae4f1df16c8bfa0ba484a33982d29a4ed # v1.4.0
    with:
      config_path: m8flow-backend/devx-ci.yaml
      push: true
      image_tag: sha-${{ github.sha }}
    secrets:
      sonar_token: ${{ secrets.SONAR_TOKEN }}
      GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}

  designer:
    name: Build m8flow-designer
    needs: [plan, version]
    if: ${{ !cancelled() && needs.version.result == 'success' && inputs.dry_run != true && needs.plan.outputs.build_designer == 'true' }}
    uses: AOT-Technologies/devx-reusable-workflows/.github/workflows/ci-orchestrator.yaml@8c34de8ae4f1df16c8bfa0ba484a33982d29a4ed # v1.4.0
    with:
      config_path: m8flow-designer/devx-ci.yaml
      push: true
      image_tag: sha-${{ github.sha }}
    secrets:
      sonar_token: ${{ secrets.SONAR_TOKEN }}
      GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}

  keycloak:
    name: Build m8flow-keycloak
    needs: [plan, version]
    if: ${{ !cancelled() && needs.version.result == 'success' && inputs.dry_run != true && needs.plan.outputs.build_keycloak == 'true' }}
    uses: AOT-Technologies/devx-reusable-workflows/.github/workflows/ci-orchestrator.yaml@8c34de8ae4f1df16c8bfa0ba484a33982d29a4ed # v1.4.0
    with:
      config_path: keycloak-extensions/devx-ci.yaml
      push: true
      image_tag: sha-${{ github.sha }}
    secrets:
      sonar_token: ${{ secrets.SONAR_TOKEN }}
      GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}

  node-wire-proxy:
    name: Build m8flow-node-wire-proxy
    needs: [plan, version]
    if: ${{ !cancelled() && needs.version.result == 'success' && inputs.dry_run != true && needs.plan.outputs.build_node_wire_proxy == 'true' }}
    uses: AOT-Technologies/devx-reusable-workflows/.github/workflows/ci-orchestrator.yaml@8c34de8ae4f1df16c8bfa0ba484a33982d29a4ed # v1.4.0
    with:
      config_path: m8flow-node-wire-proxy/devx-ci.yaml
      push: true
      image_tag: sha-${{ github.sha }}
    secrets:
      sonar_token: ${{ secrets.SONAR_TOKEN }}
      GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}

  mcp:
    name: Build m8flow-mcp
    needs: [plan, version]
    if: ${{ !cancelled() && needs.version.result == 'success' && inputs.dry_run != true && needs.plan.outputs.build_mcp == 'true' }}
    uses: AOT-Technologies/devx-reusable-workflows/.github/workflows/ci-orchestrator.yaml@8c34de8ae4f1df16c8bfa0ba484a33982d29a4ed # v1.4.0
    with:
      config_path: m8flow-mcp/devx-ci.yaml
      push: true
      image_tag: sha-${{ github.sha }}
    secrets:
      sonar_token: ${{ secrets.SONAR_TOKEN }}
      GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}

  # GA only. Configure required reviewers on the `release` environment
  # (Settings → Environments) so a production release needs a second person.
  # Kept on its own job, with no OIDC: an environment changes the OIDC
  # subject, which the Docker Hub connection (trusting main) would refuse.
  approve:
    name: Approve Release
    needs: version
    if: ${{ !cancelled() && needs.version.result == 'success' && inputs.channel == 'ga' && inputs.dry_run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: release
    permissions: {}
    steps:
      - env:
          RC_TAG: ${{ inputs.rc_tag }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: echo "Approved $RC_TAG → $TAG_NAME"

  # Both channels: copy each planned source manifest onto the release tag.
  # `imagetools create` copies by digest and never pulls or rebuilds layers.
  promote:
    name: Tag Images
    needs: [plan, version, approve, backend, designer, keycloak, node-wire-proxy, mcp]
    if: ${{ !cancelled() && inputs.dry_run != true && needs.version.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && (inputs.channel != 'ga' || needs.approve.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check the tools this job needs
        run: |
          set -euo pipefail
          for tool in sha256sum awk; do
            command -v "$tool" >/dev/null || { echo "::error::$tool is not on this runner."; exit 1; }
          done
          docker buildx version >/dev/null || { echo "::error::docker buildx is unavailable."; exit 1; }

      - name: Log in to Docker Hub (OIDC)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: "7af449ca-2b4c-4926-a5d1-82ea3a47eda3"
        with:
          username: m8flow

      # Resolve every source digest before writing anything: a missing or
      # unreadable one stops the release here, with no tag created.
      #
      # The digest is the sha256 of the raw manifest bytes, which is exactly
      # what the registry stores it as. Reading a formatted field instead would
      # depend on whether the tag points at a single manifest or an index.
      - name: Resolve the source digests
        env:
          SOURCES: ${{ needs.plan.outputs.sources }}
          TARGET_TAG: ${{ needs.version.outputs.tag }}
        run: |
          # Deliberately no -e. Every image is probed so the step can report
          # all the problems at once; -e would exit at the first and make a
          # maintainer re-run the release to discover the next.
          set -uo pipefail
          missing=0
          : > /tmp/source-digests
          while read -r image source; do
            [[ -n "$image" ]] || continue
            if raw=$(docker buildx imagetools inspect --raw "docker.io/${image}:${source}" 2>/dev/null) && [[ -n "$raw" ]]; then
              digest="sha256:$(printf '%s' "$raw" | sha256sum | awk '{print $1}')"
              echo "${image} ${source} ${digest}" >> /tmp/source-digests
              echo "${image}:${source} -> ${digest}"
              # Published tags are never moved. A target tag that already
              # exists must already be this image (a re-run); anything else stops.
              if existing=$(docker buildx imagetools inspect --raw "docker.io/${image}:${TARGET_TAG}" 2>/dev/null) && [[ -n "$existing" ]]; then
                existing_digest="sha256:$(printf '%s' "$existing" | sha256sum | awk '{print $1}')"
                if [[ "$existing_digest" != "$digest" ]]; then
                  echo "::error::${image}:${TARGET_TAG} already exists as ${existing_digest}, not ${digest}. Published tags are never overwritten."
                  missing=1
                fi
              fi
            else
              echo "::error::${image}:${source} does not exist or cannot be read."
              missing=1
            fi
          done <<< "$SOURCES"
          [[ -s /tmp/source-digests ]] || { echo "::error::The plan named no images."; exit 1; }
          exit $missing

      - name: Tag and verify
        env:
          TARGET_TAG: ${{ needs.version.outputs.tag }}
        run: |
          # Deliberately no -e, as above. Tagging is not atomic across
          # repositories, so a failure part-way has to fall through to the
          # report naming which tags now exist.
          set -uo pipefail
          {
            echo "## Tagged \`${TARGET_TAG}\`"
            echo ""
            echo "| Image | From | Digest |"
            echo "|-------|------|--------|"
          } >> "$GITHUB_STEP_SUMMARY"

          done_images=()
          rc=0
          while read -r image source expected; do
            [[ -n "$image" ]] || continue
            src="docker.io/${image}:${source}"
            dst="docker.io/${image}:${TARGET_TAG}"
            # --prefer-index=false keeps a single-platform image single-platform
            # instead of wrapping it in a new index, which would change the digest.
            if ! docker buildx imagetools create --prefer-index=false -t "$dst" "$src"; then
              echo "::error::${image}: tagging ${TARGET_TAG} failed."
              rc=1; break
            fi
            done_images+=("$image")
            if ! raw=$(docker buildx imagetools inspect --raw "$dst"); then
              echo "::error::${image}: ${TARGET_TAG} was tagged but cannot be read back to verify it."
              rc=1; break
            fi
            actual="sha256:$(printf '%s' "$raw" | sha256sum | awk '{print $1}')"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::${image}: ${TARGET_TAG} is ${actual} but the source is ${expected}."
              rc=1; break
            fi
            echo "| \`${image}\` | \`${source}\` | \`${actual}\` |" >> "$GITHUB_STEP_SUMMARY"
          done < /tmp/source-digests

          if [[ "$rc" -ne 0 ]]; then
            {
              echo ""
              echo "**This release is incomplete.** Tagged before the failure: ${done_images[*]:-none}."
              echo "Fix the cause and run it again. Tagging is idempotent: each tag is copied from the same source digest."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Tagging stopped part-way. Already tagged ${TARGET_TAG}: ${done_images[*]:-none}. Re-run once the cause is fixed; it is idempotent."
            exit 1
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Same digests as the source images: nothing was rebuilt." >> "$GITHUB_STEP_SUMMARY"

  # GA only, after every image carries the release tag: mark the candidate's
  # commit with the release tag, so the git tag never names a release whose
  # images are not published.
  git-tag:
    name: Tag Release in Git
    needs: [plan, promote]
    if: ${{ !cancelled() && inputs.channel == 'ga' && inputs.dry_run != true && needs.promote.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag_name }}
          RC_TAG: ${{ inputs.rc_tag }}
          COMMIT: ${{ needs.plan.outputs.commit }}
          TAG_EXISTS: ${{ needs.plan.outputs.tag_exists }}
        run: |
          set -euo pipefail
          if [[ "$TAG_EXISTS" == "true" ]]; then
            echo "$TAG already marks $COMMIT."
            exit 0
          fi
          tag_sha=$(gh api "repos/$REPO/git/tags" \
            -f tag="$TAG" -f object="$COMMIT" -f type=commit \
            -f message="m8flow $TAG (promoted from $RC_TAG)" --jq .sha)
          gh api "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$tag_sha" >/dev/null
          echo "Tagged \`$COMMIT\` as \`$TAG\` (from \`$RC_TAG\`)" >> "$GITHUB_STEP_SUMMARY"

  github-release:
    name: GitHub Release
    needs: git-tag
    if: ${{ !cancelled() && inputs.channel == 'ga' && inputs.dry_run != true && needs.git-tag.result == 'success' }}
    uses: ./.github/workflows/github-release.yml
    with:
      version: ${{ inputs.tag_name }}

  summary:
    name: Release Summary
    if: always() && inputs.dry_run != true
    needs: [branch, plan, tag, version, approve, backend, designer, keycloak, node-wire-proxy, mcp, promote, git-tag, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report
        env:
          CHANNEL: ${{ inputs.channel }}
          TAG: ${{ needs.version.outputs.tag }}
          RC_TAG: ${{ inputs.rc_tag }}
          COMMIT: ${{ needs.version.outputs.commit }}
          R_VERSION: ${{ needs.version.result }}
          R_BUILDS: ${{ needs.backend.result }} ${{ needs.designer.result }} ${{ needs.keycloak.result }} ${{ needs.node-wire-proxy.result }} ${{ needs.mcp.result }}
          R_PROMOTE: ${{ needs.promote.result }}
          R_GIT_TAG: ${{ needs.git-tag.result }}
          R_GH_RELEASE: ${{ needs.github-release.result }}
        run: |
          # Gates on the version job, which succeeds for either channel; the
          # rc-only tag job is skipped on every healthy GA run.
          if [[ "$R_VERSION" != "success" ]]; then
            echo "## Release: nothing was resolved (${R_VERSION})" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::The branch check, the plan or the tag step did not succeed (${R_VERSION}); no image was tagged."
            exit 1
          fi
          for result in $R_BUILDS; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error::A fallback build did not succeed (${result}); nothing was tagged ${TAG}."
              exit 1
            fi
          done
          if [[ "$R_PROMOTE" != "success" ]]; then
            echo "::error::Tagging the images ${TAG} did not succeed (${R_PROMOTE}). That job lists which images were tagged."
            exit 1
          fi
          if [[ "$CHANNEL" == "ga" ]]; then
            if [[ "$R_GIT_TAG" != "success" ]]; then
              echo "::error::The images are tagged ${TAG}, but the git tag was not created (${R_GIT_TAG}). Re-run the release; it is idempotent."
              exit 1
            fi
            if [[ "$R_GH_RELEASE" != "success" ]]; then
              echo "::error::${TAG} is tagged, but the GitHub Release was not created (${R_GH_RELEASE}). Run the GitHub Release workflow with version ${TAG}."
              exit 1
            fi
            {
              echo "## Released \`${TAG}\`"
              echo ""
              echo "Promoted \`${RC_TAG}\` (commit \`${COMMIT}\`). Review the draft GitHub Release and publish it."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Release candidate \`${TAG}\`"
            echo ""
            echo "Commit: \`${COMMIT}\`"
            echo ""
            echo "Deploy with each component's CI/CD workflow (workflow_dispatch, image \`docker.io/m8flow/<name>:${TAG}\`)."
          } >> "$GITHUB_STEP_SUMMARY"

  # One message per release, with every job's result.
  notify:
    name: Release Notification
    if: always() && inputs.dry_run != true
    needs: [branch, plan, tag, version, backend, designer, keycloak, node-wire-proxy, mcp, promote, git-tag, github-release, summary]
    uses: AOT-Technologies/devx-reusable-workflows/.github/workflows/notify-google-chat.yaml@8c34de8ae4f1df16c8bfa0ba484a33982d29a4ed # v1.4.0
    secrets:
      GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
    with:
      status: ${{ needs.summary.result == 'success' && 'success' || 'failure' }}
      title: ${{ needs.summary.result == 'success' && format('Release {0} published', needs.version.outputs.tag) || format('Release {0} failed', needs.version.outputs.tag || '(no tag)') }}
      details: |
        Tag: ${{ needs.version.outputs.tag }} on ${{ needs.version.outputs.commit }}
        Channel: ${{ inputs.channel }} ${{ inputs.rc_tag }}
        Images tagged: ${{ needs.promote.result }}
        Fallback builds: backend ${{ needs.backend.result }}, designer ${{ needs.designer.result }}, keycloak ${{ needs.keycloak.result }}, node-wire-proxy ${{ needs.node-wire-proxy.result }}, mcp ${{ needs.mcp.result }}
        Git tag: ${{ needs.git-tag.result }} / GitHub Release: ${{ needs.github-release.result }}
        Images: docker.io/m8flow/<component>:${{ needs.version.outputs.tag }}
      message: >-
        ${{ needs.summary.result == 'success' && 'Deploy with each component''s CI/CD workflow (workflow_dispatch, image_uri above).'
          || 'The release did not complete; see the run summary.' }}
