name: Release

# =============================================================================
# Releases main (any other branch is refused: the Docker Hub OIDC connection
# trusts main only, and the tag is created before the images are pushed).
# One manual dispatch:
#   1. resolve the release tag:
#      - channel rc (default): create the next X.Y.Z-rc tag on that branch
#      - channel ga: verify the maintainer-signed X.Y.Z-ga tag, which must
#        point at the same commit as its X.Y.Z-rc (GA tags are signed, so CI
#        cannot create them)
#   2. rc builds every selected component at that tag and pushes it to Docker
#      Hub (public m8flow/* repositories); ga does not build, it promotes the
#      already-released X.Y.Z-rc images onto the X.Y.Z-ga tag. Either way the
#      login is the m8flow organization's OIDC connection, no stored credential
#
# A GA release ships the bytes that were tested. Rebuilding from the same
# commit would produce different images -- base images move, builds are not
# reproducible -- so GA copies the rc manifests by digest instead.
#
# A GA release then gets its GitHub Release, SBOMs, checksums, and Sigstore
# signatures from github-release.yml. See docs/how-to/release-and-roll-back.md.
#
# It publishes only; it deploys nothing. Deploying a released image is the
# manual workflow_dispatch of each component's *-cicd.yaml, as on main.
#
# Versions: next-gen releases are 2.x (main was 1.0.x). The first run sets
# tag_name 2.0.0-rc; later runs auto-increment the patch from the highest
# X.Y.Z-rc tag merged into the branch (sorted by version, so once next-gen is
# merged into main, main continues from 2.0.x).
#
# The build must live in this run rather than in a `push: tags:` workflow:
# GitHub does not start a workflow run from an event created with the default
# GITHUB_TOKEN, so a tag pushed by step 1 would never trigger step 2. Chaining
# on needs keeps the tag and the images atomic to one run.
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "rc: create the next X.Y.Z-rc tag. ga: promote an already-released X.Y.Z-rc to the signed X.Y.Z-ga tag."
        required: false
        default: rc
        type: choice
        options:
          - rc
          - ga
      tag_name:
        description: "rc: tag to create (X.Y.Z-rc; 2.x for next-gen), or empty to auto-increment the patch. ga: required, the signed X.Y.Z-ga tag; its X.Y.Z-rc images must already exist."
        required: false
        type: string
      commit_sha:
        description: "Commit to tag. Leave empty for the tip of the branch this runs from."
        required: false
        type: string
      components:
        description: 'Which components to release ("all" for a full set)'
        required: false
        default: all
        type: choice
        options:
          - all
          - backend
          - designer
          - keycloak
          - node-wire-proxy
          - mcp
      dry_run:
        description: "Resolve the tag only (rc: compute the next -rc tag; ga: verify the signed tag); create nothing and build nothing"
        required: false
        default: false
        type: boolean

# Declared once at workflow level. A job-level permissions block on a job that
# calls a reusable workflow makes the run fail to start, so the superset lives
# here: contents: write for tag creation, id-token: write, which the
# rest for the CI orchestrator.
permissions:
  contents: write
  security-events: write
  actions: read
  id-token: write
  packages: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Releases come from main only. A plain job (not a
  # skipped one) so that a run from any other branch fails visibly.
  branch:
    name: Check Release Branch
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Release channel
        env:
          CHANNEL: ${{ inputs.channel }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          if [[ "$CHANNEL" == "ga" && ! "$TAG_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+-ga$ ]]; then
            echo "::error::A GA release needs tag_name set to the signed X.Y.Z-ga tag you pushed (got '${TAG_NAME}')."
            exit 1
          fi
          if [[ "$CHANNEL" == "rc" && -n "$TAG_NAME" && ! "$TAG_NAME" =~ -rc$ ]]; then
            echo "::error::An rc release tag ends in -rc (got '${TAG_NAME}'). Use channel ga for a final release."
            exit 1
          fi

      - name: Release branch
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/heads/main) echo "Releasing main" ;;
            *) echo "::error::Run Release from main, not $REF."; exit 1 ;;
          esac

      # Next-gen versions start at 2.0.0. Without a 2.x tag yet, auto-increment
      # would continue main's 1.0.x line and publish next-gen images as 1.0.x.
      - name: Version line
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          if [[ -n "$TAG_NAME" ]]; then
            if [[ "$TAG_NAME" =~ ^([0-9]+)\. ]] && (( BASH_REMATCH[1] >= 2 )); then exit 0; fi
            echo "::error::tag_name $TAG_NAME: next-gen releases are 2.x or later."
            exit 1
          fi
          n=$(gh api "repos/$REPO/git/matching-refs/tags/" --paginate \
                --jq '.[].ref | ltrimstr("refs/tags/") | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+-rc$")) | select((split(".")[0] | tonumber) >= 2)' | wc -l)
          if (( n == 0 )); then
            echo "::error::No 2.x release tag yet: set tag_name (2.0.0-rc for the first release)."
            exit 1
          fi

  tag:
    name: Cut Release Tag
    needs: branch
    if: inputs.channel != 'ga'
    uses: AOT-Technologies/devx-reusable-workflows/.github/workflows/release-tag.yaml@8c34de8ae4f1df16c8bfa0ba484a33982d29a4ed # v1.4.0
    with:
      base_branch: ${{ github.ref_name }}
      tag_name: ${{ inputs.tag_name }}
      commit_sha: ${{ inputs.commit_sha }}
      version_suffix: "-rc"
      dry_run: ${{ inputs.dry_run }}

  # GA tags are created and signed by a maintainer (git tag -s X.Y.Z), so the
  # release attests who cut it. This job only verifies the tag.
  ga-tag:
    name: Verify Signed GA Tag
    needs: branch
    if: inputs.channel == 'ga'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      commit: ${{ steps.verify.outputs.commit }}
      rc_tag: ${{ steps.verify.outputs.rc_tag }}
    steps:
      - name: Verify tag
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag_name }}
          RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ref=$(gh api "repos/$REPO/git/ref/tags/$TAG" 2>/dev/null) || {
            echo "::error::Tag $TAG does not exist. Push it first: git tag -s $TAG -m 'Release $TAG' && git push origin $TAG"
            exit 1
          }
          if [[ "$(jq -r .object.type <<<"$ref")" != "tag" ]]; then
            echo "::error::$TAG is a lightweight tag. GA tags must be annotated and signed (git tag -s)."
            exit 1
          fi
          tag_obj=$(gh api "repos/$REPO/git/tags/$(jq -r .object.sha <<<"$ref")")
          if [[ "$(jq -r .verification.verified <<<"$tag_obj")" != "true" ]]; then
            echo "::error::GitHub could not verify the signature on $TAG ($(jq -r .verification.reason <<<"$tag_obj")). Sign it with a key registered on your GitHub account."
            exit 1
          fi
          commit=$(jq -r .object.sha <<<"$tag_obj")
          # Nothing is built here, so the run's own commit does not matter.
          # What must hold is that the GA tag marks the same code the rc was
          # cut from, since its images are what get promoted.
          rc_tag="${TAG%-ga}-rc"
          rc_ref=$(gh api "repos/$REPO/git/ref/tags/$rc_tag" 2>/dev/null) || {
            echo "::error::$TAG has no matching $rc_tag tag. GA promotes an existing release candidate; release $rc_tag first."
            exit 1
          }
          rc_sha=$(jq -r .object.sha <<<"$rc_ref")
          if [[ "$(jq -r .object.type <<<"$rc_ref")" == "tag" ]]; then
            rc_sha=$(gh api "repos/$REPO/git/tags/$rc_sha" --jq .object.sha)
          fi
          if [[ "$commit" != "$rc_sha" ]]; then
            echo "::error::$TAG points at $commit but $rc_tag points at $rc_sha. A GA tag must mark the same commit as the release candidate it promotes."
            exit 1
          fi
          echo "rc_tag=$rc_tag" >> "$GITHUB_OUTPUT"
          echo "Verified signed tag $TAG at $commit (signed by $(jq -r .tagger.name <<<"$tag_obj"))"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  # The tag this release builds, from whichever channel ran.
  version:
    name: Resolve Release Version
    needs: [tag, ga-tag]
    if: always() && (needs.tag.result == 'success' || needs.ga-tag.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      tag: ${{ needs.tag.outputs.tag || needs.ga-tag.outputs.tag }}
      commit: ${{ needs.tag.outputs.commit || needs.ga-tag.outputs.commit }}
      rc_tag: ${{ needs.ga-tag.outputs.rc_tag }}
    steps:
      - run: echo "Releasing ${{ needs.tag.outputs.tag || needs.ga-tag.outputs.tag }}"

  # Every component is built at the same version, so a release is one complete,
  # consistent set of images rather than whichever parts happened to change.
  # The registry (Docker Hub, m8flow/*) comes from each component's devx-ci.yaml.
  # Each if: gates on needs.version.result explicitly. Without a status
  # function GitHub adds an implicit success(), which also fails on the skipped
  # tag or ga-tag job upstream of version, so every build would be skipped.
  backend:
    name: Release m8flow-backend
    needs: version
    if: ${{ !cancelled() && needs.version.result == 'success' && inputs.channel != 'ga' && inputs.dry_run != true && (inputs.components == 'all' || inputs.components == 'backend') }}
    uses: AOT-Technologies/devx-reusable-workflows/.github/workflows/ci-orchestrator.yaml@8c34de8ae4f1df16c8bfa0ba484a33982d29a4ed # v1.4.0
    with:
      config_path: m8flow-backend/devx-ci.yaml
      push: true
      image_tag: ${{ needs.version.outputs.tag }}
    secrets:
      sonar_token: ${{ secrets.SONAR_TOKEN }}
      GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}

  designer:
    name: Release m8flow-designer
    needs: version
    if: ${{ !cancelled() && needs.version.result == 'success' && inputs.channel != 'ga' && inputs.dry_run != true && (inputs.components == 'all' || inputs.components == 'designer') }}
    uses: AOT-Technologies/devx-reusable-workflows/.github/workflows/ci-orchestrator.yaml@8c34de8ae4f1df16c8bfa0ba484a33982d29a4ed # v1.4.0
    with:
      config_path: m8flow-designer/devx-ci.yaml
      push: true
      image_tag: ${{ needs.version.outputs.tag }}
    secrets:
      sonar_token: ${{ secrets.SONAR_TOKEN }}
      GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}

  keycloak:
    name: Release m8flow-keycloak
    needs: version
    if: ${{ !cancelled() && needs.version.result == 'success' && inputs.channel != 'ga' && inputs.dry_run != true && (inputs.components == 'all' || inputs.components == 'keycloak') }}
    uses: AOT-Technologies/devx-reusable-workflows/.github/workflows/ci-orchestrator.yaml@8c34de8ae4f1df16c8bfa0ba484a33982d29a4ed # v1.4.0
    with:
      config_path: keycloak-extensions/devx-ci.yaml
      push: true
      image_tag: ${{ needs.version.outputs.tag }}
    secrets:
      sonar_token: ${{ secrets.SONAR_TOKEN }}
      GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}

  node-wire-proxy:
    name: Release m8flow-node-wire-proxy
    needs: version
    if: ${{ !cancelled() && needs.version.result == 'success' && inputs.channel != 'ga' && inputs.dry_run != true && (inputs.components == 'all' || inputs.components == 'node-wire-proxy') }}
    uses: AOT-Technologies/devx-reusable-workflows/.github/workflows/ci-orchestrator.yaml@8c34de8ae4f1df16c8bfa0ba484a33982d29a4ed # v1.4.0
    with:
      config_path: m8flow-node-wire-proxy/devx-ci.yaml
      push: true
      image_tag: ${{ needs.version.outputs.tag }}
    secrets:
      sonar_token: ${{ secrets.SONAR_TOKEN }}
      GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}

  mcp:
    name: Release m8flow-mcp
    needs: version
    if: ${{ !cancelled() && needs.version.result == 'success' && inputs.channel != 'ga' && inputs.dry_run != true && (inputs.components == 'all' || inputs.components == 'mcp') }}
    uses: AOT-Technologies/devx-reusable-workflows/.github/workflows/ci-orchestrator.yaml@8c34de8ae4f1df16c8bfa0ba484a33982d29a4ed # v1.4.0
    with:
      config_path: m8flow-mcp/devx-ci.yaml
      push: true
      image_tag: ${{ needs.version.outputs.tag }}
    secrets:
      sonar_token: ${{ secrets.SONAR_TOKEN }}
      GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}

  # GA does not build. It copies each released X.Y.Z-rc manifest onto the
  # X.Y.Z-ga tag, so the image shipped is bit-for-bit the one that was tested.
  # `imagetools create` copies by digest and never pulls or rebuilds layers.
  promote:
    name: Promote ${{ needs.version.outputs.rc_tag }} to ${{ needs.version.outputs.tag }}
    needs: version
    if: ${{ !cancelled() && needs.version.result == 'success' && inputs.channel == 'ga' && inputs.dry_run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # One source of truth for the image names: the same devx-ci.yaml files
      # the rc build publishes from.
      - name: Resolve images
        id: images
        env:
          COMPONENTS: ${{ inputs.components }}
        run: |
          set -euo pipefail
          declare -A CONFIG=(
            [backend]=m8flow-backend/devx-ci.yaml
            [designer]=m8flow-designer/devx-ci.yaml
            [keycloak]=keycloak-extensions/devx-ci.yaml
            [node-wire-proxy]=m8flow-node-wire-proxy/devx-ci.yaml
            [mcp]=m8flow-mcp/devx-ci.yaml
          )
          if [[ "$COMPONENTS" == "all" ]]; then
            selected=(backend designer keycloak node-wire-proxy mcp)
          else
            selected=("$COMPONENTS")
          fi
          images=()
          for c in "${selected[@]}"; do
            cfg="${CONFIG[$c]:-}"
            [[ -n "$cfg" ]] || { echo "::error::Unknown component '$c'."; exit 1; }
            name=$(yq -r '.docker.image_name' "$cfg")
            [[ -n "$name" && "$name" != "null" ]] || { echo "::error::$cfg has no docker.image_name."; exit 1; }
            images+=("$name")
          done
          echo "images=${images[*]}" >> "$GITHUB_OUTPUT"
          echo "Promoting: ${images[*]}"

      # Fail before anything is written: a half-promoted release, where some
      # components carry the GA tag and others do not, is worse than none.
      - name: Check every source image exists
        env:
          IMAGES: ${{ steps.images.outputs.images }}
          RC_TAG: ${{ needs.version.outputs.rc_tag }}
        run: |
          set -uo pipefail
          missing=0
          for image in $IMAGES; do
            if docker manifest inspect "docker.io/${image}:${RC_TAG}" >/dev/null 2>&1; then
              echo "found ${image}:${RC_TAG}"
            else
              echo "::error::${image}:${RC_TAG} does not exist. GA promotes a released candidate; release it first, or check the tag."
              missing=1
            fi
          done
          exit $missing

      - name: Log in to Docker Hub (OIDC)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: "7af449ca-2b4c-4926-a5d1-82ea3a47eda3"
        with:
          username: m8flow

      - name: Promote and verify
        env:
          IMAGES: ${{ steps.images.outputs.images }}
          RC_TAG: ${{ needs.version.outputs.rc_tag }}
          GA_TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          {
            echo "## Promoted \`${RC_TAG}\` to \`${GA_TAG}\`"
            echo ""
            echo "| Image | Digest |"
            echo "|-------|--------|"
          } >> "$GITHUB_STEP_SUMMARY"
          for image in $IMAGES; do
            src="docker.io/${image}:${RC_TAG}"
            dst="docker.io/${image}:${GA_TAG}"
            before=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$src")
            # --prefer-index=false keeps a single-platform image single-platform
            # instead of wrapping it in a new index, which would change the digest.
            docker buildx imagetools create --prefer-index=false -t "$dst" "$src"
            after=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$dst")
            if [[ "$before" != "$after" ]]; then
              echo "::error::${image}: promoted digest ${after} does not match ${before}. The GA tag is not the tested image."
              exit 1
            fi
            echo "${image}: ${after}"
            echo "| \`${image}\` | \`${after}\` |" >> "$GITHUB_STEP_SUMMARY"
          done
          {
            echo ""
            echo "Same digests as the release candidate: nothing was rebuilt."
          } >> "$GITHUB_STEP_SUMMARY"

  summary:
    name: Release Summary
    if: always() && inputs.dry_run != true
    needs: [branch, tag, ga-tag, version, promote, backend, designer, keycloak, node-wire-proxy, mcp]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report
        env:
          TAG: ${{ needs.version.outputs.tag }}
          COMMIT: ${{ needs.version.outputs.commit }}
          R_TAG: ${{ needs.version.result }}
          REGISTRY: docker.io/m8flow
          R_BACKEND: ${{ needs.backend.result }}
          R_DESIGNER: ${{ needs.designer.result }}
          R_KEYCLOAK: ${{ needs.keycloak.result }}
          R_NODEWIRE: ${{ needs.node-wire-proxy.result }}
          R_MCP: ${{ needs.mcp.result }}
          R_PROMOTE: ${{ needs.promote.result }}
          CHANNEL: ${{ inputs.channel }}
          RC_TAG: ${{ needs.version.outputs.rc_tag }}
          COMPONENTS: ${{ inputs.components }}
        run: |
          if [[ "$R_TAG" != "success" ]]; then
            echo "## Release: no tag was cut (${R_TAG})" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::No release tag was created (branch check or tag step: ${R_TAG}); nothing was built."
            exit 1
          fi
          if [[ "$CHANNEL" == "ga" ]]; then
            if [[ "$R_PROMOTE" != "success" ]]; then
              echo "::error::Promoting ${RC_TAG} to ${TAG} did not succeed (${R_PROMOTE}); the GA tag may not exist."
              exit 1
            fi
            # The promote job already wrote the per-image digests.
            echo "Released \`${TAG}\` by promoting \`${RC_TAG}\` (commit \`${COMMIT}\`)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## Release \`${TAG}\`"
            echo ""
            echo "Commit: \`${COMMIT}\`"
            echo ""
            echo "| Component | Image | Result |"
            echo "|-----------|-------|--------|"
            echo "| backend | \`${REGISTRY}/m8flow-backend:${TAG}\` | ${R_BACKEND} |"
            echo "| designer | \`${REGISTRY}/m8flow-designer:${TAG}\` | ${R_DESIGNER} |"
            echo "| keycloak | \`${REGISTRY}/m8flow-keycloak:${TAG}\` | ${R_KEYCLOAK} |"
            echo "| node-wire-proxy | \`${REGISTRY}/m8flow-node-wire-proxy:${TAG}\` | ${R_NODEWIRE} |"
            echo "| mcp | \`${REGISTRY}/m8flow-mcp:${TAG}\` | ${R_MCP} |"
            echo ""
            echo "Deploy with each component's CI/CD workflow (workflow_dispatch, image_uri above)."
          } >> "$GITHUB_STEP_SUMMARY"

          # Every selected component must succeed; 'skipped' is fine only for a
          # component that was not selected. notify reads this job's result, so
          # a release that built nothing is not reported as published.
          failed=0
          for pair in "backend=$R_BACKEND" "designer=$R_DESIGNER" "keycloak=$R_KEYCLOAK" \
                      "node-wire-proxy=$R_NODEWIRE" "mcp=$R_MCP"; do
            name=${pair%%=*} result=${pair#*=}
            if [[ "$COMPONENTS" == "all" || "$COMPONENTS" == "$name" ]]; then
              [[ "$result" == "success" ]] || { echo "::error::$name was selected but did not build for ${TAG} (${result})."; failed=1; }
            fi
          done
          exit "$failed"

  # One message per release: the tag and every component's image and result.
  # (Each component's CI run also notifies its own build and findings.)
  notify:
    name: Release Notification
    if: always() && inputs.dry_run != true
    needs: [branch, tag, ga-tag, version, backend, designer, keycloak, node-wire-proxy, mcp, summary]
    uses: AOT-Technologies/devx-reusable-workflows/.github/workflows/notify-google-chat.yaml@8c34de8ae4f1df16c8bfa0ba484a33982d29a4ed # v1.4.0
    secrets:
      GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
    with:
      status: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'failure' || 'success' }}
      title: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && format('Release {0} failed', needs.version.outputs.tag || '(no tag)') || format('Release {0} published', needs.version.outputs.tag) }}
      details: |
        Tag: ${{ needs.version.outputs.tag }} on ${{ needs.version.outputs.commit }}
        m8flow-backend: ${{ needs.backend.result }}
        m8flow-designer: ${{ needs.designer.result }}
        m8flow-keycloak: ${{ needs.keycloak.result }}
        m8flow-node-wire-proxy: ${{ needs.node-wire-proxy.result }}
        m8flow-mcp: ${{ needs.mcp.result }}
        Images: docker.io/m8flow/<name above>:${{ needs.version.outputs.tag }}, e.g. docker.io/m8flow/m8flow-backend:${{ needs.version.outputs.tag }}
      message: >-
        ${{ contains(needs.*.result, 'failure') && 'At least one selected component did not build or publish; see the run.'
          || 'Deploy with each component''s CI/CD workflow (workflow_dispatch, image_uri above).' }}
