name: Migration Check

# Alembic checks for m8flow-backend: every migration can be read and compiles,
# and the revision chain has exactly one head (both fail the run).
# Destructive operations in the upgrade() of the migrations changed by the PR
# or push are flagged as warnings on the file and line.
# See .github/scripts/check_migrations.py.
#
# No path filter: it runs on every PR and push (about 15 seconds), so it can be
# a required status check and the chain is checked after every merge.

on:
  pull_request:
    branches:
      - main
      - refactor/next-gen
  push:
    branches:
      - main
      - refactor/next-gen

permissions:
  contents: read

concurrency:
  group: check-migrations-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  migrations:
    name: Alembic migrations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The checker's own tests first, so a broken checker fails the run
      # instead of passing everything.
      - name: Test the checker
        run: python -m unittest discover -s .github/scripts -p "test_*.py" -v

      - name: Check migrations
        env:
          # Changed migrations are found against the PR base, or the commit
          # before the push (all zeros for a new branch: everything is checked).
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python .github/scripts/check_migrations.py "$BASE_SHA"
