name: Snyk Container Scan

on:
  workflow_call:
    inputs:
      component:
        description: Image family label used in the report artifact.
        required: true
        type: string
      image_uri:
        description: Fully-qualified image reference, including tag.
        required: true
        type: string
      dockerfile:
        description: Optional Dockerfile corresponding to the image.
        required: false
        default: ""
        type: string
      build_image:
        description: Build the image from dockerfile in this run instead of pulling a published image.
        required: false
        default: false
        type: boolean
      image_source:
        description: Registry source when downloading a published image.
        required: false
        default: public
        type: string
      report_only:
        description: Allow scanner/setup/report failures without failing the calling workflow.
        required: false
        default: false
        type: boolean
      image_artifact:
        description: Optional same-run Docker image tarball artifact name.
        required: false
        default: ""
        type: string
    secrets:
      SNYK_TOKEN:
        required: false
    outputs:
      scan_status:
        description: Scan result, skipped_fork_pr for fork pull requests, or skipped_no_token when SNYK_TOKEN is absent.
        value: ${{ jobs.scan.outputs.scan_status }}

permissions:
  contents: read
  actions: read

jobs:
  scan:
    name: Scan ${{ inputs.component }} image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      scan_status: ${{ steps.snyk.outputs.scan_result || steps.setup-error.outputs.scan_status || steps.token-check.outputs.scan_status || (steps.eligibility.outputs.scan_status == 'skipped_fork_pr' && 'skipped_fork_pr' || 'scanner_error') }}
    continue-on-error: ${{ inputs.report_only }}
    steps:
      - name: Check scan eligibility
        id: eligibility
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" && "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]]; then
            echo "scan_status=skipped_fork_pr" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Snyk for a pull request from a fork."
          else
            echo "scan_status=eligible" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.eligibility.outputs.scan_status != 'skipped_fork_pr'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download image built by CI
        if: steps.eligibility.outputs.scan_status != 'skipped_fork_pr' && inputs.image_artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.image_artifact }}
          path: ${{ runner.temp }}/snyk-image

      - name: Load image built by CI
        if: steps.eligibility.outputs.scan_status != 'skipped_fork_pr' && inputs.image_artifact != ''
        env:
          IMAGE_URI: ${{ inputs.image_uri }}
          IMAGE_TAR: ${{ runner.temp }}/snyk-image/image.tar
        run: |
          set -euo pipefail
          docker load --input "$IMAGE_TAR"
          docker image inspect "$IMAGE_URI" >/dev/null

      - name: Pull public image
        if: steps.eligibility.outputs.scan_status != 'skipped_fork_pr' && inputs.image_artifact == '' && !inputs.build_image && inputs.image_source == 'public'
        env:
          IMAGE_URI: ${{ inputs.image_uri }}
        run: docker pull "$IMAGE_URI"

      - name: Build image from repository Dockerfile
        if: steps.eligibility.outputs.scan_status != 'skipped_fork_pr' && inputs.image_artifact == '' && inputs.build_image
        env:
          IMAGE_URI: ${{ inputs.image_uri }}
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: docker build --file "$DOCKERFILE" --tag "$IMAGE_URI" .

      - name: Record scanned image identity
        id: image-identity
        if: steps.eligibility.outputs.scan_status != 'skipped_fork_pr'
        env:
          COMPONENT: ${{ inputs.component }}
          IMAGE_URI: ${{ inputs.image_uri }}
          METADATA_PATH: ${{ runner.temp }}/snyk-container-${{ inputs.component }}-metadata.json
        run: |
          set -euo pipefail
          inspect="$(docker image inspect "$IMAGE_URI")"
          jq -n \
            --arg component "$COMPONENT" \
            --arg image_ref "$IMAGE_URI" \
            --arg commit "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg scanned_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson inspect "$inspect" \
            '{
              component: $component,
              image_ref: $image_ref,
              image_id: $inspect[0].Id,
              repo_tags: ($inspect[0].RepoTags // []),
              repo_digests: ($inspect[0].RepoDigests // []),
              platform: (($inspect[0].Os // "unknown") + "/" + ($inspect[0].Architecture // "unknown")),
              commit: $commit,
              run_id: $run_id,
              scanned_at: $scanned_at
            }' > "$METADATA_PATH"
          echo "metadata_path=$METADATA_PATH" >> "$GITHUB_OUTPUT"

      - name: Check for Snyk token
        id: token-check
        if: steps.eligibility.outputs.scan_status != 'skipped_fork_pr'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [[ -n "$SNYK_TOKEN" ]]; then
            echo "::notice::SNYK_TOKEN is configured; running the scan."
          else
            echo "scan_status=skipped_no_token" >> "$GITHUB_OUTPUT"
            echo "::error::SNYK_TOKEN is not configured; eligible Snyk scans cannot run. Configure the repository or organization secret."
            echo "## Snyk Container Scan" >> "$GITHUB_STEP_SUMMARY"
            echo "The Snyk scan was not run because the required \`SNYK_TOKEN\` secret is not configured. This job is failing so the missing scan is visible." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Install Snyk CLI
        id: snyk-setup
        if: steps.eligibility.outputs.scan_status != 'skipped_fork_pr' && steps.token-check.outputs.scan_status != 'skipped_no_token'
        uses: snyk/actions/setup@11b673cfb4b0dc0d860a1323caa199d54950dcce
        with:
          snyk-version: v1.1308.1

      - name: Record Snyk setup error
        id: setup-error
        if: always() && steps.eligibility.outputs.scan_status != 'skipped_fork_pr' && steps.token-check.outputs.scan_status != 'skipped_no_token' && steps.snyk-setup.outcome != 'success'
        run: |
          echo "scan_status=scanner_error" >> "$GITHUB_OUTPUT"
          echo "::error::Snyk CLI setup failed; the scan could not run."
          echo "## Snyk Container Scan" >> "$GITHUB_STEP_SUMMARY"
          echo "Snyk CLI setup failed. This release scan is report-only and did not block the release." >> "$GITHUB_STEP_SUMMARY"

      - name: Scan image with Snyk
        id: snyk
        if: steps.eligibility.outputs.scan_status != 'skipped_fork_pr' && steps.token-check.outputs.scan_status != 'skipped_no_token'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          IMAGE_URI: ${{ inputs.image_uri }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          REPORT_PATH: ${{ runner.temp }}/snyk-container-${{ inputs.component }}.json
        run: |
          set +e
          args=(container test "$IMAGE_URI")
          if [[ -n "$DOCKERFILE" ]]; then
            args+=("--file=$DOCKERFILE")
          fi
          args+=("--json-file-output=$REPORT_PATH")
          snyk "${args[@]}"
          status=$?
          set -e

          if [[ "$status" -eq 0 ]]; then
            echo "scan_result=no_vulnerabilities" >> "$GITHUB_OUTPUT"
          elif [[ "$status" -eq 1 ]]; then
            echo "scan_result=vulnerabilities_found" >> "$GITHUB_OUTPUT"
          else
            echo "scan_result=scanner_error" >> "$GITHUB_OUTPUT"
          fi

          if [[ "$status" -eq 0 || "$status" -eq 1 ]]; then
            if [[ ! -s "$REPORT_PATH" ]] || ! jq -e 'type == "object"' "$REPORT_PATH" >/dev/null; then
              echo "::error::Snyk completed without producing a valid JSON report."
              echo "scan_result=report_error" >> "$GITHUB_OUTPUT"
              exit 2
            fi
          fi

          if [[ "$status" -eq 1 ]]; then
            echo "::warning::Snyk found vulnerabilities in ${IMAGE_URI}; this initial integration reports findings without gating on them."
            exit 0
          fi
          if [[ "$status" -ne 0 ]]; then
            echo "::error::Snyk scan failed with exit code ${status}."
            exit "$status"
          fi

      - name: Add scan result to image metadata and job summary
        if: always() && steps.eligibility.outputs.scan_status != 'skipped_fork_pr' && steps.image-identity.outcome == 'success'
        env:
          IMAGE_URI: ${{ inputs.image_uri }}
          METADATA_PATH: ${{ steps.image-identity.outputs.metadata_path }}
          REPORT_NAME: snyk-container-${{ inputs.component }}.json
          ARTIFACT_NAME: snyk-container-${{ inputs.component }}-${{ github.run_id }}
          SCAN_RESULT: ${{ steps.snyk.outputs.scan_result || steps.token-check.outputs.scan_status || 'not_run' }}
          SCAN_STEP_OUTCOME: ${{ steps.snyk.outcome || 'not_run' }}
        run: |
          set -euo pipefail
          temporary_path="${METADATA_PATH}.tmp"
          jq \
            --arg scan_result "$SCAN_RESULT" \
            --arg scan_step_outcome "$SCAN_STEP_OUTCOME" \
            --arg report_file "$REPORT_NAME" \
            --arg artifact_name "$ARTIFACT_NAME" \
            '. + {snyk: {result: $scan_result, step_outcome: $scan_step_outcome, report_file: (if $scan_result == "skipped_no_token" then null else $report_file end), artifact_name: $artifact_name}}' \
            "$METADATA_PATH" > "$temporary_path"
          mv "$temporary_path" "$METADATA_PATH"

          echo "## Snyk Container Scan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image reference: \`$IMAGE_URI\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image ID: \`$(jq -r '.image_id' "$METADATA_PATH")\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Registry digest(s): \`$(jq -r '(.repo_digests // []) | if length == 0 then "not available for this image artifact" else join(", ") end' "$METADATA_PATH")\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Snyk result: **$SCAN_RESULT**" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$SCAN_RESULT" == "skipped_no_token" ]]; then
            echo "- Downloadable metadata artifact: \`$ARTIFACT_NAME\` (no scan report; token not configured)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Downloadable report artifact: \`$ARTIFACT_NAME\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate JSON files before upload
        if: always() && steps.eligibility.outputs.scan_status != 'skipped_fork_pr' && steps.image-identity.outcome == 'success'
        env:
          REPORT_PATH: ${{ runner.temp }}/snyk-container-${{ inputs.component }}.json
          METADATA_PATH: ${{ steps.image-identity.outputs.metadata_path }}
          SCAN_RESULT: ${{ steps.snyk.outputs.scan_result || steps.token-check.outputs.scan_status || 'not_run' }}
        run: |
          python3 .github/scripts/validate_snyk_artifact.py

      - name: Upload Snyk JSON report
        if: always() && steps.eligibility.outputs.scan_status != 'skipped_fork_pr' && steps.image-identity.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snyk-container-${{ inputs.component }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/snyk-container-${{ inputs.component }}.json
            ${{ runner.temp }}/snyk-container-${{ inputs.component }}-metadata.json
          if-no-files-found: error
          retention-days: 30
