name: m8flow-designer CI/CD
# =============================================================================
# Triggers:
#   PR to main / next-gen        → CI only (test, build, SAST, Trivy, image build)
#   Push to main                 → CI, then publishes the image as sha-<commit>
#                                  (the only build of that commit; built once)
#   Push to next-gen             → CI only (the image is built, not published)
#   release.yaml                 → retags existing images (sha-<commit> → X.Y.Z-rc
#                                  → X.Y.Z); builds only an image that is missing
#   workflow_dispatch            → CD only (deploy a published image to dev, qa or demo)
#
# The push paths below are also what release.yaml reads to find which commit's
# image a release ships, so they must list every file the image is built from.
# =============================================================================

on:
  push:
    branches:
      - main
      - refactor/next-gen
    paths:
      - "m8flow-designer/**"
      - "m8flow-bpmn/**"
      - "docker/m8flow.designer.Dockerfile"
      - "docker/m8flow-designer-nginx.conf.template"
      - ".github/workflows/designer-cicd.yaml"

  pull_request:
    branches:
      - main
      - refactor/next-gen
    paths:
      - "m8flow-designer/**"
      - "m8flow-bpmn/**"
      - "docker/m8flow.designer.Dockerfile"
      - "docker/m8flow-designer-nginx.conf.template"
      - ".github/workflows/designer-cicd.yaml"

  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to deploy to"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - qa
          - demo
      image_uri:
        description: "Published image URI to deploy (e.g. docker.io/m8flow/m8flow-designer:sha-<commit> or :2.0.0)"
        required: true
        type: string
      dry_run:
        description: "Validate the deploy against the cluster without changing anything"
        required: false
        default: false
        type: boolean

# Least privilege, but constrained by what GitHub validates. `contents: write`
# is required even though nothing here writes contents: ci-orchestrator has a
# nested `auto-merge` job declaring it, and GitHub validates every job in the
# call graph at startup -- including ones that never run (auto_merge is false
# here). Dropping it fails the run before any job starts. `actions` is genuinely
# only ever read, so it stays at read.
permissions:
  contents: write
  actions: read
  security-events: write
  packages: write
  pull-requests: write
  id-token: write
  deployments: write

concurrency:
  group: designer-cicd-${{ github.event.inputs.environment || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Designer CI Pipeline
    if: github.event_name != 'workflow_dispatch'
    uses: AOT-Technologies/devx-reusable-workflows/.github/workflows/ci-orchestrator.yaml@8c34de8ae4f1df16c8bfa0ba484a33982d29a4ed # v1.4.0
    with:
      config_path: m8flow-designer/devx-ci.yaml
      auto_merge: false
      # Build once: a merge to main publishes its image as sha-<commit>, and
      # every deploy and release reuses that image by digest. Pull requests
      # and other branches build and discard. Main only, because the Docker
      # Hub OIDC connection trusts main only.
      push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      image_tag: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('sha-{0}', github.sha) || '' }}
    secrets:
      sonar_token: ${{ secrets.SONAR_TOKEN }}
      GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}

  # Stops a deploy before it touches the cluster when image_uri is not this
  # component's image, or does not exist on Docker Hub.
  verify-image:
    name: Verify Deploy Image
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/verify-image.yml
    with:
      image_uri: ${{ github.event.inputs.image_uri }}
      config_path: m8flow-designer/devx-ci.yaml

  cd-dev:
    name: Deploy Designer → DEV
    needs: verify-image
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev'
    uses: AOT-Technologies/devx-reusable-workflows/.github/workflows/cd-orchestrator.yaml@8c34de8ae4f1df16c8bfa0ba484a33982d29a4ed # v1.4.0
    with:
      environment: dev
      image_uri: ${{ github.event.inputs.image_uri }}
      config_path: m8flow-designer/devx-config.yaml
      dry_run: ${{ github.event.inputs.dry_run == 'true' }}
    # Explicit, not `inherit`: inherit only reaches reusable workflows in the
    # same organization (a fork's deploy got no secrets), and it would hand
    # every repository secret to the deploy. The deploy needs only this one.
    secrets:
      GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}

  cd-qa:
    name: Deploy Designer → QA
    needs: verify-image
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'qa'
    uses: AOT-Technologies/devx-reusable-workflows/.github/workflows/cd-orchestrator.yaml@8c34de8ae4f1df16c8bfa0ba484a33982d29a4ed # v1.4.0
    with:
      environment: qa
      image_uri: ${{ github.event.inputs.image_uri }}
      config_path: m8flow-designer/devx-config.yaml
      dry_run: ${{ github.event.inputs.dry_run == 'true' }}
    # Explicit, not `inherit`: inherit only reaches reusable workflows in the
    # same organization (a fork's deploy got no secrets), and it would hand
    # every repository secret to the deploy. The deploy needs only this one.
    secrets:
      GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}

  cd-demo:
    name: Deploy Designer → DEMO
    needs: verify-image
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'demo'
    uses: AOT-Technologies/devx-reusable-workflows/.github/workflows/cd-orchestrator.yaml@8c34de8ae4f1df16c8bfa0ba484a33982d29a4ed # v1.4.0
    with:
      environment: demo
      image_uri: ${{ github.event.inputs.image_uri }}
      config_path: m8flow-designer/devx-config.yaml
      dry_run: ${{ github.event.inputs.dry_run == 'true' }}
    # Explicit, not `inherit`: inherit only reaches reusable workflows in the
    # same organization (a fork's deploy got no secrets), and it would hand
    # every repository secret to the deploy. The deploy needs only this one.
    secrets:
      GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
