# Creates the GitHub Release for a GA tag, after release.yaml (channel ga) has
# verified the signed tag and published the images.
#
# Actions → "GitHub Release" → Run workflow, with the version (X.Y.Z). The
# release is created as a draft so a maintainer can review the notes before
# publishing it; see docs/how-to/release-and-roll-back.md.
#
# Assets: release notes from CHANGELOG.md, a source archive, CycloneDX SBOMs for
# the backend and the designer, the dependency license inventory, SHA256SUMS,
# a keyless Sigstore signature of SHA256SUMS, and build-provenance attestations
# for every asset (verify with `gh attestation verify`).
name: GitHub Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, X.Y.Z (the signed GA tag)"
        required: true
        type: string

# Read-only by default. Only the publish job, which runs no third-party build
# tools, gets the write and OIDC permissions.
permissions:
  contents: read

env:
  CYCLONEDX_BOM_VERSION: "4.6.1"
  CYCLONEDX_NPM_VERSION: "4.0.3"

jobs:
  # Runs the registry-fetched tools (cyclonedx, npm ci, the license checker)
  # with a read-only token, and hands dist/ to the publish job as an artifact.
  build:
    name: Build Release Assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not an X.Y.Z version. Release candidates (X.Y.Z-rc) don't get a GitHub Release."
            exit 1
          fi
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ inputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record the tagged commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify the tag is signed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ref=$(gh api "repos/$REPO/git/ref/tags/$RELEASE_VERSION")
          [[ "$(jq -r .object.type <<<"$ref")" == "tag" ]] || { echo "::error::$RELEASE_VERSION is not an annotated tag."; exit 1; }
          verified=$(gh api "repos/$REPO/git/tags/$(jq -r .object.sha <<<"$ref")" --jq .verification.verified)
          [[ "$verified" == "true" ]] || { echo "::error::$RELEASE_VERSION is not a verified signed tag."; exit 1; }

      - name: Component versions match the tag
        run: python3 bin/release/set-version.py --check "$RELEASE_VERSION"

      - name: Extract release notes from CHANGELOG.md
        shell: python
        run: |
          import os
          import pathlib
          import re
          import sys

          version = os.environ["RELEASE_VERSION"]
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = re.compile(rf"^## \[{re.escape(version)}\] - \d{{4}}-\d{{2}}-\d{{2}}\s*$", re.MULTILINE)
          match = heading.search(changelog)
          if not match:
              sys.exit(f"CHANGELOG.md has no dated '## [{version}] - YYYY-MM-DD' section.")
          following = re.search(r"^## \[", changelog[match.end():], re.MULTILINE)
          end = match.end() + following.start() if following else len(changelog)
          notes = changelog[match.end():end].strip()
          if not notes:
              sys.exit(f"The [{version}] section of CHANGELOG.md is empty.")
          if not re.search(rf"^\[{re.escape(version)}\]: \S+", changelog, re.MULTILINE):
              sys.exit(f"CHANGELOG.md is missing the [{version}] link reference.")
          pathlib.Path("notes").mkdir(exist_ok=True)
          pathlib.Path("notes/release-notes.md").write_text(notes + "\n", encoding="utf-8")
          print(f"Release notes ready for {version}")

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Build release assets
        run: |
          set -euo pipefail
          mkdir -p dist
          name="m8flow-${RELEASE_VERSION}"

          git archive --format=tar.gz --prefix="${name}/" -o "dist/${name}-source.tar.gz" "refs/tags/${RELEASE_VERSION}"

          (cd m8flow-backend && uv export --frozen --no-dev --no-hashes --no-emit-project \
            --no-emit-package m8flow-bpmn-core --no-emit-package m8flow-telemetry) \
            | grep -vE '^(-e |\.|/)' > "${RUNNER_TEMP}/backend-requirements.txt"
          uvx --from "cyclonedx-bom==${CYCLONEDX_BOM_VERSION}" cyclonedx-py requirements \
            "${RUNNER_TEMP}/backend-requirements.txt" -o "dist/${name}-backend.cdx.json"

          (cd m8flow-bpmn && npm ci --ignore-scripts --no-audit --no-fund)
          (cd m8flow-designer && npm ci --ignore-scripts --no-audit --no-fund)

          # `npm sbom` rejects the git-pinned bpmn-js-spiffworkflow dependency
          # (ESBOMPROBLEMS); cyclonedx-npm reports it and carries on.
          (cd m8flow-designer && npx --yes "@cyclonedx/cyclonedx-npm@${CYCLONEDX_NPM_VERSION}" \
            --omit dev --ignore-npm-errors --output-format JSON \
            --output-file "../dist/${name}-designer.cdx.json")

          python3 bin/compliance/dependency_licenses.py --write --check
          cp DEPENDENCIES.md "dist/${name}-DEPENDENCIES.md"

          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS

      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: release-assets
          path: |
            dist/
            notes/
          if-no-files-found: error
          retention-days: 7

  # Holds the write and OIDC permissions, and only attests, signs, and creates
  # the draft release from the assets the build job produced.
  publish:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      COMMIT: ${{ needs.build.outputs.commit }}
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-assets

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign checksums (keyless Sigstore)
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${RELEASE_VERSION}" \
            --verify-tag \
            --draft \
            --title "m8flow ${RELEASE_VERSION}" \
            --notes-file notes/release-notes.md \
            dist/*

      - name: Summary
        run: |
          {
            echo "### GitHub Release ${RELEASE_VERSION} (draft)"
            echo ""
            echo "Commit: \`${COMMIT}\`"
            echo ""
            echo "Review the notes, then publish the draft with **Set as the latest release** checked."
            echo ""
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
