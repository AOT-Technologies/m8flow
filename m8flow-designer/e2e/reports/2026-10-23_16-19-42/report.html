ocessModel);\n  200 |   });\n  201 |   test.afterAll(async ({ browser }) => {\n  202 |     await withEditorPage(browser, removeMockProcessModel);\n  203 |   });\n  204 | }\n  205 | \n  206 | export type ActiveCatalogModel = {\n  207 |   id: string;\n  208 |   name: string;\n  209 |   status: MockModelStatus;\n  210 |   /** Upload the mock user-task BPMN + form files and set the BPMN as primary. */\n  211 |   files: boolean;\n  212 |   /** Start one process instance (the model must be published). */\n  213 |   instance: boolean;\n  214 | };\n  215 | \n  216 | /** Everything a spec creates on top of the catalog, so afterAll can remove it. */\n  217 | export type ActiveCatalogTracker = {\n  218 |   instances: number[];\n  219 |   models: string[];\n  220 |   groups: string[];\n  221 |   templates: number[];\n  222 | };\n  223 | \n  224 | /**\n  225 |  * A tenant with data: call once at the top of a spec file. Before the file's\n  226 |  * tests it creates one mock group with the given models (status, files and an\n  227 |  * optional running instance); after them it removes those models, anything\n  228 |  * recorded in the returned tracker, and the group.\n  229 |  */\n  230 | export function useActiveCatalog(\n  231 |   // eslint-disable-next-line @typescript-eslint/no-explicit-any\n  232 |   test: TestType\u003cany, any>,\n  233 |   group: { id: string; name: string },\n  234 |   models: ActiveCatalogModel[],\n  235 | ): ActiveCatalogTracker {\n  236 |   const tracker: ActiveCatalogTracker = { instances: [], models: [], groups: [], templates: [] };\n  237 |   const route = (m: { id: string }) => `${group.id}:${m.id}`;\n  238 | \n  239 |   test.beforeAll(async ({ browser }) => {\n  240 |     test.setTimeout(240_000);\n  241 |     await withEditorPage(browser, async (page) => {\n  242 |       await createMockGroup(page, { id: group.id, display_name: group.name });\n  243 |       for (const m of models) {\n  244 |         await createMockModel(page, { group_id: group.id, id: m.id, display_name: m.name });\n  245 |         if (m.files) await seedMockModelFiles(page, route(m));\n  246 |         if (m.status !== 'draft') await setModelStatus(page, route(m), 'published');\n  247 |         if (m.status === 'paused') await setModelStatus(page, route(m), 'paused');\n  248 |         if (m.instance) tracker.instances.push(await startMockInstance(page, route(m)));\n  249 |       }\n  250 |     });\n  251 |   });\n  252 | \n  253 |   test.afterAll(async ({ browser }) => {\n  254 |     test.setTimeout(240_000);\n  255 |     await withEditorPage(browser, async (page) => {\n  256 |       const routes = [...models.map(route), ...tracker.models];\n  257 |       // 1. Instances the tests started (tracked by id, whatever model they belong to).\n  258 |       await deleteInstanceIds(page, tracker.instances);\n  259 |       // 2. Per model: any instance still listed on it, then the model itself.\n  260 |       for (const r of routes) {\n  261 |         await deleteMockInstances(page, r);\n  262 |         await deleteMockModel(page, r);\n  263 |       }\n  264 |       for (const id of tracker.templates) await deleteMockTemplate(page, id);\n  265 |       for (const g of [...tracker.groups, group.id]) await deleteMockGroup(page, g);\n  266 |     });\n  267 |   });\n  268 | \n  269 |   return tracker;\n  270 | }\n  271 | \n```"}]}]};
const runs = (DATA && DATA.runs) || [];
const single = Boolean(DATA && DATA.single);
const app = document.getElementById('app');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDur = (ms) => ms >= 60000 ? `${Math.floor(ms / 60000)}m ${Math.round((ms % 60000) / 1000)}s` : ms >= 1000 ? `${(ms / 1000).toFixed(1)}s` : `${ms}ms`;
const fmtDate = (iso, id) => iso ? new Date(iso).toLocaleString() : id;
const rate = (r) => r.total - r.skipped ? Math.round(((r.passed + r.flaky) / (r.total - r.skipped)) * 1000) / 10 : 0;
const state = { run: runs.length - 1, filter: 'all', q: '', open: null };

if (single) {
  document.getElementById('runPicker').hidden = true;
  document.getElementById('title').textContent = `M8Flow Designer — E2E Run Report`;
  document.title = `E2E Run ${runs[0]?.id ?? ''}`;
  document.getElementById('generated').textContent = runs[0] ? `Run ${runs[0].id} · started ${fmtDate(runs[0].startTime, runs[0].id)}` : '';
} else {
  document.getElementById('generated').textContent = DATA ? `Dashboard built ${new Date(DATA.generatedAt).toLocaleString()} · ${runs.length} run(s) saved` : '';
}
const sel = document.getElementById('runSelect');
sel.innerHTML = runs.map((r, i) => `<option value="${i}">${esc(fmtDate(r.startTime, r.id))} — ${r.failed ? r.failed + ' failed' : 'all passed'}</option>`).reverse().join('');
sel.value = String(state.run);
sel.onchange = () => { state.run = Number(sel.value); state.open = null; render(); };

function kpis(r) {
  const pct = (n) => r.total ? (n / r.total) * 100 : 0;
  return `<section class="kpis">
    <div class="kpi"><div class="l">Total tests</div><div class="v">${r.total}</div></div>
    <div class="kpi pass"><div class="l">Passed</div><div class="v">${r.passed}</div></div>
    <div class="kpi fail"><div class="l">Failed</div><div class="v">${r.failed}</div></div>
    <div class="kpi flaky"><div class="l">Flaky</div><div class="v">${r.flaky}</div></div>
    <div class="kpi skip"><div class="l">Skipped</div><div class="v">${r.skipped}</div></div>
    <div class="kpi"><div class="l">Pass rate</div><div class="v">${rate(r)}%</div></div>
    <div class="kpi"><div class="l">Duration</div><div class="v">${fmtDur(r.duration)}</div></div>
  </section>
  <div class="panel">
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px">
      <div><strong>Run ${esc(r.id)}</strong> <span class="sub">· started ${esc(fmtDate(r.startTime, r.id))}</span></div>
      ${r.report ? `<a href="${esc(r.report)}" target="_blank">Open this run's report →</a>` : ''}
    </div>
    <div class="bar">
      <span style="width:${pct(r.passed)}%;background:var(--pass)"></span>
      <span style="width:${pct(r.flaky)}%;background:var(--flaky)"></span>
      <span style="width:${pct(r.failed)}%;background:var(--fail)"></span>
      <span style="width:${pct(r.skipped)}%;background:var(--skip)"></span>
    </div>
    ${r.globalErrors.length ? `<pre class="err">${esc(r.globalErrors.join('\n\n'))}</pre>` : ''}
  </div>`;
}

function trend() {
  const shown = runs.slice(-30);
  const offset = runs.length - shown.length;
  const W = 760, H = 200, x0 = 36, y0 = 14, bottom = 170;
  const max = Math.max(1, ...shown.map((r) => r.total));
  const band = (W - x0 - 8) / Math.max(shown.length, 1);
  const bw = Math.min(28, band * 0.7);
  const y = (v) => bottom - (v / max) * (bottom - y0);
  const bars = shown.map((r, i) => {
    const idx = offset + i, cx = x0 + i * band + (band - bw) / 2;
    let acc = 0;
    const seg = (n, color) => { if (!n) return ''; const top = y(acc + n), h = y(acc) - top; acc += n; return `<rect x="${cx}" y="${top}" width="${bw}" height="${h}" fill="${color}"/>`; };
    return `<g style="cursor:pointer" onclick="selectRun(${idx})" opacity="${idx === state.run ? 1 : 0.55}">
      <title>${esc(fmtDate(r.startTime, r.id))}\n${r.passed} passed · ${r.failed} failed · ${r.flaky} flaky · ${r.skipped} skipped · ${rate(r)}% pass rate</title>
      ${seg(r.passed, 'var(--pass)')}${seg(r.flaky, 'var(--flaky)')}${seg(r.failed, 'var(--fail)')}${seg(r.skipped, 'var(--skip)')}
      ${idx === state.run ? `<rect x="${cx - 2}" y="${y(r.total) - 2}" width="${bw + 4}" height="${bottom - y(r.total) + 4}" fill="none" stroke="var(--accent)" stroke-width="1.5" rx="2"/>` : ''}
      ${shown.length <= 15 || i % Math.ceil(shown.length / 10) === 0 ? `<text x="${cx + bw / 2}" y="${bottom + 16}" text-anchor="middle">${esc(r.id.slice(5, 10))}</text>` : ''}
    </g>`;
  }).join('');
  return `<section class="panel"><h2>Trend — last ${shown.length} run(s)</h2>
    <div class="scroll"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Test results per run">
      <line x1="${x0}" x2="${W - 8}" y1="${bottom}" y2="${bottom}" stroke="var(--line)"/>
      <text x="${x0 - 6}" y="${y(max) + 4}" text-anchor="end">${max}</text><text x="${x0 - 6}" y="${bottom + 4}" text-anchor="end">0</text>
      ${bars}
    </svg></div>
    <div class="legend"><span><i style="background:var(--pass)"></i>Passed</span><span><i style="background:var(--flaky)"></i>Flaky</span><span><i style="background:var(--fail)"></i>Failed</span><span><i style="background:var(--skip)"></i>Skipped</span><span>Click a bar to open that run</span></div>
  </section>`;
}

function bySpec(r) {
  const files = new Map();
  for (const t of r.tests) {
    const f = files.get(t.file) || { file: t.file, total: 0, passed: 0, failed: 0, flaky: 0, skipped: 0, duration: 0 };
    f.total++; f[t.status]++; f.duration += t.duration; files.set(t.file, f);
  }
  const rows = [...files.values()].sort((a, b) => b.failed - a.failed || a.file.localeCompare(b.file));
  return `<section class="panel"><h2>By spec file</h2><div class="scroll"><table>
    <tr><th>Spec file</th><th class="num">Tests</th><th class="num">Passed</th><th class="num">Failed</th><th class="num">Flaky</th><th class="num">Skipped</th><th class="num">Duration</th></tr>
    ${rows.map((f) => `<tr><td class="file">${esc(f.file)}</td><td class="num">${f.total}</td><td class="num">${f.passed}</td>
      <td class="num" style="${f.failed ? 'color:var(--fail);font-weight:600' : ''}">${f.failed}</td><td class="num">${f.flaky}</td><td class="num">${f.skipped}</td><td class="num">${fmtDur(f.duration)}</td></tr>`).join('')}
  </table></div></section>`;
}

function testDetail(r, t) {
  return `<tr class="detail"><td colspan="6">
    <div class="sub">${esc(t.file)}:${t.line}${t.suite ? ' · ' + esc(t.suite) : ''} · ${esc(t.project)}${t.retries ? ` · ${t.retries} retr${t.retries > 1 ? 'ies' : 'y'}` : ''}${t.location ? ` · failed at ${esc(t.location)}` : ''}</div>
    ${t.error ? `<h2 style="margin-top:12px">Error</h2><pre class="err">${esc(t.error)}</pre>` : ''}
    ${t.stack && t.stack !== t.error ? `<details><summary class="sub">Stack trace</summary><pre>${esc(t.stack)}</pre></details>` : ''}
    ${t.screenshots.length ? `<h2 style="margin-top:12px">Screenshot at failure</h2><div class="shots">${t.screenshots.map((s) => `<a href="${esc(s)}" target="_blank"><img src="${esc(s)}" alt="Screenshot of ${esc(t.title)}" loading="lazy"></a>`).join('')}</div>` : ''}
    ${t.errorContext ? `<details><summary class="sub">Page snapshot at failure (what was on screen, as text)</summary><pre>${esc(t.errorContext)}</pre></details>` : ''}
    ${!t.error && !t.screenshots.length ? '<div class="sub" style="margin-top:8px">No error — screenshots are saved for failed tests only.</div>' : ''}
  </td></tr>`;
}

function tests(r) {
  const order = { failed: 0, flaky: 1, passed: 2, skipped: 3 };
  const q = state.q.toLowerCase();
  const list = r.tests
    .filter((t) => state.filter === 'all' || t.status === state.filter)
    .filter((t) => !q || `${t.caseId} ${t.title} ${t.file} ${t.error}`.toLowerCase().includes(q))
    .sort((a, b) => order[a.status] - order[b.status] || a.file.localeCompare(b.file) || a.line - b.line);
  const btn = (f, label, n) => `<button class="${state.filter === f ? 'on' : ''}" onclick="setFilter('${f}')">${label} (${n})</button>`;
  return `<section class="panel"><h2>Test cases</h2>
    <div class="toolbar">
      ${btn('all', 'All', r.total)}${btn('failed', 'Failed', r.failed)}${btn('flaky', 'Flaky', r.flaky)}${btn('passed', 'Passed', r.passed)}${btn('skipped', 'Skipped', r.skipped)}
      <input type="search" id="q" placeholder="Search ID, title, file or error" value="${esc(state.q)}">
    </div>
    <div class="scroll"><table>
      <tr><th>Status</th><th>ID</th><th>Test case</th><th>Spec</th><th class="num">Duration</th><th class="num">Retries</th></tr>
      ${list.length ? list.map((t) => `<tr class="test ${state.open === t.id ? 'sel' : ''}" onclick="toggle('${esc(t.id)}')">
          <td><span class="pill ${t.status}">${t.status}</span></td><td class="id">${esc(t.caseId) || '—'}</td>
          <td>${esc(t.title)}${t.error ? `<div class="sub" style="color:var(--fail)">${esc(t.error.split('\n')[0].slice(0, 140))}</div>` : ''}</td>
          <td class="file">${esc(t.file)}:${t.line}</td><td class="num">${fmtDur(t.duration)}</td><td class="num">${t.retries}</td></tr>
          ${state.open === t.id ? testDetail(r, t) : ''}`).join('')
        : '<tr><td colspan="6" class="empty">No tests match.</td></tr>'}
    </table></div></section>`;
}

function history() {
  return `<section class="panel"><h2>Run history</h2><div class="scroll"><table>
    <tr><th>Run</th><th>Started</th><th class="num">Duration</th><th class="num">Total</th><th class="num">Passed</th><th class="num">Failed</th><th class="num">Flaky</th><th class="num">Skipped</th><th class="num">Pass rate</th><th>Report</th></tr>
    ${runs.map((r, i) => `<tr class="${i === state.run ? 'sel' : ''}">
      <td><a href="#" onclick="selectRun(${i});return false" class="id">${esc(r.id)}</a></td><td>${esc(fmtDate(r.startTime, r.id))}</td>
      <td class="num">${fmtDur(r.duration)}</td><td class="num">${r.total}</td><td class="num">${r.passed}</td>
      <td class="num" style="${r.failed ? 'color:var(--fail);font-weight:600' : ''}">${r.failed}</td><td class="num">${r.flaky}</td><td class="num">${r.skipped}</td>
      <td class="num">${rate(r)}%</td><td>${r.report ? `<a href="${esc(r.report)}" target="_blank">Run report</a>` : ''}</td></tr>`).reverse().join('')}
  </table></div></section>`;
}

function render() {
  if (!runs.length) { app.innerHTML = '<div class="panel empty">No runs saved yet. Run <code>npm run test:e2e</code>.</div>'; return; }
  const r = runs[state.run];
  sel.value = String(state.run);
  app.innerHTML = single ? kpis(r) + tests(r) + bySpec(r) : kpis(r) + trend() + tests(r) + bySpec(r) + history();
  const q = document.getElementById('q');
  q.oninput = () => { state.q = q.value; const pos = q.selectionStart; render(); const n = document.getElementById('q'); n.focus(); n.setSelectionRange(pos, pos); };
}
window.selectRun = (i) => { state.run = i; state.open = null; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
window.setFilter = (f) => { state.filter = f; render(); };
window.toggle = (id) => { state.open = state.open === id ? null : id; render(); };
if (runs.length && runs[state.run].failed) state.filter = 'failed';
render();
</script>
</body>
</html>
