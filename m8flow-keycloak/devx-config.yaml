# DevX CD Configuration — m8flow-keycloak
# EKS Helm deployment for dev, demo, and qa environments.
# Helm release: m8flow-iam | Chart: m8flow-charts/charts/m8flow-iam

deployment:
  enabled: true
  target: eks

  environments:
    dev:
      enabled: true
      region: ca-central-1
      cluster_name: m8flow-eks
      namespace: dev
      deploy_method: helm
      helm:
        release_name: m8flow-iam
        chart_path: m8flow-charts/charts/m8flow-iam
        values_file: ""
      health_check:
        enabled: false
        type: k8s
      auto_rollback: false
      atomic: true
      notifications:
        enabled: true

    demo:
      enabled: true
      region: ca-central-1
      cluster_name: m8flow-eks
      namespace: demo
      deploy_method: helm
      helm:
        release_name: m8flow-iam
        chart_path: m8flow-charts/charts/m8flow-iam
        values_file: ""
      health_check:
        enabled: false
        type: k8s
      auto_rollback: false
      atomic: true
      notifications:
        enabled: true

    qa:
      enabled: true
      region: ca-central-1
      cluster_name: m8flow-eks
      namespace: qa
      deploy_method: helm
      helm:
        release_name: m8flow-iam
        chart_path: m8flow-charts/charts/m8flow-iam
        values_file: ""
      health_check:
        enabled: false
        type: k8s
      auto_rollback: false
      atomic: true
      notifications:
        enabled: true

aws:
  default_region: ca-central-1
  role_to_assume: arn:aws:iam::653405621825:role/m8flow-dev-cicd-deploy-role
