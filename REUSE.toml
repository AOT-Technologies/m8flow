version = 1
SPDX-PackageName = "m8flow"
SPDX-PackageSupplier = "AOT Technologies <opensource@aot-technologies.com>"
SPDX-PackageDownloadLocation = "https://github.com/AOT-Technologies/m8flow"

# Default for every file in the repository. A file that carries its own SPDX
# header keeps it ("closest"); every other file is AOT Technologies' work under
# Apache-2.0. Third-party files must get their own override annotation below.
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 AOT Technologies Inc."
SPDX-License-Identifier = "Apache-2.0"

# Lockfiles are generated by uv, Poetry, and npm and hold no creative content.
[[annotations]]
path = ["**/uv.lock", "uv.lock", "**/poetry.lock", "**/package-lock.json"]
precedence = "override"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

# Poppins, by the Indian Type Foundry (https://github.com/itfoundry/Poppins).
[[annotations]]
path = [
  "m8flow-backend/keycloak/themes/m8flow/login/resources/fonts/Poppins-*.woff2",
  "m8flow-designer/src/assets/fonts/Poppins-*.woff2",
]
precedence = "override"
SPDX-FileCopyrightText = "2020 The Poppins Project Authors"
SPDX-License-Identifier = "OFL-1.1"

# JetBrains Mono (https://github.com/JetBrains/JetBrainsMono).
[[annotations]]
path = "m8flow-designer/src/assets/fonts/JetBrainsMono.woff2"
precedence = "override"
SPDX-FileCopyrightText = "2020 The JetBrains Mono Project Authors"
SPDX-License-Identifier = "OFL-1.1"

