# DevX CD Configuration — m8flow-iam (Keycloak)
# EKS Helm deployment for dev, demo, and qa environments.
# Helm release: m8flow-iam | Chart: m8flow-charts/charts/m8flow-iam

deployment:
  enabled: true
  target: eks
  method: patch                      # Use patch rollout for existing EKS deployments (matching formsflow pattern)

  environments:
    dev: &env_defaults
      enabled: true
      region: ca-central-1
      cluster_name: m8flow-eks
      namespace: dev
      deployment_name: m8flow-iam
      container_name: m8flow-iam
      workload_kind: statefulset   # m8flow-iam is a StatefulSet, not a Deployment
      helm:
        release_name: m8flow-iam
        chart_path: m8flow-charts/charts/m8flow-iam
        values_file: ""
      aws:
        role_to_assume: arn:aws:iam::653405621825:role/m8flow-dev-cicd-deploy-role
      # Checked after every deploy; a failure rolls back to the image that
      # ran before it.
      health_check:
        enabled: true
        type: http
        url: https://sandbox.m8flow.ai/realms/m8flow/.well-known/openid-configuration
        retries: 20
        retry_interval: 15
      auto_rollback: true
      atomic: true
      notifications:
        enabled: true

    demo:
      <<: *env_defaults
      # Not on refactor/next-gen yet: no health check or rollback.
      health_check:
        enabled: false
      auto_rollback: false
      namespace: demo
      aws:
        role_to_assume: arn:aws:iam::653405621825:role/m8flow-demo-cicd-deploy-role

    qa:
      <<: *env_defaults
      # Not on refactor/next-gen yet: no health check or rollback.
      health_check:
        enabled: false
      auto_rollback: false
      namespace: qa
      aws:
        role_to_assume: arn:aws:iam::653405621825:role/m8flow-qa-cicd-deploy-role

aws:
  default_region: ca-central-1
  role_to_assume: arn:aws:iam::653405621825:role/m8flow-dev-cicd-deploy-role
