# DevX CI Configuration — m8flow-keycloak
# Language: Maven (Java 17) — builds a Keycloak provider JAR then wraps it in a Keycloak image
# Dockerfile: docker/m8flow.keycloak.Dockerfile (Maven builder stage + Keycloak runtime)

project:
  language: maven
  version: "17"
  working_directory: "."            # Build context is repo root

build:
  enabled: false                    # Maven build happens inside Docker multi-stage; no Nexus upload
  run_tests: false

docker:
  enabled: true
  working_directory: "."            # Build context must be repo root (COPY keycloak-extensions/...)
  dockerfile: "docker/m8flow.keycloak.Dockerfile"
  image_name: "m8flow/m8flow-keycloak"
  image_tag: ""
  registry_type: generic          # Docker Hub (public m8flow/* repositories)
  registry_url: "docker.io"
  # Docker Hub login through OIDC (DevX >= 1.4.0): no stored password or
  # token. The connection (Docker Home -> m8flow -> OIDC connections) trusts
  # this repository on main; the ID is not a secret.
  registry_username: "m8flow"
  oidc_connection_id: "7af449ca-2b4c-4926-a5d1-82ea3a47eda3"
  platforms: "linux/amd64"


notifications:
  enabled: true

security:
  # Every scanner reports all severities in the run summary. "none" blocks on
  # nothing for now, so the existing findings can be fixed first; switch to
  # "critical,high" to fail builds on new critical/high findings.
  gate:
    fail_on: none

  sast:
    enabled: true
    # Both, on purpose. GitHub withholds secrets from fork pull requests,
    # so SonarQube cannot run on them -- and every PR here comes from a
    # fork. semgrep needs no token, so it covers PRs; SonarQube still runs
    # on push to main and releases. Requires devx >= v1.2.1.
    tool: "sonarqube,semgrep"
    # Semgrep rulesets (comma-separated). p/ci, the default, is a minimal
    # high-confidence set that found nothing here.
    ruleset: "p/default,p/java,p/secrets"
    scan_path: "keycloak-extensions"
    sonar_host_url: "https://sonarcloud.io"
    sonar_organization: "aot-technologies"
    sonar_project_key: "AOT-Technologies_m8flow-keycloak"
    fail_on_quality_gate: false

  iac:
    enabled: false

  trivy:
    enabled: true
    severity: CRITICAL,HIGH
    fail_on_vuln: false
    ignore_unfixed: true
    scanners: vuln,secret

  sbom:
    enabled: true
    format: cyclonedx-json

  sbom_scan:
    enabled: true
    severity: medium
