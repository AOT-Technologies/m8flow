[project]
name = "m8flow-mcp"
version = "0.1.0"
description = "MCP server for m8flow workflow management"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=0.3.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",  # For browser-compatible multipart file uploads
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-jose[cryptography]>=3.3.0",  # JWT validation (RS256)
    "python-multipart>=0.0.9",
    "uvicorn>=0.30.0",
    "starlette>=0.30.0",  # Used directly for health-check routes/responses
    "pybreaker>=1.0.0",  # Circuit breaker for M8flowAPIClient
    "tenacity>=8.0.0",  # Retry logic for M8flowAPIClient
    "m8flow-telemetry[asgi]",
]

[tool.uv.sources]
m8flow-telemetry = { path = "../m8flow-telemetry" }

[tool.hatch.metadata]
allow-direct-references = true

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff==0.15.20",  # pinned: keep in sync with .github/workflows/mcp-server-ci.yml lint job
    "mypy>=1.9",
    "pre-commit>=3.6",
    "types-python-jose>=3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["fastmcp.*", "jose.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
# Exclude manual test scripts (they're not pytest tests)
norecursedirs = ["tests/manual", ".git", ".tox", "dist", "build"]
addopts = [
    "--strict-markers",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "**/__pycache__/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
