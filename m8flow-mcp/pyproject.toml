[project]
name = "m8flow-mcp"
version = "2.0.0"
description = "MCP server for m8flow workflow management"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "AOT Technologies", email = "opensource@aot-technologies.com" }]
dependencies = [
    "fastmcp>=0.3.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30.0",
    "starlette>=0.30.0",  # Used directly for health-check routes/responses
    "pybreaker>=1.0.0",  # Circuit breaker for M8flowAPIClient
    "tenacity>=8.0.0",  # Retry logic for M8flowAPIClient
    "m8flow-telemetry[asgi]",
]

[project.urls]
Homepage = "https://github.com/AOT-Technologies/m8flow"
Documentation = "https://github.com/AOT-Technologies/m8flow/tree/main/docs"
Repository = "https://github.com/AOT-Technologies/m8flow"
Issues = "https://github.com/AOT-Technologies/m8flow/issues"
Changelog = "https://github.com/AOT-Technologies/m8flow/blob/main/CHANGELOG.md"

[tool.uv.sources]
m8flow-telemetry = { path = "../m8flow-telemetry" }

[tool.uv]
# Resolve only package versions published at least 7 days ago, so a malicious
# or broken release has time to be caught and yanked before it reaches the lock.
exclude-newer = "7 days"
# mcp comes in through fastmcp; 1.30.0 fixes GHSA-84m7-p3x7-pcfv.
constraint-dependencies = ["mcp>=1.30.0"]

[tool.hatch.metadata]
allow-direct-references = true

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff==0.15.20",  # pinned: keep in sync with .github/workflows/mcp-server-ci.yml lint job
    "mypy>=1.9",
    "pre-commit>=3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["fastmcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
# Exclude manual test scripts (they're not pytest tests)
norecursedirs = ["tests/manual", ".git", ".tox", "dist", "build"]
addopts = [
    "--strict-markers",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "**/__pycache__/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
