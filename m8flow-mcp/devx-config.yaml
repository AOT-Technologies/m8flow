# DevX CD Configuration — m8flow-mcp-server-service
# EKS Helm deployment for dev, demo, and qa environments.
# Helm release: m8flow-mcp-server-service | Chart: m8flow-charts/charts/m8flow-mcp-server-service

# Targets deployment/m8flow-mcp-server-service with the m8flow-mcp image, matching
# the documented manual update:
#   kubectl set image deployment/m8flow-mcp-server-service #     m8flow-mcp-server-service=<registry>/m8flow-mcp:<TAG> -n <ns>
#
# NOTE: m8flow-charts/charts/m8flow-mcp-server-service still pins
# image.repository to m8flow/mcp-server:latest, so the next helm upgrade of that
# chart will revert what this patches. The chart needs reconciling to m8flow-mcp.
deployment:
  enabled: true
  target: eks
  method: patch                      # Use patch rollout for existing EKS deployments (matching formsflow pattern)

  environments:
    dev: &env_defaults
      enabled: true
      region: ca-central-1
      cluster_name: m8flow-eks
      namespace: dev
      deployment_name: m8flow-mcp-server-service
      container_name: m8flow-mcp-server-service
      helm:
        release_name: m8flow-mcp-server-service
        chart_path: m8flow-charts/charts/m8flow-mcp-server-service
        values_file: ""
      aws:
        role_to_assume: arn:aws:iam::653405621825:role/m8flow-dev-cicd-deploy-role
      health_check:
        enabled: false
        type: k8s
      auto_rollback: false
      atomic: true
      notifications:
        enabled: true

    demo:
      <<: *env_defaults
      namespace: demo
      aws:
        role_to_assume: arn:aws:iam::653405621825:role/m8flow-demo-cicd-deploy-role

    qa:
      <<: *env_defaults
      namespace: qa
      aws:
        role_to_assume: arn:aws:iam::653405621825:role/m8flow-qa-cicd-deploy-role

aws:
  default_region: ca-central-1
  role_to_assume: arn:aws:iam::653405621825:role/m8flow-dev-cicd-deploy-role
