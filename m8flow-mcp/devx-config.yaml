# DevX CD Configuration — m8flow-mcp
# Patches the image of the Helm release m8flow-mcp-server-service
# (chart: m8flow-charts/charts/m8flow-mcp-server-service).

deployment:
  enabled: true
  target: eks
  method: patch                      # Use patch rollout for existing EKS deployments (matching formsflow pattern)

  environments:
    dev: &env_defaults
      enabled: true
      region: ca-central-1
      cluster_name: m8flow-eks
      namespace: dev
      deployment_name: m8flow-mcp-server-service
      container_name: m8flow-mcp-server-service
      helm:
        release_name: m8flow-mcp-server-service
        chart_path: m8flow-charts/charts/m8flow-mcp-server-service
        values_file: ""
      aws:
        role_to_assume: arn:aws:iam::653405621825:role/m8flow-dev-cicd-deploy-role
      # Checked after every deploy; a failure rolls back to the image that
      # ran before it.
      health_check:
        enabled: true
        type: k8s
      auto_rollback: true
      atomic: true
      notifications:
        enabled: true

    demo:
      <<: *env_defaults
      # Not on refactor/next-gen yet: no health check or rollback.
      health_check:
        enabled: false
      auto_rollback: false
      namespace: demo
      aws:
        role_to_assume: arn:aws:iam::653405621825:role/m8flow-demo-cicd-deploy-role

    qa:
      <<: *env_defaults
      # Not on refactor/next-gen yet: no health check or rollback.
      health_check:
        enabled: false
      auto_rollback: false
      namespace: qa
      aws:
        role_to_assume: arn:aws:iam::653405621825:role/m8flow-qa-cicd-deploy-role

aws:
  default_region: ca-central-1
  role_to_assume: arn:aws:iam::653405621825:role/m8flow-dev-cicd-deploy-role
