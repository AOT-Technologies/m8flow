# DevX CI Configuration — m8flow-mcp (m8flow's MCP server)
# Language: Python 3.12 | Dockerfile: m8flow-mcp/Dockerfile (context repo root,
# because the image installs the ../m8flow-telemetry path dependency first)

project:
  language: python
  version: "3.12"
  working_directory: "m8flow-mcp"

build:
  enabled: true
  install_command: "pip install uv ruff==0.15.20"
  run_tests: true
  test_script: "ruff check ."

docker:
  enabled: true
  working_directory: "."            # Build context must be repo root (m8flow-telemetry)
  dockerfile: "m8flow-mcp/Dockerfile"
  image_name: "m8flow-mcp"
  image_tag: ""
  registry_type: ecr
  registry_url: "653405621825.dkr.ecr.us-east-2.amazonaws.com"
  platforms: "linux/amd64"

aws:
  region: us-east-2
  role_to_assume: arn:aws:iam::653405621825:role/GitHubActions-ECS-m8flow

# Every build notifies Google Chat (GOOGLE_CHAT_WEBHOOK): pass, pass with
# findings, or fail, with the image and each scanner's counts. A missing
# webhook fails the run.
notifications:
  enabled: true

security:
  # Every scanner reports all severities in the run summary. "none" blocks on
  # nothing for now, so the existing findings can be fixed first; switch to
  # "critical,high" to fail builds on new critical/high findings.
  gate:
    fail_on: none

  sast:
    enabled: true
    # Both, on purpose. GitHub withholds secrets from fork pull requests,
    # so SonarQube cannot run on them -- and every PR here comes from a
    # fork. semgrep needs no token, so it covers PRs; SonarQube still runs
    # on push to main and releases. Requires devx >= v1.2.1.
    tool: "sonarqube,semgrep"
    # Semgrep rulesets (comma-separated). p/ci, the default, is a minimal
    # high-confidence set that found nothing here.
    ruleset: "p/default,p/python,p/secrets"
    scan_path: "m8flow-mcp"
    sonar_host_url: "https://sonarcloud.io"
    sonar_organization: "aot-technologies"
    sonar_project_key: "AOT-Technologies_m8flow-mcp"
    fail_on_quality_gate: false

  iac:
    enabled: false

  trivy:
    enabled: true
    severity: CRITICAL,HIGH
    fail_on_vuln: false
    ignore_unfixed: true
    scanners: vuln,secret

  sbom:
    enabled: true
    format: cyclonedx-json

  sbom_scan:
    enabled: true
    severity: medium
