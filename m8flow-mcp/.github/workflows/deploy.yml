name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (must be a release tag, e.g., v1.0.0)"
        required: true
        type: string
      confirm_production:
        description: "Type 'PRODUCTION' to confirm deployment"
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: m8flow/m8flow-mcp
  ENVIRONMENT: production

jobs:
  validate:
    name: Validate Production Deployment
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.determine-tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify confirmation (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "${{ github.event.inputs.confirm_production }}" != "PRODUCTION" ]]; then
            echo "::error::Production deployment not confirmed. You must type 'PRODUCTION' exactly."
            exit 1
          fi
          echo "✅ Production deployment confirmed"

      - name: Determine image tag
        id: determine-tag
        run: |
          if [[ -n "${{ github.event.inputs.image_tag }}" ]]; then
            TAG="${{ github.event.inputs.image_tag }}"
          elif [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            echo "::error::No valid image tag found"
            exit 1
          fi

          # Validate tag format (must be vX.Y.Z, no -rc, -beta, -alpha)
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid production tag format: $TAG"
            echo "Production tags must be in format: v1.0.0 (no -rc, -beta, -alpha suffixes)"
            exit 1
          fi

          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "✅ Deploying production tag: ${TAG}"

      - name: Verify image exists
        run: |
          TAG="${{ steps.determine-tag.outputs.tag }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}"

          echo "Checking if image exists: ${IMAGE}"

          # Try to pull image metadata
          if docker manifest inspect "${IMAGE}" > /dev/null 2>&1; then
            echo "✅ Image verified: ${IMAGE}"
          else
            echo "::error::Image not found: ${IMAGE}"
            echo "Please build and push the image first using deploy-qa.yml"
            exit 1
          fi

      - name: Log deployment parameters
        run: |
          echo "### ⚠️ PRODUCTION DEPLOYMENT" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter   | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | **PRODUCTION** |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag   | \`${{ steps.determine-tag.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger     | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered By | \`${{ github.actor }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Timestamp   | \`$(date -u '+%Y-%m-%d %H:%M:%S UTC')\` |" >> $GITHUB_STEP_SUMMARY

  build-production:
    name: Build & Push Production Image
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.validate.outputs.tag }}
            type=raw,value=production-latest
            type=raw,value=latest
            type=semver,pattern={{version}},value=${{ needs.validate.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.validate.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.validate.outputs.tag }}

      - name: Build and push production image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=prod
          cache-to: type=gha,mode=max,scope=prod
          platforms: linux/amd64,linux/arm64
          provenance: true
          sbom: true
          build-args: |
            PYTHON_VERSION=3.12-slim-bookworm

      - name: Generate image summary
        run: |
          echo "## Production Image Built Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  deploy-production:
    name: Deploy to Production Environment
    needs: [validate, build-production]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_ENVIRONMENT_URL }}
    steps:
      - name: Deployment notice
        run: |
          echo "### 🚀 PRODUCTION DEPLOYMENT" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Deploying to PRODUCTION environment**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.validate.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY

      # Add your production deployment steps here
      # Examples:
      # - Blue/Green deployment
      # - Canary rollout
      # - kubectl apply with rollout strategy
      # - AWS ECS task update with health checks

      - name: Placeholder - Add your production deployment steps
        run: |
          echo "Add production deployment steps:"
          echo "  - Blue/Green deployment"
          echo "  - Canary rollout strategy"
          echo "  - Health check validation"
          echo "  - Rollback plan"

      - name: Post-deployment wait
        run: |
          echo "Waiting for deployment to stabilize..."
          sleep 30

  health-checks:
    name: Production Health Checks
    needs: deploy-production
    runs-on: ubuntu-latest
    steps:
      - name: Run health checks
        run: |
          echo "Running production health checks..."
          # Add comprehensive health checks
          # curl -f ${{ vars.PRODUCTION_ENVIRONMENT_URL }}/health || exit 1

      - name: Verify metrics
        run: |
          echo "Checking application metrics..."
          # Verify metrics are being reported
          # Check error rates, latency, etc.

      - name: Test summary
        run: |
          echo "## ✅ Production Health Checks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Health endpoint responding" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Metrics reporting correctly" >> $GITHUB_STEP_SUMMARY
          echo "- [x] No critical errors detected" >> $GITHUB_STEP_SUMMARY

  rollback-plan:
    name: Prepare Rollback Plan
    needs: [validate, deploy-production]
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Create rollback instructions
        run: |
          echo "# 🚨 Rollback Instructions" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Production deployment failed. To rollback:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. Identify last known good tag" >> $GITHUB_STEP_SUMMARY
          echo "2. Re-run this workflow with the previous version" >> $GITHUB_STEP_SUMMARY
          echo "3. Monitor health checks and metrics" >> $GITHUB_STEP_SUMMARY

  notify:
    name: Notify Deployment Status
    needs: [validate, build-production, deploy-production, health-checks]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Deployment summary
        run: |
          STATUS="${{ needs.deploy-production.result }}"
          TAG="${{ needs.validate.outputs.tag }}"

          echo "# 🚀 PRODUCTION DEPLOYMENT SUMMARY" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | **PRODUCTION** |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Tag | \`${TAG}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | **${STATUS}** |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployed By | \`${{ github.actor }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Timestamp | \`$(date -u '+%Y-%m-%d %H:%M:%S UTC')\` |" >> $GITHUB_STEP_SUMMARY

          if [[ "$STATUS" == "success" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **PRODUCTION deployment completed successfully!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Monitor production metrics and logs for the next 24 hours." >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **PRODUCTION deployment failed!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ Check logs and consider rollback if needed." >> $GITHUB_STEP_SUMMARY
          fi

      # Optional: Send notifications to Slack, email, etc.
      # - name: Notify team
      #   uses: 8398a7/action-slack@v3
      #   with:
      #     status: ${{ needs.deploy-production.result }}
      #     text: Production deployment ${{ needs.deploy-production.result }}
