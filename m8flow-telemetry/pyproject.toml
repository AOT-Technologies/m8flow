[project]
name = "m8flow-telemetry"
version = "2.0.0"
description = "Shared OpenTelemetry bootstrap for m8flow Python services"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "AOT Technologies", email = "opensource@aot-technologies.com" }]
dependencies = [
  "opentelemetry-api>=1.27.0",
  "opentelemetry-sdk>=1.27.0",
  "opentelemetry-exporter-otlp>=1.27.0",
  "opentelemetry-instrumentation>=0.48b0",
  "opentelemetry-instrumentation-logging>=0.48b0",
]

[project.urls]
Homepage = "https://github.com/AOT-Technologies/m8flow"
Documentation = "https://github.com/AOT-Technologies/m8flow/tree/main/docs"
Repository = "https://github.com/AOT-Technologies/m8flow"
Issues = "https://github.com/AOT-Technologies/m8flow/issues"
Changelog = "https://github.com/AOT-Technologies/m8flow/blob/main/CHANGELOG.md"

[project.optional-dependencies]
flask = [
  "opentelemetry-instrumentation-flask>=0.48b0",
  "opentelemetry-instrumentation-wsgi>=0.48b0",
  "opentelemetry-instrumentation-requests>=0.48b0",
  "opentelemetry-instrumentation-httpx>=0.48b0",
]
asgi = [
  "opentelemetry-instrumentation-asgi>=0.48b0",
  "opentelemetry-instrumentation-starlette>=0.48b0",
  "opentelemetry-instrumentation-httpx>=0.48b0",
]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/m8flow_telemetry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
