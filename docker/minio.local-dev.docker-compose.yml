services:
  minio-local-dev:
    # MinIO no longer publishes public images (Docker Hub and Quay now 401); use Bitnami legacy builds run as root to match the old official image.
    image: bitnamilegacy/minio:2025.7.23
    user: "0"
    command: minio server /data --console-address ":9001"
    env_file: ../.env
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${MINIO_LOCAL_DEV_API_PORT:-16846}:9000"
      - "${MINIO_LOCAL_DEV_CONSOLE_PORT:-16847}:9001"
    volumes:
      - ${M8FLOW_BACKEND_BPMN_SPEC_ABSOLUTE_DIR:-./data/bpmn}:/data
      - ${M8FLOW_TEMPLATES_STORAGE_DIR:-./data/templates}:/m8flow-templates