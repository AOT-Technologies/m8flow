auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    s3:
      endpoint: m8flow-obs-minio:9000
      region: us-east-1
      access_key_id: m8flow-obs
      secret_access_key: m8flow-obs-secret
      s3forcepathstyle: true
      insecure: true
      bucketnames: loki-data
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 720h
  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  delete_request_store: s3

ruler:
  alertmanager_url: http://localhost:9093

analytics:
  reporting_enabled: false
