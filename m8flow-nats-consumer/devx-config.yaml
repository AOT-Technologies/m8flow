# DevX CD Configuration — m8flow-nats-consumer
# EKS Helm deployment for dev, demo, and qa environments.
# Helm release: m8flow-nats-consumer | Chart: m8flow-charts/charts/m8flow-nats-consumer

# CD is off for this component on purpose. m8flow-charts/charts/m8flow-nats-consumer
# sets image.repository to m8flow/m8flow-backend, so nothing in the cluster runs
# the m8flow/m8flow-nats-consumer image this component builds, and the
# m8flow-nats-consumer workload is patched by m8flow-backend/devx-config.yaml.
# Turn this on once the chart points that workload at this component's image --
# and remove it from additional_workloads in the backend config at the same time,
# or the two components will fight over the same workload.
deployment:
  enabled: false
  target: eks
  method: patch                      # Use patch rollout for existing EKS deployments (matching formsflow pattern)

  environments:
    dev: &env_defaults
      enabled: true
      region: ca-central-1
      cluster_name: m8flow-eks
      namespace: dev
      deployment_name: m8flow-nats-consumer   # the cluster has no m8flow-nats-trigger-consumer
      container_name: m8flow-nats-consumer
      helm:
        release_name: m8flow-nats-consumer
        chart_path: m8flow-charts/charts/m8flow-nats-consumer
        values_file: ""
      aws:
        role_to_assume: arn:aws:iam::653405621825:role/m8flow-dev-cicd-deploy-role
      health_check:
        enabled: false
        type: k8s
      auto_rollback: false
      atomic: true
      notifications:
        enabled: true

    demo:
      <<: *env_defaults
      namespace: demo
      aws:
        role_to_assume: arn:aws:iam::653405621825:role/m8flow-demo-cicd-deploy-role

    qa:
      <<: *env_defaults
      namespace: qa
      aws:
        role_to_assume: arn:aws:iam::653405621825:role/m8flow-qa-cicd-deploy-role

aws:
  default_region: ca-central-1
  role_to_assume: arn:aws:iam::653405621825:role/m8flow-dev-cicd-deploy-role
