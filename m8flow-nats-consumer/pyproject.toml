[project]
name = "m8flow-nats-consumer"
version = "2.0.0"
description = "Standalone NATS consumer service for M8Flow"
readme = "README.md"
requires-python = ">=3.12.1,<3.13"
license = "Apache-2.0"
authors = [{ name = "AOT Technologies", email = "opensource@aot-technologies.com" }]
dependencies = [
    "nats-py[nkeys]>=2.6.0",
    "python-dotenv>=1.0.1",
]

[project.urls]
Homepage = "https://github.com/AOT-Technologies/m8flow"
Documentation = "https://github.com/AOT-Technologies/m8flow/tree/main/docs"
Repository = "https://github.com/AOT-Technologies/m8flow"
Issues = "https://github.com/AOT-Technologies/m8flow/issues"
Changelog = "https://github.com/AOT-Technologies/m8flow/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trigger_event_consumer.py"]
