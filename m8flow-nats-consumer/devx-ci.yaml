# DevX CI Configuration — m8flow-nats-consumer
# Language: Python 3.12 | NATS message consumer worker
# Dockerfile: m8flow-nats-consumer/Dockerfile

project:
  language: python
  version: "3.12"
  working_directory: "m8flow-nats-consumer"

build:
  enabled: true
  install_command: "pip install uv"
  run_tests: true
  test_script: "uv pip install --system ."

docker:
  enabled: true
  working_directory: "m8flow-nats-consumer"
  dockerfile: "Dockerfile"
  image_name: "m8flow/m8flow-nats-consumer"
  image_tag: ""
  # X.Y.Z-rc tags are mutable; keep one level of undo when rebuilt.
  backup_existing_tag: true
  registry_type: generic
  registry_url: "docker.io"
  platforms: "linux/amd64"

security:
  sast:
    enabled: true
    # Both, on purpose. GitHub withholds secrets from fork pull requests,
    # so SonarQube cannot run on them -- and every PR here comes from a
    # fork. semgrep needs no token, so it covers PRs; SonarQube still runs
    # on push to main and releases. Requires devx >= v1.2.1.
    tool: "sonarqube,semgrep"
    scan_path: "m8flow-nats-consumer"
    sonar_host_url: "https://sonarcloud.io"
    sonar_organization: "aot-technologies"
    sonar_project_key: "AOT-Technologies_m8flow-nats-consumer"
    fail_on_quality_gate: false

  iac:
    enabled: false

  trivy:
    enabled: true
    severity: CRITICAL,HIGH
    fail_on_vuln: false
    ignore_unfixed: true
    scanners: vuln,secret

  sbom:
    enabled: true
    format: cyclonedx-json

  sbom_scan:
    enabled: true
    severity: medium
