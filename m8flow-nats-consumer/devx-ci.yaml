# DevX CI Configuration — m8flow-nats-consumer
# Language: Python 3.12 | NATS message consumer worker
# Dockerfile: m8flow-nats-consumer/Dockerfile

project:
  language: python
  version: "3.12"
  working_directory: "m8flow-nats-consumer"

build:
  enabled: false
  run_tests: false

docker:
  enabled: true
  working_directory: "m8flow-nats-consumer"
  dockerfile: "Dockerfile"
  image_name: "m8flow/m8flow-nats-consumer"
  image_tag: ""
  registry_type: generic
  registry_url: "docker.io"
  platforms: "linux/amd64"

security:
  sast:
    enabled: false

  iac:
    enabled: false

  trivy:
    enabled: true
    severity: CRITICAL,HIGH
    fail_on_vuln: false
    ignore_unfixed: true
    scanners: vuln,secret

  sbom:
    enabled: false

  sbom_scan:
    enabled: false
