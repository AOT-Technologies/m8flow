# DevX CI Configuration — m8flow-frontend
# Language: Node.js 20 | React SPA
# Dockerfile: docker/m8flow.frontend.Dockerfile (builds from repo root context)

project:
  language: node
  version: "20"
  working_directory: "m8flow-frontend"

build:
  enabled: true
  # fetch-upstream.sh lives at the repo root and must run from there; the
  # subshell keeps npm ci in this component's directory and makes the command
  # independent of whatever working directory the build module uses.
  install_command: '(cd "$GITHUB_WORKSPACE" && ./bin/fetch-upstream.sh) && npm ci'
  run_tests: true
  test_script: "npm run lint && npm run test:ci"
  build_script: "npm run build"

docker:
  enabled: true
  working_directory: "."            # Build context must be repo root
  dockerfile: "docker/m8flow.frontend.Dockerfile"
  image_name: "m8flow/m8flow-frontend"
  image_tag: ""                     # Smart versioning: main -> <sha>
  # X.Y.Z-rc tags are mutable; keep one level of undo when rebuilt.
  backup_existing_tag: true
  registry_type: generic
  registry_url: "docker.io"
  platforms: "linux/amd64"

security:
  sast:
    enabled: true
    # Both, on purpose. GitHub withholds secrets from fork pull requests,
    # so SonarQube cannot run on them -- and every PR here comes from a
    # fork. semgrep needs no token, so it covers PRs; SonarQube still runs
    # on push to main and releases. Requires devx >= v1.2.1.
    tool: "sonarqube,semgrep"
    scan_path: "m8flow-frontend"
    sonar_host_url: "https://sonarcloud.io"
    sonar_organization: "aot-technologies"
    sonar_project_key: "AOT-Technologies_m8flow-frontend"
    fail_on_quality_gate: false

  iac:
    enabled: false

  trivy:
    enabled: true
    severity: CRITICAL,HIGH
    fail_on_vuln: false
    ignore_unfixed: true
    scanners: vuln,secret

  sbom:
    enabled: true
    format: cyclonedx-json

  sbom_scan:
    enabled: true
    severity: medium
