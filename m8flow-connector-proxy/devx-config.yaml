# DevX CD Configuration — m8flow-connector-proxy
# EKS Helm deployment for dev, demo, and qa environments.
# Helm release: m8flow-connector-proxy | Chart: m8flow-charts/charts/m8flow-connector-proxy

deployment:
  enabled: true
  target: eks
  method: patch                      # Use patch rollout for existing EKS deployments (matching formsflow pattern)

  environments:
    dev: &env_defaults
      enabled: true
      region: ca-central-1
      cluster_name: m8flow-eks
      namespace: dev
      deployment_name: m8flow-connector-proxy
      container_name: m8flow-connector-proxy
      helm:
        release_name: m8flow-connector-proxy
        chart_path: m8flow-charts/charts/m8flow-connector-proxy
        values_file: ""
      health_check:
        enabled: false
        type: k8s
      auto_rollback: false
      atomic: true
      notifications:
        enabled: true

    demo:
      <<: *env_defaults
      namespace: demo

    qa:
      <<: *env_defaults
      namespace: qa

aws:
  default_region: ca-central-1
  role_to_assume: arn:aws:iam::653405621825:role/m8flow-dev-cicd-deploy-role
