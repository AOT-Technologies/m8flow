# DevX CI Configuration — m8flow-connector-proxy
# Language: Python 3.12 | FastAPI proxy service
# Dockerfile: m8flow-connector-proxy/Dockerfile

project:
  language: python
  version: "3.12"
  working_directory: "m8flow-connector-proxy"

build:
  enabled: true
  install_command: "pip install poetry==2.2.1"
  run_tests: true
  test_script: "poetry check --lock"

docker:
  enabled: true
  working_directory: "."
  dockerfile: "m8flow-connector-proxy/Dockerfile"
  image_name: "m8flow/m8flow-connector-proxy"
  image_tag: ""
  registry_type: generic
  registry_url: "docker.io"
  platforms: "linux/amd64"

security:
  sast:
    enabled: true
    tool: sonarqube
    scan_path: "m8flow-connector-proxy"
    sonar_host_url: "https://sonarcloud.io"
    sonar_organization: "aot-technologies"
    sonar_project_key: "AOT-Technologies_m8flow-connector-proxy"
    fail_on_quality_gate: false

  iac:
    enabled: false

  trivy:
    enabled: true
    severity: CRITICAL,HIGH
    fail_on_vuln: false
    ignore_unfixed: true
    scanners: vuln,secret

  sbom:
    enabled: true
    format: cyclonedx-json

  sbom_scan:
    enabled: true
    severity: medium
