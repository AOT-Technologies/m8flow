version: 1
disable_existing_loggers: false

filters:
  tenant_ctx:
    (): m8flow_backend.auth.tenant_context.TenantContextFilter
  request_ctx:
    (): m8flow_backend.observability.request_context.RequestIdFilter
  otel_trace_ctx:
    (): m8flow_backend.observability.logging_json.OtelTraceFilter

formatters:
  default:
    (): m8flow_backend.observability.logging_json.build_formatter

handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: default
    filters: [tenant_ctx, request_ctx, otel_trace_ctx]
    stream: ext://sys.stdout

root:
  level: DEBUG
  handlers: [console]

loggers:
  uvicorn:
    level: INFO
    propagate: true
  uvicorn.error:
    level: INFO
    propagate: true
  uvicorn.access:
    level: INFO
    propagate: true
