# DevX CI Configuration — m8flow-backend
# Language: Python 3.12 | FastAPI / Django REST backend
# Dockerfile: docker/m8flow.backend.Dockerfile (builds from repo root context)

project:
  language: python
  version: "3.12"
  working_directory: "."            # Build context is repo root (Dockerfile uses multi-dir COPY)

build:
  enabled: true
  install_command: "pip install ruff==0.17.2 uv"
  run_tests: true
  # Lint, then the unit tests: uv installs the dev group (and
  # m8flow-core) from uv.lock. Ruff runs from m8flow-backend because
  # ruff.toml's include globs are relative to the working directory; run from
  # the repo root it finds no files. pytest-xdist spreads the tests over cores.
  test_script: "cd m8flow-backend && python -m ruff check . --config ruff.toml && uv sync --group dev && uv run pytest -n auto"

docker:
  enabled: true
  working_directory: "."            # Build context must be repo root
  dockerfile: "docker/m8flow.backend.Dockerfile"
  image_name: "m8flow/m8flow-backend"
  image_tag: ""
  registry_type: generic          # Docker Hub (public m8flow/* repositories)
  registry_url: "docker.io"
  # Docker Hub login through OIDC (DevX >= 1.4.0): no stored password or
  # token. The connection (Docker Home -> m8flow -> OIDC connections) trusts
  # this repository on main; the ID is not a secret.
  registry_username: "m8flow"
  oidc_connection_id: "7af449ca-2b4c-4926-a5d1-82ea3a47eda3"
  platforms: "linux/amd64"
  # The Dockerfile's last stage is `dev`; ship the slim `prod` one.
  target: "prod"


notifications:
  enabled: true

security:
  # Every scanner reports all severities in the run summary. "none" blocks on
  # nothing for now, so the existing findings can be fixed first; switch to
  # "critical,high" to fail builds on new critical/high findings.
  gate:
    fail_on: none

  sast:
    enabled: true
    # Both, on purpose. GitHub withholds secrets from fork pull requests,
    # so SonarQube cannot run on them -- and every PR here comes from a
    # fork. semgrep needs no token, so it covers PRs; SonarQube still runs
    # on push to main and releases. Requires devx >= v1.2.1.
    tool: "sonarqube,semgrep"
    # Semgrep rulesets (comma-separated). p/ci, the default, is a minimal
    # high-confidence set that found nothing here.
    ruleset: "p/default,p/python,p/flask,p/secrets"
    scan_path: "m8flow-backend"
    sonar_host_url: "https://sonarcloud.io"
    sonar_organization: "aot-technologies"
    sonar_project_key: "AOT-Technologies_m8flow-backend"
    fail_on_quality_gate: false

  iac:
    enabled: false

  trivy:
    enabled: true
    severity: CRITICAL,HIGH
    fail_on_vuln: false
    ignore_unfixed: true
    scanners: vuln,secret

  sbom:
    enabled: true
    format: cyclonedx-json

  sbom_scan:
    enabled: true
    severity: medium
