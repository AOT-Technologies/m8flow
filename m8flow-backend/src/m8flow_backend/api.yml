        "500":
          description: Internal server error


  /home-stats:
    get:
      summary: Home-page stat cards
      description: >-
        Real counts/averages for the Home page's 6 stat cards (active
        process instances, tasks waiting on the caller, errors needing
        review, completed today, avg. completion time, total tenants).
        Each field is independently permission-gated to null rather than
        the whole request being all-or-nothing -- a caller who can read
        tasks but not process instances (e.g. the reviewer role) still
        gets a populated tasks_waiting_on_me with the other fields null,
        not a 403. total_tenants is null for non-super-admins. tenantId is
        honored only for super-admins (mirrors /templates' filter_tenant_id);
        for everyone else the caller's own active tenant is used and any
        tenantId is ignored.
      operationId: m8flow_backend.routes.home_controller.get_home_stats
      tags:
        - Home
      parameters:
        - name: tenantId
          in: query
          schema:
            type: string
          description: >-
            Super-admin-only cross-tenant scope override. Omitted/empty
            means "all tenants" for a super-admin; ignored for non-super-admins.
      responses:
        "200":
          description: Home stats retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeStatsResponse"
        "400":
          description: Missing m8flow_selected_tenant cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized - user not authenticated

  /home-recent-instances:
    get:
      summary: Home-page recent process instances
      description: >-
        Recent process instances for the Home page table (tenant name,
        instance id, process display name, start epoch seconds, status).
        Newest first. Status is the raw ProcessInstanceStatus value
        (complete / error / user_input_required / ...); the frontend maps
        those to the mockup labels Complete / Error / User Input Required.
        start_in_seconds is an epoch; the frontend formats relative time
        ("2h ago"). Callers without process-instance read permission get
        an empty list (200), not a 403 -- same Home-still-loads philosophy
        as /home-stats returning null per unauthorized field. tenantId is
        honored only for super-admins (mirrors /home-stats); for everyone
        else the caller's own active tenant is used.
      operationId: m8flow_backend.routes.home_controller.get_home_recent_instances
      tags:
        - Home
      parameters:
        - name: tenantId
          in: query
          schema:
            type: string
          description: >-
            Super-admin-only cross-tenant scope override. Omitted/empty
            means "all tenants" for a super-admin; ignored for non-super-admins.
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 50
          description: Max rows to return (capped at 50).
      responses:
        "200":
          description: Recent instances retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeRecentInstancesResponse"
        "400":
          description: Missing m8flow_selected_tenant cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized - user not authenticated

  /home-my-tasks:
    get:
      summary: Home-page my pending tasks
      description: >-
        Pending tasks assigned to the caller for the Home "My tasks" list
        (title, tenant name, lane/waiting-on, created epoch seconds).
        Oldest-first by id (matches GetPendingTasksQuery). Scoped to the
        caller's own assignments even for super-admins (not every pending
        task system-wide). Callers without task-read permission get an
        empty list (200), not a 403. tenantId is honored only for
        super-admins (mirrors /home-stats); for everyone else the caller's
        own active tenant is used.
      operationId: m8flow_backend.routes.home_controller.get_home_my_tasks
      tags:
        - Home
      parameters:
        - name: tenantId
          in: query
          schema:
            type: string
          description: >-
            Super-admin-only cross-tenant scope override. Omitted/empty
            means "all tenants" for a super-admin; ignored for non-super-admins.
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 50
          description: Max rows to return (capped at 50).
      responses:
        "200":
          description: Pending tasks retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeMyTasksResponse"
        "400":
          description: Missing m8flow_selected_tenant cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized - user not authenticated

  /task-review:
    get:
      summary: Task Review inbox — pending tasks list
      description: >-
        The caller's pending human tasks for the Task Review inbox
        (human_task_id, titles, process model display name, process
        instance id, initiator display name, status, created epoch
        seconds, tenant name). Non-super-admins see only their own
        active-tenant assignments (m8flow_selected_tenant cookie
        required). Super-admins see every tenant's pending tasks, optionally
        scoped with tenantId. Authorized on the /v1.0/tasks surface
        (mirrors home_controller); denied callers get an empty page
        (200), not a 403.
      operationId: m8flow_backend.routes.task_review_controller.list_task_review
      tags:
        - TaskReview
      parameters:
        - name: tenantId
          in: query
          schema:
            type: string
          description: >-
            Super-admin-only cross-tenant scope override. Omitted/empty
            means "all tenants" for a super-admin; ignored for non-super-admins.
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        "200":
          description: Pending task-review rows retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
        "400":
          description: Missing m8flow_selected_tenant cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized - user not authenticated

  /task-review/{human_task_id}:
    get:
      summary: Task Review — composite detail
      description: >-
        One payload for the whole Task Review detail page: task header,
        form (schema + ui-schema + prior values), derived outcome buttons,
        approval chain (completed + current human tasks), activity feed
        (process instance events), and the instance summary. Denied or
        not-visible/missing (including cross-tenant) -> 404, mirroring the
        bare GET /v1.0/tasks/{id} route and GET /process-instances/{id}.
      operationId: m8flow_backend.routes.task_review_controller.get_task_review
      tags:
        - TaskReview
      parameters:
        - name: human_task_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Task review detail retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    type: object
                  form:
                    type: object
                  outcomes:
                    type: array
                    items:
                      type: object
                  approval_chain:
                    type: array
                    items:
                      type: object
                  activity:
                    type: array
                    items:
                      type: object
                  instance:
                    type: object
        "401":
          description: Unauthorized - user not authenticated
        "404":
          description: Task not found (or not permitted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /task-review/{human_task_id}/submit:
    post:
      summary: Task Review — submit (claim-then-complete)
      description: >-
        Atomic claim-then-complete of a Task Review task (reuses
        human_task.submit_external_form). Body accepts optional outcome and
        comment, round-tripped into task data as task_payload (absent keys
        omitted). Authorized on the task-complete surface like
        complete_task. Returns the process instance id + status. Forbidden
        -> 403, not-visible -> 404, already-completed / invalid state -> 409.
      operationId: m8flow_backend.routes.task_review_controller.submit_task_review
      tags:
        - TaskReview
      parameters:
        - name: human_task_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                outcome:
                  type: string
                  description: Selected gateway outcome value (omit for linear tasks).
                comment:
                  type: string
                  description: Optional reviewer comment.
      responses:
        "200":
          description: Task submitted; process instance advanced
          content:
            application/json:
              schema:
                type: object
                properties:
                  process_instance_id:
                    type: integer
                  status:
                    type: string
        "401":
          description: Unauthorized - user not authenticated
        "403":
          description: Not permitted to submit this task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Task not found (or not permitted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Task already completed or invalid state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /capabilities:
    get:
      summary: Current-user UI capability hints
      description: >-
        Advisory capability flags for the signed-in user, computed from the
        same allow_uri gate the routes enforce. Lets the designer show/hide
        affordances (e.g. Start/Delete on Processes) without parsing Keycloak
        token claims. Not an authorization boundary — every write route still
        authorizes on its own.
      operationId: m8flow_backend.routes.capabilities_controller.get_capabilities
      tags:
        - Capabilities
      responses:
        "200":
          description: Capability flags for the current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  can_manage_processes:
                    type: boolean
                  can_read_secrets:
                    type: boolean
                    description: >-
                      Advisory: integrator, viewer, tenant-admin, or super-admin
                      may open Configuration (secrets list/show). Not the HTTP
                      authorization gate.
                  can_manage_secrets:
                    type: boolean
                    description: >-
                      Advisory: tenant-admin, integrator, or super-admin may
                      create/update/delete secrets. Editor must not. Not the
                      HTTP authorization gate.
                  can_read_connectors:
                    type: boolean
                    description: >-
                      Advisory: tenant-admin, editor, integrator, or super-admin
                      may open Setup → Connectors. Not the HTTP authorization
                      gate. Distinct from profile-name reads used by the modeler
                      picker.
                  can_manage_connector_profiles:
                    type: boolean
                    description: >-
                      Advisory: tenant-admin, integrator, or super-admin may
                      create, update, or delete connector profiles. Editor may
                      pick a profile, not create one. Not the HTTP
                      authorization gate.
                  can_manage_tenant:
                    type: boolean
                    description: >-
                      Advisory: tenant-admin of the active tenant, or super-admin,
                      may open Tenant Management. Not the members/groups
                      authorization gate.
        "401":
          description: Unauthorized - user not authenticated

  /process-models:
    get:
      summary: Processes page — enriched process model list
      description: >-
        Designer Processes models table: identity, display names, group,
        last_run_in_seconds, runs_30d. Concrete tenant required (cookie
        and/or tenantId for super-admins); never merges catalogs across
        tenants. Callers without process-model list permission get an
        empty list (200), not a 403. Optional group filters to models
        under that process-group path (unknown group → []). Does not
        replace thin GET /v1.0/process-models.
      operationId: m8flow_backend.routes.processes_controller.list_process_models
      tags:
        - Processes
      parameters:
        - name: tenantId
          in: query
          schema:
            type: string
          description: >-
            Super-admin-only concrete tenant. Required for super-admins
            when m8flow_selected_tenant is unset; ignored for non-super-admins.
        - name: group
          in: query
          schema:
            type: string
          description: Optional process-group path filter.
      responses:
        "200":
          description: Process models retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessModelListResponse"
        "400":
          description: Missing concrete tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized - user not authenticated
    post:
      summary: Processes page — create a process model
      description: >-
        Creates a process model under an existing process group and writes a
        default startable BPMN (`{leaf}.bpmn`). `id` is optional: when omitted,
        the leaf is slugified from `display_name` (same as the previous create
        form). Super-admin is always 403. Distinct from thin POST
        /v1.0/process-models `{path, xml}`.
      operationId: m8flow_backend.routes.processes_controller.create_process_model
      tags:
        - Processes
      parameters:
        - name: tenantId
          in: query
          schema:
            type: string
          description: Super-admin-only concrete tenant override (writes still 403).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessModelCreateRequest"
      responses:
        "201":
          description: Process model created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessModelIdentityResponse"
        "400":
          description: Missing concrete tenant, group, id, or display name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized - user not authenticated
        "403":
          description: Not permitted to create a process model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Process group not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Process model already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /process-groups:
    get:
      summary: Processes page — process groups list
      description: >-
        Designer Process groups picker: id, display_name, description,
        model_count, last_run_in_seconds. Groups are unique model parent
        paths plus directories with process_group.json. Concrete tenant
        required. Callers without process-group list permission get []
        (200), not 403.
      operationId: m8flow_backend.routes.processes_controller.list_process_groups
      tags:
        - Processes
      parameters:
        - name: tenantId
          in: query
          schema:
            type: string
          description: >-
            Super-admin-only concrete tenant. Required for super-admins
            when m8flow_selected_tenant is unset; ignored for non-super-admins.
      responses:
        "200":
          description: Process groups retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessGroupListResponse"
        "400":
          description: Missing concrete tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized - user not authenticated
    post:
      summary: Processes page — create a process group
      description: >-
        Creates a process group directory and process_group.json under the
        tenant spec dir. Nested ids (`parent/child`) create the leaf.
        Super-admin is always 403. Concrete tenant required.
      operationId: m8flow_backend.routes.processes_controller.create_process_group
      tags:
        - Processes
      parameters:
        - name: tenantId
          in: query
          schema:
            type: string
          description: Super-admin-only concrete tenant override (writes still 403).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessGroupCreateRequest"
      responses:
        "201":
          description: Process group created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessGroupListItem"
        "400":
          description: Missing concrete tenant or invalid id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized - user not authenticated
        "403":
          description: Not permitted to create a process group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Process group or process model already uses this id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /process-groups/{modified_process_group_identifier}:
    put:
      summary: Processes page — update process group metadata
      description: >-
        Updates display_name and description only. Path uses colon-encoded
        nested ids (finance:ap). Super-admin is always 403.
      operationId: m8flow_backend.routes.processes_controller.update_process_group
      tags:
        - Processes
      parameters:
        - name: modified_process_group_identifier
          in: path
          required: true
          schema:
            type: string
          description: "Process group path with / replaced by :"
        - name: tenantId
          in: query
          schema:
            type: string
          description: Super-admin-only concrete tenant override (writes still 403).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessGroupUpdateRequest"
      responses:
        "200":
          description: Process group updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessGroupListItem"
        "400":
          description: Missing concrete tenant or invalid id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized - user not authenticated
        "403":
          description: Not permitted to update this process group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Process group not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Processes page — delete a process group
      description: >-
        Deletes the process group directory (and nested models) from the
        tenant spec dir. Blocked with 409 while any process instance still
        references a model in this group. Super-admin is always 403.
      operationId: m8flow_backend.routes.processes_controller.delete_process_group
      tags:
        - Processes
      parameters:
        - name: modified_process_group_identifier
          in: path
          required: true
          schema:
            type: string
          description: "Process group path with / replaced by :"
        - name: tenantId
          in: query
          schema:
            type: string
          description: Super-admin-only concrete tenant override (writes still 403).
      responses:
        "200":
          description: Process group deleted
          content:
            application/json:
              schema:
                type: object
                properties:
