  /process-instances:
    get:
      summary: Process Instances page — list
      description: >-
        Designer Process Instances list: id, process model identity,
        status, started_by, start/end timestamps. Concrete tenant
        required (same posture as GET /process-models — no merged
        all-tenant catalog). Optional status/search filters, real
        pagination. Callers without process-instance list permission get
        an empty page (200), not a 403.
      operationId: m8flow_backend.routes.process_instances_controller.list_process_instances
      tags:
        - ProcessInstances
      parameters:
        - name: tenantId
          in: query
          schema:
            type: string
          description: >-
            Super-admin-only concrete tenant. Required for super-admins
            when m8flow_selected_tenant is unset; ignored for non-super-admins.
        - name: status
          in: query
          schema:
            type: string
          description: Exact status filter (e.g. running, complete, error, waiting).
        - name: search
          in: query
          schema:
            type: string
          description: Case-insensitive substring match on process model identifier/display name.
        - name: started_by
          in: query
          schema:
            type: string
          description: >-
            Exact initiator-username match. Options come from
            GET /process-instances/owners.
        - name: sort
          in: query
          schema:
            type: string
            default: newest
          description: >-
            Result ordering: newest, oldest, recent_start, or status. Unknown
            values fall back to newest-first (the controller degrades gracefully,
            so no enum constraint is enforced here — ticket 03 owns any decision
            to tighten this into a validated enum).
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 25
            maximum: 100
      responses:
        "200":
          description: Process instances retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessInstanceListResponse"
        "400":
          description: Missing concrete tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized - user not authenticated

