  /tenants/{tenant_id}/invitations:
    get:
      summary: List tenant invitations
      description: Lists invitations for the selected tenant. Super Admin only.
      operationId: m8flow_backend.routes.tenant_invitation_controller.list_tenant_invitations
      tags:
        - Tenant
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDING, ACCEPTED, REVOKED, EXPIRED]
          description: Optional status filter
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
