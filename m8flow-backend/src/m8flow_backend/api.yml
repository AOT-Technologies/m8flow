      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
          application/xml:
            schema:
              type: string
          text/markdown:
            schema:
              type: string
          text/plain:
            schema:
              type: string
      responses:
        "200":
          description: File updated, returns the updated template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "400":
          description: Bad request
        "403":
          description: Template is published
        "404":
          description: Template or file not found
        "500":
          description: Internal server error
    delete:
      summary: Delete a template file by name
      description: Remove a file from the template. Template must not be published. Cannot delete last file or only BPMN.
      operationId: m8flow_backend.routes.templates_controller.template_delete_file
      tags:
        - Template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: file_name
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: File deleted
        "403":
          description: Forbidden (published template or last file or only BPMN)
        "404":
          description: Template or file not found
        "500":
          description: Internal server error

  /templates/process-models/{modified_process_model_identifier}/template-info:
    get:
      summary: Get template info for a process model
      description: Returns the template provenance info if the process model was created from a template, or null if no template info exists
      operationId: m8flow_backend.routes.templates_controller.get_process_model_template_info
      tags:
        - Template
      parameters:
        - name: modified_process_model_identifier
          in: path
          required: true
          schema:
            type: string
          description: Process model identifier with slashes replaced by colons
      responses:
        "200":
          description: Template info if the model was created from a template, or null otherwise
          content:
            application/json:
              schema:
                nullable: true
                allOf:
                  - $ref: "#/components/schemas/ProcessModelTemplateInfo"

  /nats-tokens:
    get:
      summary: List NATS API keys for the current tenant
      description: >
        Returns metadata for all of the tenant's NATS API keys (id, label, scope,
        expiry, last-used and revocation timestamps) WITHOUT ever exposing the key
        value. Restricted to tenant-admin (manage) and super-admin (read).
      operationId: m8flow_backend.routes.nats_token_controller.list_tokens
      tags:
        - NATS
      responses:
        "200":
          description: API key metadata (never includes any key value)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NatsApiKeyListResponse"
        "401":
          description: Unauthorized - user not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Create a named NATS API key
      description: >
        Creates a new named API key for the current tenant to use when publishing NATS
        trigger events. Each key is independent, so it can be rotated or revoked without
        affecting other integrations. The key value is returned in this response ONCE and
        can never be retrieved again. Restricted to tenant-admin.
      operationId: m8flow_backend.routes.nats_token_controller.generate_token
      tags:
        - NATS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NatsApiKeyCreateRequest"
      responses:
        "201":
          description: API key created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NatsApiKeyResponse"
        "400":
          description: Bad request - missing label or unsupported expiry/scope value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized - user not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /nats-tokens/{key_id}:
    delete:
      summary: Revoke a single NATS API key
      description: >
        Revokes one NATS API key owned by the current tenant, immediately invalidating it
        while leaving all other keys active. Restricted to tenant-admin.
      operationId: m8flow_backend.routes.nats_token_controller.delete_token
      tags:
        - NATS
      parameters:
        - name: key_id
          in: path
          required: true
          schema:
            type: string
          description: The public id of the API key to revoke.
      responses:
        "200":
          description: Key revoked (or was already revoked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NatsApiKeyRevokeResponse"
        "401":
          description: Unauthorized - user not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found - no key with that id exists for the tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /events/m8flow-trigger:
    post:
      summary: Receive an external trigger event
      description: >
        Webhook endpoint that accepts an external trigger payload, publishes a NATS
        event, and synchronously waits for the process instance to be created.
        Returns the created process instance details. The caller authenticates purely
        with a valid tenant API key (created via POST /api/nats-tokens) in the
        X-M8FLOW-NATS-API-Key header — no JWT is required. The key alone resolves the
        tenant, the owning identity, and the key's scope.
      operationId: m8flow_backend.routes.events_controller.m8flow_trigger
      tags:
        - Events
      security: []
      parameters:
        - name: X-M8FLOW-NATS-API-Key
          in: header
          required: true
          schema:
            type: string
          description: >
            A valid tenant API key obtained from POST /api/nats-tokens. Its secret is
            validated via HMAC-SHA256; the tenant, owning identity, and scope are all
            derived from the key.

        - name: X-M8FLOW-Process-Identifier
          in: header
          required: false
          deprecated: true
          schema:
            type: string
          description: >
            DEPRECATED: the identifier of the process to trigger. Prefer
            ``processIdentifier`` in the request body. Used only as a fallback when the
            body does not carry ``processIdentifier``.

      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/M8flowTriggerRequest"
      responses:
        "200":
          description: Event accepted and process instance created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/M8flowTriggerResponse"
        "202":
          description: Event published to NATS but no reply received from the consumer within the timeout window. The process instance may still be created asynchronously.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/M8flowTriggerResponse"
        "400":
          description: Bad request – missing or malformed body / missing tenant context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: >
            Unauthorized – the X-M8FLOW-NATS-API-Key header is absent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden – X-M8FLOW-NATS-API-Key is invalid, expired, or revoked, or the key is not scoped for the requested process
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Event was published and the consumer processed it, but process instance creation failed due to a validation or process model error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/M8flowTriggerResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /external-forms/{reference_id}:
    get:
      summary: Fetch external form context for a secure link (public)
      description: >
        Public endpoint called by the external form mini-app with the reference ID from
        the emailed secure link. Returns the external form URL and task context. The
        "actionable" flag is false when the link is expired, superseded, or already
        submitted. No authentication is required; the unguessable reference ID is the
        credential.
      operationId: m8flow_backend.routes.external_forms_controller.external_form_show
      tags:
        - ExternalForms
      security: []
      parameters:
        - name: reference_id
          in: path
          required: true
          schema:
            type: string
          description: The unique reference ID from the secure link.
      responses:
        "200":
          description: The external form request context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalFormContextResponse"
        "404":
          description: No external form request exists for this reference ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /external-forms/{reference_id}/submit:
    post:
      summary: Submit external form data and resume the workflow (public)
      description: >
        Public endpoint the external form system calls to submit form data for a
        tracked request. Validates the reference ID, stores the submission, completes
        the tracked user task as the recipient user, and resumes the workflow. Only the
        first valid submission for a task counts; sibling links are superseded.
      operationId: m8flow_backend.routes.external_forms_controller.external_form_submit
      tags:
        - ExternalForms
      security: []
      parameters:
        - name: reference_id
          in: path
          required: true
          schema:
            type: string
          description: The unique reference ID from the secure link.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalFormSubmitRequest"
      responses:
        "200":
          description: Submission accepted; the workflow has continued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalFormSubmitResponse"
        "400":
          description: The tracked task is not in a state that allows submission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No external form request exists for this reference ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: This form was already submitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: The link is expired or was superseded by another recipient's submission.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The submission was stored but the workflow could not be resumed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /connectors-grouped:
    get:
      operationId: m8flow_backend.routes.connectors_controller.connectors_grouped
      summary: Returns service-task operations grouped by connector with metadata
      tags:
        - Connectors
      responses:
        "200":
          description: Grouped connector list with metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /connector-templates:
    get:
      operationId: m8flow_backend.routes.connector_profiles_controller.connector_template_list
      summary: Connector schemas, one descriptor per registered connector
      tags:
        - Connectors
      responses:
        "200":
          description: Connector descriptors
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /connector-templates/{connector_type}:
    parameters:
      - name: connector_type
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: m8flow_backend.routes.connector_profiles_controller.connector_template_show
      summary: One connector schema
      tags:
        - Connectors
      responses:
        "200":
          description: Connector descriptor
          content:
            application/json:
              schema:
                type: object
        "404":
          description: Unknown connector type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /connector-profiles:
    get:
      operationId: m8flow_backend.routes.connector_profiles_controller.connector_profile_list
      summary: Connector profiles for the active tenant
      tags:
        - Connectors
      parameters:
        - name: connector_type
          in: query
          required: false
          schema:
            type: string
        - name: include_inactive
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Profiles. Secret values are never included.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
    post:
      operationId: m8flow_backend.routes.connector_profiles_controller.connector_profile_create
      summary: Create a connector profile
      tags:
        - Connectors
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "201":
          description: The created profile, references only
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A profile of that name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /connector-profiles/{profile_id}:
    parameters:
      - name: profile_id
        in: path
        required: true
        schema:
          type: integer
    get:
      operationId: m8flow_backend.routes.connector_profiles_controller.connector_profile_show
      summary: One connector profile
      tags:
        - Connectors
      responses:
        "200":
          description: The profile, references only
          content:
            application/json:
              schema:
                type: object
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: m8flow_backend.routes.connector_profiles_controller.connector_profile_update
      summary: Update a connector profile
      tags:
        - Connectors
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: The updated profile
          content:
            application/json:
              schema:
                type: object
        "400":
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: m8flow_backend.routes.connector_profiles_controller.connector_profile_delete
      summary: Deactivate a connector profile, or remove it with hard=true
      tags:
        - Connectors
      parameters:
        - name: hard
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Deactivated, or removed
          content:
            application/json:
              schema:
                type: object
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        ok:
          type: boolean
          example: true
        healthy:
          type: boolean
          example: true

    CreateTenantRequest:
      type: object
      required:
        - name
        - slug
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string

    Tenant:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time
        createdBy:
          type: string
        modifiedBy:
          type: string

    TenantResponse:
      $ref: "#/components/schemas/Tenant"

    TenantListResponse:
      type: array
      items:
        $ref: "#/components/schemas/Tenant"

    HomeStatsResponse:
      type: object
      description: >-
        Every field is nullable: null means "the caller isn't permitted to
        see this stat" (see /home-stats' description), not "the value is
        zero".
      properties:
        active_process_instances:
          type: integer
          nullable: true
        tasks_waiting_on_me:
          type: integer
          nullable: true
        errors_needing_review:
          type: integer
          nullable: true
        completed_today:
          type: integer
          nullable: true
        avg_completion_minutes:
          type: number
          nullable: true
        total_tenants:
          type: integer
          nullable: true

    HomeRecentInstance:
      type: object
      properties:
        id:
          type: integer
        tenant_id:
          type: string
        tenant_name:
          type: string
        process_model_display_name:
          type: string
        start_in_seconds:
          type: integer
          nullable: true
        status:
          type: string
          description: >-
            Raw ProcessInstanceStatus value (complete, error,
            user_input_required, running, ...).

    HomeRecentInstancesResponse:
      type: array
      items:
        $ref: "#/components/schemas/HomeRecentInstance"

    HomeMyTask:
      type: object
      properties:
        id:
          type: integer
        task_title:
          type: string
          nullable: true
        task_name:
          type: string
        tenant_id:
          type: string
        tenant_name:
          type: string
        lane_name:
          type: string
          nullable: true
          description: BPMN lane — mockup "waiting on <lane>".
        created_at_in_seconds:
          type: integer
          nullable: true
        process_instance_id:
          type: integer

    HomeMyTasksResponse:
      type: array
      items:
        $ref: "#/components/schemas/HomeMyTask"

    ProcessModelListItem:
      type: object
      required:
        - id
        - display_name
        - group_id
        - group_display_name
        - runs_30d
      properties:
        id:
          type: string
          description: Process model path relative to the tenant catalog root
        display_name:
          type: string
        group_id:
          type: string
          description: Parent process-group path; empty when the model is at tenant root
        group_display_name:
          type: string
        last_run_in_seconds:
          type: integer
          nullable: true
          description: Epoch seconds of the most recent instance start; null if never run
        runs_30d:
          type: integer
          description: Instance starts in the last 30 days

    ProcessModelListResponse:
      type: array
      items:
        $ref: "#/components/schemas/ProcessModelListItem"

    ProcessGroupListItem:
      type: object
      required:
        - id
        - display_name
        - description
        - model_count
      properties:
        id:
          type: string
          description: Process group path (use as ?group= on process-models)
        display_name:
          type: string
        description:
          type: string
        model_count:
          type: integer
        last_run_in_seconds:
          type: integer
          nullable: true
          description: Max last_run across models in this group; null if none

    ProcessGroupListResponse:
      type: array
      items:
        $ref: "#/components/schemas/ProcessGroupListItem"

    ProcessGroupCreateRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: Process group path; nest with parent/child
        display_name:
          type: string
        description:
          type: string

    ProcessGroupUpdateRequest:
      type: object
      properties:
        display_name:
          type: string
        description:
          type: string

    ProcessModelCreateRequest:
      type: object
      required:
        - group_id
      properties:
        id:
          type: string
          description: >-
            Leaf identifier (single path segment). Optional when
            display_name is set; slugified from display_name otherwise.
        group_id:
          type: string
          description: Existing process group path
        display_name:
          type: string
          description: >-
            Human-readable name. Required when id is omitted; used to
            generate the leaf identifier.
        description:
          type: string

    ProcessModelCopyRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: New leaf identifier (single path segment) under the same group
        display_name:
          type: string

    ProcessModelTestRunResponse:
      type: object
      required:
        - all_passed
        - passing
        - failing
      properties:
        all_passed:
          type: boolean
        passing:
          type: array
          items:
            $ref: "#/components/schemas/ProcessModelTestCaseResult"
        failing:
          type: array
          items:
            $ref: "#/components/schemas/ProcessModelTestCaseResult"

    ProcessModelTestCaseResult:
      type: object
      properties:
        passed:
          type: boolean
        bpmn_file:
          type: string
        test_case_identifier:
          type: string
        test_case_error_details:
          type: object
          nullable: true

    ScriptUnitTestListResponse:
      type: object
      properties:
        tests:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              bpmn_task_identifier:
                type: string

    ScriptUnitTestCreateRequest:
      type: object
      required:
        - bpmn_task_identifier
      properties:
        bpmn_task_identifier:
          type: string
        input_json:
          type: object
        expected_output_json:
          type: object

    ScriptUnitTestCreateResponse:
      type: object
      properties:
        ok:
          type: boolean
        id:
          type: string

    ScriptUnitTestRunRequest:
      type: object
      properties:
        unit_test_id:
          type: string
        python_script:
          type: string
        input_json:
          type: object
        expected_output_json:
          type: object

    ScriptUnitTestRunResponse:
      type: object
      properties:
        result:
          type: boolean
        context:
          type: object
          nullable: true
        error:
          type: string
          nullable: true
        line_number:
          type: integer
          nullable: true

    ProcessModelUpdateRequest:
      type: object
      properties:
        display_name:
          type: string
        description:
          type: string
        primary_file_name:
          type: string
          description: Existing file in the model directory to mark primary

    ProcessModelIdentityResponse:
      type: object
      required:
        - id
        - display_name
        - description
        - group_id
        - group_display_name
      properties:
        id:
          type: string
        display_name:
          type: string
        description:
          type: string
        group_id:
          type: string
        group_display_name:
          type: string

    ProcessModelDetailRecentInstance:
      type: object
      required:
        - id
        - started_by
        - status
      properties:
        id:
          type: integer
        started_by:
          type: string
        start_in_seconds:
          type: integer
          nullable: true
        duration_seconds:
          type: integer
          nullable: true
        status:
          type: string

    ProcessModelDetailFile:
      type: object
      required:
        - name
        - size_bytes
        - updated_at_in_seconds
        - primary
      properties:
        name:
          type: string
        size_bytes:
          type: integer
        updated_at_in_seconds:
          type: integer
        primary:
          type: boolean

    ProcessModelDetailResponse:
      type: object
      required:
        - id
        - display_name
        - description
        - group_id
        - group_display_name
        - running_now
        - runs_30d
        - recent_instances
        - files
      properties:
        id:
          type: string
        display_name:
          type: string
        description:
          type: string
        group_id:
          type: string
        group_display_name:
          type: string
        last_run_in_seconds:
          type: integer
          nullable: true
        running_now:
          type: integer
        runs_30d:
          type: integer
        recent_instances:
          type: array
          items:
            $ref: "#/components/schemas/ProcessModelDetailRecentInstance"
        files:
          type: array
          items:
            $ref: "#/components/schemas/ProcessModelDetailFile"

    ProcessModelFileSaveResponse:
      type: object
      required:
        - name
        - size_bytes
        - updated_at_in_seconds
      properties:
        name:
          type: string
        size_bytes:
          type: integer
        updated_at_in_seconds:
          type: integer

    ProcessModelFileCreateRequest:
      type: object
      required:
        - file_name
      properties:
