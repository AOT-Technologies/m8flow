# DevX CD Configuration — m8flow-backend
# EKS Helm deployment for dev, demo, and qa environments.
# Helm release: m8flow-backend | Chart: m8flow-charts/charts/m8flow-backend

deployment:
  enabled: true
  target: eks
  method: patch                      # Use patch rollout for existing EKS deployments (matching formsflow pattern)

  environments:
    dev: &env_defaults
      enabled: true
      region: ca-central-1
      cluster_name: m8flow-eks
      namespace: dev
      deployment_name: m8flow-backend
      container_name: m8flow-backend
      # The backend image is the runtime for five workloads -- the API plus the
      # celery, notification and NATS consumers (see m8flow-charts values.yaml,
      # all of which set image.repository to m8flow/m8flow-backend). Patching
      # only m8flow-backend would leave four of them on the previous release.
      additional_workloads:
        - name: m8flow-celery-worker
          container: m8flow-celery-worker
        - name: m8flow-celery-flower
          container: m8flow-celery-flower
        - name: m8flow-notification-worker
          container: m8flow-notification-worker
        - name: m8flow-nats-consumer
          container: m8flow-nats-consumer
      helm:
        release_name: m8flow-backend
        chart_path: m8flow-charts/charts/m8flow-backend
        values_file: ""
      aws:
        role_to_assume: arn:aws:iam::653405621825:role/m8flow-dev-cicd-deploy-role
      # Checked after every deploy; a failure rolls back to the image that
      # ran before it.
      health_check:
        enabled: true
        type: http
        url: https://sandbox.m8flow.ai/api/v1.0/readyz
        retries: 10
        retry_interval: 15
      auto_rollback: true
      atomic: true
      notifications:
        enabled: true

    demo:
      <<: *env_defaults
      # Not on refactor/next-gen yet: no health check or rollback.
      health_check:
        enabled: false
      auto_rollback: false
      namespace: demo
      aws:
        role_to_assume: arn:aws:iam::653405621825:role/m8flow-demo-cicd-deploy-role

    qa:
      <<: *env_defaults
      # Not on refactor/next-gen yet: no health check or rollback.
      health_check:
        enabled: false
      auto_rollback: false
      namespace: qa
      aws:
        role_to_assume: arn:aws:iam::653405621825:role/m8flow-qa-cicd-deploy-role

aws:
  default_region: ca-central-1
  role_to_assume: arn:aws:iam::653405621825:role/m8flow-dev-cicd-deploy-role
